<style>
/* 차차차와 같은 디자인 기준(색·글자·버튼)을 이 파일 안에 옮겨 둔 것 */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--raised:#F0F2F5;--line:rgba(20,30,50,.10);
  --t1:#151A22;--t2:#4B5361;--t3:#6B7382;

  --ok:#1D7A46;--warn:#A8620B;--bad:#C0392B;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-ctl:8px;--r-card:12px;--ease:cubic-bezier(.2,.8,.2,1);--t-fast:120ms;--navh:60px
}
html[data-theme="dark"]{
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#747C8A;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --ok:#4CC282;--warn:#E0A04A;--bad:#EF7A6C;color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scrollbar-gutter:stable;min-height:100%} /* 스크롤바 자리를 늘 비워 둬서, 스크롤바가 생기고 사라져도 고정 버튼이 밀리지 않음 */
html,body{font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--t1)}
body{margin:0;padding-bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom))} /* 아래 96px: 오른쪽 아래 말만해요 버튼에 취소·저장·보내기 버튼이 가리지 않게 */
button,input,select,textarea{font-family:var(--font)}
button{color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:56px;display:flex;align-items:center;font-size:17px;font-weight:600}
header small{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:8px}

.sub{color:var(--t2);font-size:13px;line-height:1.45}

.btn{display:inline-flex;align-items:center;justify-content:center;height:34px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t2);font-size:13px;font-weight:600;line-height:1;white-space:nowrap}
.btn:active{background:var(--raised)}
.btn.pri{border-color:var(--accent);color:var(--accent)}

label{display:block;font-size:13px;color:var(--t3);margin:12px 0 4px}

textarea:focus,input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=password],input[type=text],input:not([type]),select{width:100%;height:34px;padding:0 10px;font:inherit;font-size:14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t1)}

.mic{width:76px;height:76px;padding:0;border:0;border-radius:50%;margin:8px auto 4px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 9px var(--accent-weak)}

.mic:disabled{opacity:.4}
.ast{margin:0 0 12px;font-size:13px;color:var(--t3);text-align:center}

nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 8px max(0px,calc(env(safe-area-inset-bottom) - 10px))}
nav button{flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:none;position:relative;font-size:11px;font-weight:500;color:var(--t3)}

#mod{position:fixed;inset:0;z-index:20;background:var(--surface);display:flex;flex-direction:column}

.xbtn{width:40px;height:40px;border:0;border-radius:var(--r-ctl);background:none;color:var(--t3);display:flex;align-items:center;justify-content:center}

.mfl{position:absolute;z-index:2;top:calc(12px + env(safe-area-inset-top));left:max(20px,env(safe-area-inset-left));width:40px;height:40px;padding:0;border:1px solid var(--line);border-radius:50%;background:var(--surface);color:var(--t1);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 6px rgba(0,0,0,.15)}

.mfl svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.mfl.pill{left:auto;right:max(20px,env(safe-area-inset-right));width:auto;height:32px;padding:0 12px;border-radius:16px;font-size:12px;font-weight:600;color:var(--t2)}
#modbody iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--surface)}
#fab{position:fixed;right:max(24px,env(safe-area-inset-right));bottom:var(--fabl,calc(var(--fabb,72px) + env(safe-area-inset-bottom)));z-index:42;width:56px;height:56px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.2);transition:transform var(--t-fast) var(--ease),bottom 200ms var(--ease)}
#fab:active{transform:scale(.96)}
#fab.rec{background:var(--bad);color:#fff}
#fab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#scrim{position:fixed;inset:0;z-index:40;background:rgba(10,14,20,.4);opacity:0;visibility:hidden;transition:opacity 200ms,visibility 0s linear 200ms}
#scrim.open{opacity:1;visibility:visible;transition-delay:0s}
#sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;width:max(70vw,min(320px,100vw));height:auto;min-height:300px;max-height:56vh;max-height:56dvh;z-index:41;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(100%);visibility:hidden;transition:transform 240ms var(--ease),visibility 0s linear 240ms}
#sheet.open{transform:none;visibility:visible;transition-delay:0s}
#sheet .modbar{border-radius:16px 16px 0 0;padding-top:4px}
#sheetBody{flex:1;min-height:0;overflow:auto;padding:4px 16px 16px}
#sheetBody.hascard{padding-bottom:128px} /* 카드가 있을 땐 아래를 비워 마이크 버튼에 안 가리게 */
#sheetBody .acts{margin-top:8px;justify-content:center}
#sheetBody .acts .btn{flex:0 1 220px} /* 보내기 버튼은 가운데 */
#sheetBody .card{background:transparent;border:0;padding:8px 0;margin-bottom:0}
#sheetBody textarea{min-height:68px;height:68px}
#sheetBody .ast{margin:0 0 4px}
#sheetBody .ast:empty{display:none}
@media (prefers-reduced-motion:reduce){#sheet,#scrim,#fab{transition:none}}
</style>

<script>

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ================= 1. 민감정보 걸러내기 (AI로 보내기 전에 앱에서 먼저) ================= */
const Sens={
  rules:[
    {name:"주민등록번호",re:/(?<!\d)\d{2}(?:0[1-9]|1[0-2])(?:0[1-9]|[12]\d|3[01])[-\s]?[1-8]\d{6}(?!\d)/g},
    {name:"카드번호",re:/(?<!\d)(?:\d{4}[-\s]?){3}\d{4}(?!\d)/g,check:s=>luhn(s.replace(/\D/g,""))},
    {name:"계좌번호",re:/(?:계좌|통장|입금|송금)[^\d\n]{0,10}[\d][\d\- ]{7,16}\d/g},
    {name:"비밀번호·인증번호",re:/(?:비밀번호|비번|패스워드|암호|인증\s?번호|인증\s?코드|보안\s?코드|OTP|otp|pin|PIN|CVC|cvc)[^\d\n]{0,8}[\w!@#$%^&*]{3,}/g},
    {name:"API 키",re:/\b(?:sk-[A-Za-z0-9_-]{16,}|AIza[0-9A-Za-z_-]{30,}|gh[pousr]_[A-Za-z0-9]{30,}|xox[abp]-[A-Za-z0-9-]{10,}|AKIA[0-9A-Z]{12,}|ya29\.[0-9A-Za-z_-]{20,}|eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{5,})/g}
  ],
  // 가림 처리한 글, 가려진 종류 목록을 돌려줌
  mask(text){
    let out=String(text||""),hit=[];
    for(const r of this.rules){
      out=out.replace(r.re,m=>{if(r.check&&!r.check(m))return m;if(!hit.includes(r.name))hit.push(r.name);return"["+r.name+" 가림]"});
    }
    return{text:out,hit};
  }
};
function luhn(n){if(n.length<13||n.length>19)return false;let s=0,d=false;for(let i=n.length-1;i>=0;i--){let x=+n[i];if(d){x*=2;if(x>9)x-=9}s+=x;d=!d}return s%10===0}

  kinds:[
   {id:"video",label:"영상·음악",fields:["title","date","note"],words:{영화:3,드라마:3,예능:2,유튜브:3,넷플릭스:3,웨이브:2,티빙:2,노래:3,음악:3,앨범:2,봤:1,들었:1,시청:2,재밌:1,감동:1,플레이리스트:2}},

   {id:"trip",label:"여행",fields:["title","date","note"],words:{여행:4,숙소:3,호텔:3,펜션:3,비행기:3,항공:2,캠핑:3,휴가:2,해외:2,제주:2,부산:1,강릉:1,일본:1,오사카:2,도쿄:2,다녀왔:2,관광:2}},

const todayStr=()=>iso(new Date());

  else if(/모레/.test(t))f.date=addDays(2);else if(/내일/.test(t))f.date=addDays(1);else if(/오늘/.test(t))f.date=addDays(0);
  const wd="일월화수목금토";let m;
  if((m=t.match(/(다음\s?주|이번\s?주|돌아오는)?\s?([일월화수목금토])요일/))){
    const target=wd.indexOf(m[2]);let diff=(target-now.getDay()+7)%7;
    if(m[1]&&/다음/.test(m[1])){diff=(target-now.getDay()+7)%7+7;if(diff<7)diff+=7}
    f.date=addDays(diff);
  }
  if((m=t.match(/(\d{1,2})\s?월\s?(\d{1,2})\s?일/))){const y=now.getFullYear();f.date=y+"-"+String(+m[1]).padStart(2,"0")+"-"+String(+m[2]).padStart(2,"0")}
  if((m=t.match(/(오전|오후|저녁|아침)?\s?(\d{1,2})\s?시\s?(?:(\d{1,2})\s?분|반)?/))){
    let h=+m[2];const min=m[3]?+m[3]:(/시\s?반/.test(m[0])?30:0);
    if(/오후|저녁/.test(m[1]||"")&&h<12)h+=12;if(/오전|아침/.test(m[1]||"")&&h===12)h=0;
    if(!m[1]&&h>=1&&h<=6)h+=12; // '3시'는 보통 오후
    if(h<24)f.time=String(h).padStart(2,"0")+":"+String(min).padStart(2,"0");
  }
  if((m=t.match(/([\d,]+(?:\.\d+)?)\s?(?:km|킬로)/i)))f.km=+m[1].replace(/,/g,"");
  if(!f.km&&/누적|주행거리|계기판|오도미터/.test(t)&&(m=t.match(/(\d[\d,]{3,})(?!\s?원)/)))f.km=+m[1].replace(/,/g,""); // 단위 없이 "누적 235000"
  const carN=t.match(/하양이|빨강이/);

  if(!f.km&&carN&&!/충전|주유|기름|정비|수리|타이어|오일|세차|보험|검사|교체|점검|리터|kwh|원|%|시간|분|월|일|주/i.test(t.replace(/\d+\s?만\s?\d/g,""))){ // "하양이 206260" "하양이 206,260" "하양이 20만 6260" → 주행거리(km)
    let v=null;
    if((m=t.match(/(\d{1,3})\s?만\s?(\d{1,4})(?!\d)/)))v=+m[1]*10000+ +m[2];
    else if((m=t.match(/(?<![\d,.])(\d{1,3}(?:,\d{3})+|\d{4,7})(?![\d,.])/)))v=+m[1].replace(/,/g,"");

  else if((m=t.match(/([\d,]+)\s?원/)))f.cost=+m[1].replace(/,/g,"");
  return f;
}

const GEMINI_MODEL_DEFAULT="gemini-3.5-flash"; // 모델·무료 한도는 바뀔 수 있어 설정 화면에서 바꿀 수 있게 함

    "\nJSON으로만 답해라: {\"app\":앱id,\"kind\":kind,\"confidence\":\"high\"|\"low\",\"alt\":[{\"app\":..,\"kind\":..}]}. 앱 목록에 없는 값은 쓰지 마라. 확신이 없으면 confidence는 low.";

function salesIntent(t){ // 신한FC 영업 화면: "이달이관 보여줘", "이번달이관", "지난달 이관 고객", "따행 보여줘" (q=이관|따행 탭, id=YYYY-MM 달)

function navIntent(t){
  {const s=analysisIntent(t);if(s)return s}

  if(/고객/.test(t))return{app:"shinhanfc",go:"customers",q:toks(t.replace(new RegExp(SENS.source,"g")," ")).join(" ").slice(0,30),kind:"",memo:SENS.test(t)?"":"1",label:"고객 검색"}; // 이름 검색은 신한FC 전체검색(이름·연락처·주소·메모·상담기록·일정)으로

/* ===== 모듈 틀 =====
   아래 앱(신한FC·항상일상)의 지금 화면을 말만해요 안에 화면 전체 iframe으로 띄움(같은 주소라 공통 로그인으로 바로 열림).
   한 번 띄운 iframe은 숨겨 두고 다시 씀. 새 요청은 postMessage. 검색어·고객 키는 # 뒤에 둠(서버로 안 나감). */
const MODS={}; // 앱 번호 → {frame, ready, where}
let suppressOpen=false,modApp=null,sheetOpen=false,modPushed=false,sheetPushed=false,ignorePop=false;
const modHash=o=>{const p=new URLSearchParams();["go","q","kind","id","month","car","memo","tab"].forEach(k=>{if(o[k])p.set(k,o[k])});return p.toString()};
function updateFab(){
  const m=modApp&&MODS[modApp],r=document.documentElement.style;
  $("#fab").hidden=!(db&&$("#login").hidden)||(!sheetOpen&&!!(m&&m.fabHide));
  $("#fab").classList.toggle("rec",!!listening);
  $("#fab").setAttribute("aria-label",sheetOpen?"말로 입력":"말만해요 열기");
  // 앱의 떠 있는 버튼과 겹치면 위로: 바닥에서 max(16, lift+12)px, 화면 위 절반은 넘지 않게. lift 0이면 원래 자리
  if(m&&m.fabLift>0)r.setProperty("--fabl","min(50vh,"+Math.max(16,m.fabLift+12)+"px)");else r.removeProperty("--fabl");
} // 앱을 연 뒤에는 늘 오른쪽 아래에 떠 있음
function pushLayer(){try{history.pushState({ot:1},"");return true}catch(e){return false}}
let popCb=null,popT=null;
// 우리가 쌓은 history 칸을 걷는다. 끝난(popstate) 뒤에 cb를 부름: 그 전에 앱 iframe에 메시지를 보내면 앱의 history.back()이 이 칸을 대신 걷어 버려 검색이 안 먹음
function popLayer(cb){
  ignorePop=true;popCb=cb||null;
  clearTimeout(popT);popT=setTimeout(()=>{if(popCb){const c=popCb;popCb=null;ignorePop=false;c()}},400); // popstate가 안 오는 경우의 안전장치
  try{history.back()}catch(e){ignorePop=false;const c=popCb;popCb=null;c&&c()}
}
function showMod(app){
  modApp=app;
  Object.keys(MODS).forEach(k=>{MODS[k].frame.hidden=k!==app;MODS[k].fabHide=false;MODS[k].fabLift=0}); // 다른 모듈로 바뀌면 버튼 원래 자리
  if(!modPushed)modPushed=pushLayer();

const ADDACK={};
function sendAdd(app,item){ // 앱 화면에 "이 기록을 바로 넣어 줘"(blue10kp-add)를 보냄. 편지는 이미 받은편지함에 있어 앱이 못 받아도 열 때 반영됨(같은 id는 앱이 한 번만 넣음)
  let n=0;
  const tick=()=>{
    const m=MODS[app];if(ADDACK[String(item.id)]||++n>12)return;
    if(m&&m.ready){try{m.frame.contentWindow.postMessage({type:"blue10kp-add",id:item.id,kind:item.kind,fields:item.fields,text:item.text,at:item.at},location.origin)}catch(e){}}
    setTimeout(tick,1500);
  };
  setTimeout(tick,600);

function openModule(n){
  const dir=APPDIR[n.app];if(!dir)return false;
  const req={go:n.go,q:n.q||"",kind:n.kind||"",id:n.id||"",month:n.month||"",car:n.car||"",memo:n.memo||"",tab:n.tab||""};
  if(sheetOpen){closeSheet(false,()=>deliverModule(n,dir,req));return true} // 묻는 창이 쌓은 history 칸을 먼저 걷은 뒤에 앱에 전달
  deliverModule(n,dir,req);return true;
}
function deliverModule(n,dir,req){
  let m=MODS[n.app];
  const expKey=whereKey({go:req.go,q:req.q,kind:req.kind,id:req.id,month:req.month,car:req.car});
  if(!m){
    const f=document.createElement("iframe");f.title=adapter(n.app).name;f.setAttribute("allow","microphone");
    m=MODS[n.app]={frame:f,ready:false,where:{app:n.app,...req},stack:[],restoring:null};
    f.addEventListener("load",()=>{m.ready=true});
    f.src=dir+"?embed=1&theme="+curTheme()+"&t="+Date.now()+"#"+modHash(req);
    $("#modbody").appendChild(f);
  }else{
    m.where={app:n.app,...req};
    if(m.ready){try{m.frame.contentWindow.postMessage({type:"blue10kp-go",...req},location.origin)}catch(e){}}
    else m.frame.src=dir+"?embed=1&theme="+curTheme()+"&t="+Date.now()+"#"+modHash(req); // 아직 읽는 중이면 새 주소로
  }
  if(m.stack.length){ // 이미 화면 기록이 있으면: 요청한 화면이 도착할 때까지 중간 화면은 건너뜀(1.5초 안전장치)
    m.expect=expKey;
    setTimeout(()=>{if(m.expect===expKey){m.expect=null;if(m.where&&m.where.go)pushWhere(m,m.where)}},1500);
  }
  showMod(n.app);
}
/* 뒤로: 모듈 안에서 본 화면을 차례로 기억(stack)했다가 "바로 전에 본 화면"을 앱에 다시 열라고 요청한다.
   예) 김현성 검색 → 김현성 고객정보 → 최수진 검색 에서 뒤로 = 김현성 고객정보 */
function pushWhere(m,w){
  const k=whereKey(w),top=m.stack[m.stack.length-1];
  if(top&&top.k===k)top.w=w;else{m.stack.push({k,w});if(m.stack.length>30)m.stack.shift()}
}
const whereKey=w=>[w.go,w.q,w.kind,w.id,w.month,w.car].map(x=>x||"").join("|");
function modBackStep(){ // 모듈 안에서 처리했으면 true, 더 갈 곳이 없으면 false
  const m=modApp&&MODS[modApp];if(!m)return false;
  if(m.stack.length>1){
    m.stack.pop();const prev=m.stack[m.stack.length-1].w;
    m.where={...prev};m.restoring=whereKey(prev);
    setTimeout(()=>{m.restoring=null},1500);
    try{m.frame.contentWindow.postMessage({type:"blue10kp-go",go:prev.go,q:prev.q||"",kind:prev.kind||"",id:prev.id||"",month:prev.month||"",car:prev.car||""},location.origin)}catch(e){return false}
    return true;
  }
  if(m.where&&m.where.canBack){try{m.frame.contentWindow.postMessage({type:"blue10kp-back"},location.origin);return true}catch(e){return false}}
  return false;
}
function modBack(){if(!modBackStep())closeMod()}
function closeMod(skipHist){

const NOT_NAME=/^(이번|오늘|내일|어제|모레|주말|다음|지난|정기|보험|고객|차량|하루|우리|아침|오전|오후|저녁|점심|전화|연락|상담|미팅|방문|면담|만남)/;

/* ================= 4. 저장소 (구글 드라이브 / 시험용 메모리) ================= */

   이 토큰은 구글 API 호출과, 내가 만든 Claude 중계 서버(허용된 이메일만 통과)에만 보냄. 파일에 저장하지 않음. Gemini 키는 여기 넣지 않음 */
const GK="blue10kp.gauth",GAC="onething.gaccount",OLDTK="onething.gtoken";
const GA="https://www.googleapis.com/auth/";
const SUP={ // 필요한 권한 → 그것을 포함하는 더 넓은 권한
  [GA+"drive"]:[GA+"drive"],
  [GA+"calendar.events"]:[GA+"calendar.events",GA+"calendar"],
  [GA+"calendar.calendarlist.readonly"]:[GA+"calendar.calendarlist.readonly",GA+"calendar.calendarlist",GA+"calendar.readonly",GA+"calendar"]};
const hasScopes=have=>Object.keys(SUP).every(n=>SUP[n].some(s=>(have||[]).includes(s)));
let gTok=null,DEMO=false,gAuthMem=null,authSeen=false;
function readAuth(){
  try{const a=JSON.parse(localStorage.getItem(GK)||"null");if(a&&a.v===1&&a.token&&a.exp&&Array.isArray(a.scopes))return a}catch(e){}
  return null;
}
function writeAuth(a){gAuthMem=a;try{localStorage.setItem(GK,JSON.stringify(a))}catch(e){}}
function curAuth(){return readAuth()||gAuthMem}
function storedTok(){const a=curAuth();return a&&a.exp>Date.now()+60000?a.token:null}
function clearTok(){try{localStorage.removeItem(GK)}catch(e){}gAuthMem=null;gTok=null}
function migrateOld(){ // 예전 전용 토큰을 한 번만 공통 키로 옮김
  try{
    const o=JSON.parse(localStorage.getItem(OLDTK)||"null");
    if(o&&o.token&&o.exp>Date.now()+120000&&!readAuth())writeAuth({v:1,token:o.token,exp:o.exp,scopes:[GA+"drive"],email:gAcct()});
    localStorage.removeItem(OLDTK);
  }catch(e){}
}
const gAcct=()=>{try{return localStorage.getItem(GAC)||""}catch(e){return""}};
function requestTok(prompt,noHint){
  return new Promise((res,rej)=>{
    const g=window.google&&google.accounts&&google.accounts.oauth2;
    if(!g)return rej(new Error("구글 로그인 모듈을 불러오지 못했습니다. 잠시 후 다시 시도하세요."));
    const c=g.initTokenClient({client_id:GCLIENT,scope:GSCOPE,include_granted_scopes:true,hint:noHint?undefined:((curAuth()||{}).email||gAcct()||undefined),
      callback:r=>{
        if(r.error)return rej(new Error("구글 연결 실패: "+r.error));
        if(!g.hasGrantedAllScopes(r,"https://www.googleapis.com/auth/drive"))return rej(new Error("Google Drive 권한을 허용해야 합니다. 다시 로그인하면서 모든 항목에 체크해 주세요."));
        writeAuth({v:1,token:r.access_token,exp:Date.now()+(r.expires_in||3600)*1000,scopes:String(r.scope||"").split(/\s+/).filter(Boolean),email:noHint?"":gAcct()});
        authSeen=true;gTok=r.access_token;res(r.access_token);
      },
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"구글 로그인 창이 닫혔습니다.":"구글 로그인 창을 열 수 없습니다. 팝업 차단을 확인하세요."))});
    c.requestAccessToken({prompt:prompt==null?"":prompt});

async function gfetch(url,opt,asText){
  let t=storedTok();if(!t)throw new Error("GOOGLE_AUTH");
  const o=opt||{},go1=tk=>fetch(url,{...o,headers:{Authorization:"Bearer "+tk,...(o.headers||{})},cache:"no-store"});
  let r=await go1(t);
  if(r.status===401){
    const n=storedTok(); // 다른 앱이 새로 로그인했으면 그 토큰으로 이어서
    if(n&&n!==t)r=await go1(n);
    if(r.status===401){if(!n||n===t)clearTok();throw new Error("GOOGLE_AUTH")}
  }
  if(!r.ok)throw new Error("Google "+r.status+": "+(await r.text()).slice(0,160));
  return asText?r.text():r.json();
}
const qv=x=>String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const parseDoc=t=>JSON.parse(t.replace(/^﻿/,""));
const Drive={
  dirs:{}, files:{},
  async find(parent,name,folder){
    const q="'"+qv(parent)+"' in parents and name='"+qv(name)+"' and trashed=false"+(folder?" and mimeType='application/vnd.google-apps.folder'":"");
    const d=await gfetch(DAPI+"/files?pageSize=10&fields="+encodeURIComponent("files(id,name,modifiedTime)")+"&q="+encodeURIComponent(q));
    return(d.files||[])[0]||null;
  },
  async dir(path,create){ // ["Claude","app","onething","설정"] → 폴더 번호
    const key=path.join("/");if(this.dirs[key])return this.dirs[key];
    let id="root";
    for(let i=0;i<path.length;i++){
      const k=path.slice(0,i+1).join("/");
      if(this.dirs[k]){id=this.dirs[k];continue}
      let f=await this.find(id,path[i],true);
      if(!f){if(!create)return null;f=await gfetch(DAPI+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:path[i],mimeType:"application/vnd.google-apps.folder",parents:[id]})})}
      id=this.dirs[k]=f.id;
    }
    return id;
  },
  async read(path,name){ // 없으면 null
    const fo=await this.dir(path,false);if(!fo)return null;
    const f=await this.find(fo,name,false);if(!f)return null;
    this.files[path.join("/")+"/"+name]=f.id;
    return parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));
  },
  async write(path,name,obj){
    const fo=await this.dir(path,true),key=path.join("/")+"/"+name,body=JSON.stringify(obj,null,1);
    let id=this.files[key];
    if(!id){const f=await this.find(fo,name,false);if(f)id=this.files[key]=f.id}
    if(id){await gfetch(DUP+"/files/"+id+"?uploadType=media&fields=id",{method:"PATCH",headers:{"Content-Type":"application/json"},body});return}
    const bd="one"+uid();
    const mp="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,parents:[fo],mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
    const m=await gfetch(DUP+"/files?uploadType=multipart&fields=id",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});
    this.files[key]=m.id;
  }
};
const Mem={d:{}, async read(p,n){const v=this.d[p.join("/")+"/"+n];return v?JSON.parse(v):null}, async write(p,n,o){this.d[p.join("/")+"/"+n]=JSON.stringify(o)}};

  const u=await gfetch("https://www.googleapis.com/oauth2/v3/userinfo");
  const em=String(u.email||"").toLowerCase();
  if(!em)throw new Error("구글 계정 이메일을 읽지 못했습니다.");
  return{em,ok:isAllowed(em)&&u.email_verified!==false};
}
async function afterToken(){
  const pre=Drive.read(LOGDIR,LOGFILE).then(d=>({d}),e=>({e}));
  const a=await checkAccount();
  if(!a.ok){await denyAccount();return}
  try{localStorage.setItem(GAC,a.em)}catch(e){}
  const au=curAuth();if(au&&au.email!==a.em)writeAuth({...au,email:a.em});
  me=a.em;await startApp(await pre);
}
async function startApp(pre){
  $("#lmsg").className="lm";$("#lmsg").textContent="기록을 불러오는 중…";
  $("#loginBtn").hidden=true;$("#loginOtherBtn").hidden=true;

    db=normDb(r.d);
    if(!r.d){dirty=true;await driveSave()}
  }

  setShell(true);setSync("ok");go("log");openSheet();scrollTo(0,0);
}

async function boot(){
  // 시험 모드: 내 컴퓨터(localhost·파일)에서만 ?demo=1 로 로그인 없이 화면 확인 (저장·AI·구글 호출 없음)
  const local=/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)||location.protocol==="file:";
  if(local&&/[?&]demo=1/.test(location.search)){
    DEMO=true;me="demo@test";USERS[me]=(new URLSearchParams(location.search).get("apps")||"goodday,shinhanfc,chachacha").split(",");
    db=normDb(null);setShell(true);setSync("ok");go("log");openSheet();return;
  }
  migrateOld();
  const au=readAuth();
  if(au&&au.exp>Date.now()+120000&&au.email&&isAllowed(au.email)){
    if(hasScopes(au.scopes)){
      try{
        authSeen=true;
        checkAccount().then(a=>{if(!a.ok)denyAccount()},()=>{});
        me=au.email.toLowerCase();try{localStorage.setItem(GAC,me)}catch(e){}
        await startApp();return;
      }catch(e){showLogin(e.message==="GOOGLE_AUTH"?"":"기록을 불러오지 못했어요. 인터넷을 확인하고 다시 시도해 주세요. ("+e.message.slice(0,60)+")");return}
    }
    showLogin("이 앱에 필요한 권한(드라이브·캘린더)이 더 필요해요. 아래 버튼을 눌러 허용해 주세요.",false);
    $("#loginBtn").textContent="구글 연결 (권한 추가)";return;
  }
  showLogin("");
}

}

    <p class="k">앱을 열고 닫는 건 관리자가 정해요. 여기서는 열린 앱 중에서 쓸 것만 고를 수 있어요.</p></div>
  ${(USERS[me]||[]).includes("gcal")&&!db.off.includes("gcal")?`<div class="card"><h3>구글 일정 설정</h3><div id="calset"><p class="k">캘린더 목록을 불러오는 중…</p></div></div>`:""}
  <div class="card"><h3>설명서</h3><details><summary class="t" style="cursor:pointer">이렇게 말해 보세요</summary>
    <p class="k"><b>일정 등록</b>: “내일 오후 3시 김OO 고객 상담 일정 추가” — 기본은 1팀 캘린더, 제목 앞에 내 구분 글자가 붙어요. “내 일정에 …”라고 하면 내 캘린더에 글자 없이 등록해요.<br>
    <b>일정 수정</b>: “내일 3시 김OO 상담을 5시로 바꿔줘”, “금요일 회식을 다음주 월요일로 옮겨줘”<br>
    <b>일정 삭제</b>: “내일 김OO 상담 일정 삭제해줘” — 여러 개가 걸리면 고르게 해요.<br>
    <b>일정 질문</b>: “오늘 일정은?”, “내일 약속 있어?”, “이번 주 일정 알려줘”, “다음 일정은 언제야?” — 답이 바로 카드로 나오고, 카드에서 [수정]·[삭제]를 누를 수 있어요. 일정 내용은 AI로 보내지 않고 앱 안에서만 정리해요.<br>
    수정·삭제·등록은 항상 확인 카드를 보여 주고, 끝난 뒤 되돌릴 수 있어요. 맛집·여행·차계부처럼 앱 안의 기록은 받은편지함에 담아 그 앱을 열 때 반영돼요.<br>
    <b>이름·낱말만 말하면 검색</b>: “김현성”처럼 이름이나 낱말만 말하면 ‘1 구글 일정 / 2 일상 / 3 신한FC(고객·메모·상담기록) / 4 취소’ 중 어디서 찾을지 물어요. “기록”, “추가”, “등록”, “남겨” 같은 말이 들어 있으면 검색이 아니라 앱에 기록해요.<br>
    <b>AI(Gemini)</b>: 설정에 키를 넣으면 말을 먼저 Gemini가 해석해요(이름·민감 값은 가려서 보내요). 키가 없거나 안 될 때는 규칙으로 대신해요. 결과는 지금처럼 확인 카드 뒤에 실행돼요.<br>
    <b>민감정보</b>: 주민번호·계좌·연락처·주소 같은 값을 불러 달라고 하면 말만해요는 알려 드리지 않고 ‘고객 정보 열기’ 버튼만 보여 줘요(열리는 화면에서 보이는 정도는 신한FC 권한대로). 그 밖의 묻는 말은 어떤 단어든 받아요.<br>
    <b>고객 보장</b>: “김OO 고객 보장은?”, “김OO 보장분석”, “김OO 보험 뭐 있어”는 신한FC 고객 정보의 분석 탭으로 열려요(여러 명이면 목록에서 고른 뒤).<br>
    <b>찾기·보기는 바로</b> (신한FC 이름 검색은 신한FC의 ‘전체검색’으로 열려 이름·연락처·주소·메모·상담기록·일정에서 찾아요): “김OO 고객 검색해줘”라고 하면 말만해요 안에 신한FC m의 고객 목록이 열리고, “맛집 검색해줘”, “강남 맛집 찾아줘”, “본 영화 찾아줘”, “여행 기록 보여줘”라고 하면 항상일상 찾기 결과가 열려요. “김OO 주민번호·연락처·계좌 알려줘”처럼 민감정보를 묻는 말도 막지 않고 신한FC 고객 화면으로 열어 줘요. 보여 줄지는 신한FC가 내 권한으로 정하고, 말만해요는 고객 데이터를 읽지 않아요. 고객 이름은 말만해요 기록에 남기지 않고 AI로도 보내지 않아요. 열린 화면에는 그 페이지만 보이고, 왼쪽 위 뒤로 버튼은 앱 안에서 한 단계 뒤로 가다가 더 갈 곳이 없으면 닫고 말만해요로 돌아와요(폰 뒤로 동작도 같아요). 오른쪽 위 [앱으로 열기]를 누르면 지금 보던 화면 그대로 그 앱이 열려요. 화면이 열려 있는 동안 오른쪽 아래 말만해요 버튼을 누르면 아래에서 묻는 창이 떠올라요. 내게 열리지 않은 앱은 열 수 없다고 알려 줘요.<br>
    <b>이관·가망·DB·진행</b>: “이관 보여줘”, “가망 고객 보여줘”, “DB 보여줘”, “진행 고객 보여줘”, “진행 삭제 고객 보여줘”, “진행 보관 고객 보여줘”, “DB 보관 보여줘”는 신한FC 고객 검색에서 그 분류만 보여 주고, “이관 보관 보여줘”, “따행 보관”은 영업의 보관 목록을 열어 줘요(“김OO 이관 보여줘”처럼 이름을 붙이면 그 이름만). <b>이달이관·따행</b>: “이달이관 보여줘”, “지난달 이관 보여줘”, “따행 보여줘”는 신한FC 영업 화면의 해당 탭이 열려요.<br>
    <b>차차차</b>: “이번 달 주행 얼마야”, “차 요약 보여줘”, “지난달 충전비 알려줘”는 요약, “주행 기록 보여줘”는 기록, “정비 기록 보여줘”·“충전 비용 알려줘”는 정비·비용 화면이 열려요. “빨강이 …”처럼 차 이름을 말하면 그 차로 열려요.<br>
    <b>주행거리 적기</b>: “하양이 206260”, “하양이 206,260”, “하양이 20만 6260”처럼 차 이름과 숫자만 말하면 차차차 주행거리(km)로 받은편지함에 담아요(날짜는 오늘). 충전비·정비는 “하양이 충전 3만원”처럼 낱말을 같이 말하세요.<br>
    <b>묻는 창과 말만해요 버튼</b>: 앱을 열면 묻는 창이 열린 채로 시작해요. 답 카드도 이 창 안에 나와요. X로 닫으면 뒤의 최근 기록이 보이고, 오른쪽 아래 말만해요 버튼은 어느 화면에서나 떠 있어서 누르면 창이 다시 열려요.<br>
    <b>새로 적는 것은 편지로</b>: “오늘 본 영화 기록해줘”, “충전 40kWh 기록해줘”처럼 다른 앱에 기록을 새로 남기는 말은 그 앱의 받은편지함에 남기고, 카드의 [앱으로 열기]로 그 앱을 열 수 있어요(앱을 열면 반영돼요). 신한FC 상담 메모는 신한FC 고객 화면을 열어 직접 적어요. 읽기인지 쓰기인지 애매하면 어디로 보낼지 물어봐요.<br>
    <b>AI 해석</b>: 설정에 ‘Claude 중계 서버 주소’를 넣으면 말을 먼저 Claude(Haiku)가 해석해요. 키는 서버에만 있고, 허용된 구글 계정만 쓸 수 있어요. 서버가 안 되면 Gemini 키가 있을 때 그쪽으로, 없으면 규칙으로 해석해요.<br>
    <b>다크 모드</b>: 기본은 다크예요. 설정의 ‘다크 모드’ 체크를 끄면 밝은 화면으로 바뀌고, 이 설정은 말만해요 안에 열리는 신한FC·차차차·항상일상 화면에도 함께 적용돼요.<br>
    <b>로그인</b>: 한 번 로그인하면 같은 브라우저에서 다른 앱(신한FC·차차차·항상일상 등)도 로그인 없이 열려요. 로그아웃하면 <b>모든 앱에서 로그아웃</b>돼요. 로그인은 1시간 정도 유지되고, 끝나면 아무 앱에서나 다시 연결하면 돼요. (아이폰은 홈 화면에 추가한 앱끼리는 나눠 쓰지 못해요.)</p></details></div>
  <div class="card"><label class="chk" style="margin:0"><input type="checkbox" id="darkchk" ${cfg.dark===false?"":"checked"}>다크 모드 (기본 켬)</label></div>
  ${isStandalone()?"":`<div class="card" id="installcard"><h3>앱 설치</h3><div class="t">홈 화면에 추가해서 앱처럼 쓰세요</div>
    <p class="k" style="margin:6px 0 0">안드로이드 크롬: 브라우저 메뉴 → ‘앱 설치’ 또는 ‘홈 화면에 추가’. 아이폰 사파리: 공유 → ‘홈 화면에 추가’.</p>

    <label for="rurl">Claude 중계 서버 주소 (서버 설정 뒤 한 번 붙여넣기. 키는 서버에만 있어요)</label><input id="rurl" value="${esc(cfg.relayUrl||"")}" placeholder="https://….workers.dev" autocomplete="off">

function bind(){

  const tx0=$("#txt");if(tx0&&pending&&["ask","pick","confirm"].includes(pending.stage)&&!matchMedia("(pointer:coarse)").matches)tx0.focus(); // 고르는 중에도 바로 새로 쓸 수 있게 커서
  const ng=$("#navgo"),nq=$("#navq");
  if(ng&&nq){const run=()=>{const q=nq.value.trim().slice(0,30);if(q&&pending&&pending.nav)finishNav({...pending.nav,q},pending.rec)};ng.onclick=run;nq.addEventListener("keydown",e=>{if(e.key==="Enter")run()});setTimeout(()=>nq.focus(),50)}
  const cn=$("#calno");if(cn)cn.onclick=()=>{if(pending){pending.rec.status="cancelled";save()}pending=null;render()};

  document.querySelectorAll("[data-evedit]").forEach(b=>b.onclick=()=>{ // 결과 카드 → 수정할 말을 미리 적어 줌 (그 뒤는 확인 카드)
    const e=pending.events[+b.dataset.evedit],d=e.start,t=e.allDay?"":" "+d.getHours()+"시"+(d.getMinutes()?d.getMinutes()+"분":"");
    pending=null;render();const tx=$("#txt");if(tx){tx.value=(d.getMonth()+1)+"월 "+d.getDate()+"일"+t+" "+e.title.replace(/^[^\s)]{1,10}\)\s*/,"")+"을 ";tx.focus()}});
  document.querySelectorAll("[data-resume]").forEach(b=>b.onclick=()=>resume(b.dataset.resume));
  document.querySelectorAll("[data-app]").forEach(c=>c.onchange=()=>{const id=c.dataset.app;db.off=db.off.filter(x=>x!==id);if(!c.checked)db.off.push(id);save();render()});
  const dk=$("#darkchk");if(dk)dk.onchange=async()=>{cfg.dark=dk.checked;applyTheme(dk.checked?"dark":"light",true);await saveCfg()};

/* 말하기: 브라우저 음성 인식(Web Speech). 안 되는 폰은 키보드의 음성 입력(마이크 버튼)을 쓰면 됨 */
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){$("#ast").textContent="이 브라우저는 음성 인식이 안 돼요. 키보드의 마이크 버튼으로 말해 보세요.";$("#txt")&&$("#txt").focus();return}
  if(listening&&recog){recog.stop();return}
  recog=new SR();recog.lang="ko-KR";recog.interimResults=true;recog.continuous=false;
  const tx=$("#txt");const base=tx.value?tx.value.trim()+" ":"";let last=tx.value; // 듣기를 시작하면 화면을 다시 그려 입력창이 새로 만들어지니, 결과는 그때그때 새 입력창에 씀(예전 입력창에 쓰면 글이 안 나타남)
  recog.onresult=e=>{let s="";for(let i=0;i<e.results.length;i++)s+=e.results[i][0].transcript;last=base+s;const t=$("#txt");if(t)t.value=last};
  recog.onerror=e=>{listening=false;render();const ast=$("#ast");if(ast)ast.textContent=e.error==="not-allowed"?"마이크 사용을 허용해 주세요.":"음성 인식이 안 됐어요. 다시 눌러 보세요."};
  recog.onend=()=>{const keep=last||($("#txt")?$("#txt").value:"");listening=false;render();if($("#txt"))$("#txt").value=keep};
  try{recog.start();listening=true;const keep=tx.value;render();$("#txt").value=keep}catch(e){listening=false}
}

/* 이름·낱말만 있는 말 = 기본은 '검색': 구글 일정 / 일상 / 신한FC(고객·메모·상담기록) 중 어디서 찾을지 묻는다.
   "기록·추가·등록·남겨…" 같은 쓰는 말이 있으면 검색이 아니라 기존대로 앱에 기록한다. */
const WRITE_WORDS_NOCAL=/삭제|수정|변경|바꿔|옮겨|검색|찾아|보여|알려|[?？]/;
const WRITE_WORDS=/기록|추가|등록|남겨|적어|저장|입력|메모|예약|잡아|넣어|수정|삭제|변경|바꿔|옮겨|취소해/;
function findLike(res,text,apps){
  if(WRITE_WORDS.test(text)||text.length>40)return false;
  if(!apps.some(a=>["gcal","goodday","shinhanfc"].includes(a.id)))return false;
  const c=res.candidates;return !c.length||c[0].score<3;
}
const FIND_OPTS=[["gcal","구글 일정에서 검색"],["goodday","일상에서 검색"],["shinhanfc","신한FC에서 검색 (고객·메모·상담기록)"]];
async function doFind(which){
  const p=pending;if(!p||p.stage!=="find")return;
  const rec=p.rec,q=p.q;
  if(which==="cancel"){rec.status="cancelled";save();pending=null;render();return}
  if(which==="shinhanfc"){finishNav({app:"shinhanfc",go:"customers",q,memo:"1",label:"신한FC 검색"},rec);return}
  if(which==="goodday"){finishNav({app:"goodday",go:"search",q,kind:"",label:"일상 검색"},rec);return}
  if(which==="gcal"){
    pending={...p,stage:"work",note:"일정에서 찾는 중…"};render();
    try{
      const cals=await CalApi().calendars(),today=dayS(new Date());
      let evs=[];
      for(const c of viewCals(cals))evs=evs.concat((await CalApi().list(c,addD(today,-365),addD(today,366),q)).map(e=>({...e,writeOk:c.write})));
      evs.sort((x,y)=>x.start-y.start);
      rec.status="done";rec.target={app:"gcal",kind:"list"};save();
      pending={rec,stage:"answer",canUndo:false,events:evs,ansTitle:"‘"+q+"’ 일정 "+evs.length+"개 (지난 1년~내년)",ansCals:viewCals(cals).map(c=>c.name).join(", ")};
      render();
    }catch(e){calFail(e)}
  }
}

/* ===== Gemini 먼저 (키가 있을 때) =====
   말을 받으면 바로 Gemini에게 '어디로 보낼지(JSON)'만 묻는다. 보내기 전에 앱에서 먼저 가림:
   민감 숫자·이메일·전화·주소 + 고객 이름(색인에 있으면 [고객1], 이름 모양이면 [사람1])을 자리표시자로 바꾸고, 받은 뒤 되돌림.
   색인 자료 자체와 일정·고객 내용은 보내지 않음. 키 없음·실패·한도 초과·12초 넘김이면 규칙 해석으로 자동 대신. */
let aiOffUntil=0;const AI_LOG=[]; // AI_LOG: 이번 접속에서 Gemini로 보낸 글(메모리에만, 확인용)
const AI_MAIL=/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;
const AI_PHONE=/(?<!\d)0\d{1,2}[-\s]?\d{3,4}[-\s]?\d{4}(?!\d)/g;
const AI_ADDR=/[가-힣0-9]+(?:특별시|광역시|특별자치시|특별자치도|도|시)\s?[가-힣0-9]+(?:구|군|시)\s?[가-힣0-9]+(?:동|읍|면|로|길)(?:\s?\d+(?:-\d+)?(?:번길)?)?(?:\s?\d+동)?(?:\s?\d+호)?/g;
function anonymize(masked){
  let t=masked.replace(AI_MAIL,"[이메일 가림]").replace(AI_PHONE,"[전화 가림]").replace(AI_ADDR,"[주소 가림]").replace(/\d{7,}/g,"[숫자 가림]");
  const map={};let c=0,p=0;
  const names=[...new Set(Object.values(IDX).flatMap(x=>x.names))].sort((a,b)=>b.length-a.length);
  for(const nm of names)if(t.includes(nm)){const ph="[고객"+(++c)+"]";map[ph]=nm;t=t.split(nm).join(ph)}
  const guess=w=>SURNAME.includes(w[0])&&!NOT_NAME.test(w);
  const ph2=w=>{for(const k in map)if(map[k]===w)return k;const ph="[사람"+(++p)+"]";map[ph]=w;return ph};
  t=t.replace(/^(\s*)([가-힣]{3,4})/,(all,sp,w)=>guess(w)?sp+ph2(w):all); // 맨 앞 이름 꼴
  t=t.replace(/([가-힣]{3,4})(?=\s?(?:님|씨|고객|만남|상담|미팅|면담|방문|통화|연락|약속))/g,(all,w)=>guess(w)?ph2(w):all);
  return{text:t,map};
}
const unmap=(s,map)=>{s=String(s==null?"":s);for(const k in map)s=s.split(k).join(map[k]);return s};
const GO_OK={shinhanfc:["customers","schedule","sales"],goodday:["search"],chachacha:["records","maint","summary","tire","ins","home"]};
const KIND_OK={customers:["","transfer","plan","db","contract","ddahaeng","progress","progress_removed","progress_archive","db_archive","transfer_archive"],search:["","영상","맛집","여행","일상"]};
async function geminiFirst(maskedText,apps,fetcher){
  const an=anonymize(maskedText);
  for(const nm of Object.values(IDX).flatMap(x=>x.names))if(an.text.includes(nm))return null; // 이름이 남아 있으면 보내지 않음(규칙으로)
  const ids=apps.map(a=>a.id);
  const catalog=apps.map(a=>({app:a.id,name:a.name,kinds:a.kinds.map(k=>k.id+":"+k.label)}));
  const prompt="너는 한국어 비서 앱 '말만해요'의 분류기다. 사용자가 말한 한 문장(이름·민감 값은 [고객1] [사람1] [전화 가림] 같은 자리표시자로 가려져 있으니 그대로 둬라)을 분류해 JSON으로만 답해라.\n앱 목록: "+JSON.stringify(catalog)+
   "\n1) action=\"navigate\" (앱 화면을 열어 찾아 보는 말): "+
   (ids.includes("shinhanfc")?"app=shinhanfc, go=customers(고객 검색: q=이름이나 낱말, memo=\"1\"이면 이름·메모·상담기록·일정 전체검색, kind=transfer|plan|db|contract|progress(진행 고객)|progress_archive(진행 보관 목록; 예전 말 진행 삭제=progress_removed)|db_archive(DB 보관 목록)|transfer_archive(고객 화면 이관 보관 목록) 분류만 볼 때, tab=\"analysis\"면 보장분석) / go=schedule(q=YYYY-MM-DD 하루 일정) / go=sales(q=transfer 이달이관|dda 따행, id=YYYY-MM, tab=\"archive\"면 그 보관 목록). ":"")+
   (ids.includes("goodday")?"app=goodday, go=search(q 검색어, kind=영상|맛집|여행|일상). ":"")+
   (ids.includes("chachacha")?"app=chachacha, go=records|maint|summary|tire|ins|home(month=YYYY-MM, car=차 별명). ":"")+
   "\n2) action=\"record\" (새로 기록·등록·수정·삭제하거나 구글 일정을 묻는 말): app과 kind를 앱 목록에서 골라라(gcal은 add|edit|delete|list).\n3) action=\"find\" (이름·낱말만 있어 어디서 찾을지 모를 때): q.\n확신이 없으면 confidence는 low로 하고 alt에 후보 {app,kind}를 넣어라. 주민번호·계좌 등 민감 값을 알려 달라는 말도 분류만 해라(답은 하지 마라).\n오늘 날짜: "+todayStr()+
   "\n사용자 말: \""+an.text.replace(/"/g,"'")+"\"\nJSON 형식: {\"action\":\"navigate|record|find\",\"app\":\"\",\"go\":\"\",\"q\":\"\",\"kind\":\"\",\"tab\":\"\",\"id\":\"\",\"month\":\"\",\"car\":\"\",\"memo\":\"\",\"confidence\":\"high|low\",\"alt\":[{\"app\":\"\",\"kind\":\"\"}]}";
  AI_LOG.push(prompt);if(AI_LOG.length>30)AI_LOG.shift();
  const ctl=typeof AbortController!=="undefined"?new AbortController():null,timer=setTimeout(()=>{try{ctl&&ctl.abort()}catch(e){}},12000);
  let r,via="Gemini";
  const gcall=m=>(fetcher||fetch)(geminiUrl(m),{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.geminiKey},signal:ctl?ctl.signal:undefined,
       body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{responseMimeType:"application/json",temperature:0}})});
  try{
    if(relayOn()){ // Claude 중계 서버: 키는 서버에만 있고, 구글 토큰으로 허용된 사람인지 확인함. 실패하면 Gemini 키가 있을 때만 그쪽으로
      via="Claude";
      try{r=await (fetcher||fetch)(cfg.relayUrl,{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+storedTok()},signal:ctl?ctl.signal:undefined,body:JSON.stringify({prompt})})}catch(e){r=null}
      if((!r||!r.ok)&&cfg.geminiKey){via="Gemini";r=null}
    }
    if(!r){const gm=geminiModel(cfg);r=await gcall(gm);
    if(r.status===404&&gm!==GEMINI_MODEL_DEFAULT)r=await gcall(GEMINI_MODEL_DEFAULT)} // 없는 모델이면 새 기본값으로 한 번만 다시(12초 제한은 그대로 공유)
  }finally{clearTimeout(timer)}
  if(!r||!r.ok)throw new Error(via+" "+(r?r.status:"연결 실패"));
  const j=await r.json();
  const raw=j.candidates&&j.candidates[0]&&j.candidates[0].content.parts.map(x=>x.text||"").join("");
  const o=JSON.parse(String(raw||"").replace(/^```json|```$/g,"").trim());
  const S=(v,n)=>unmap(v,an.map).replace(/\[(?:고객|사람)\d+\]/g,"").trim().slice(0,n||30); // 못 되돌린 자리표시자는 버림
  const high=o.confidence==="high";
  if(o.action==="navigate"&&ids.includes(o.app)&&(GO_OK[o.app]||[]).includes(o.go)){
    const kind=String(o.kind||"");if(KIND_OK[o.go]&&!KIND_OK[o.go].includes(kind))return null;
    const nv={app:o.app,go:o.go,q:S(o.q),kind,label:"AI가 연 화면"};
    if(o.tab==="analysis"&&o.go==="customers")nv.tab="analysis";
    if(o.tab==="archive"&&o.go==="sales")nv.tab="archive";
    if(o.memo==="1"&&o.go==="customers")nv.memo="1";
    if(/^\d{4}-\d{2}$/.test(o.id||""))nv.id=o.id;
    if(/^\d{4}-\d{2}$/.test(o.month||""))nv.month=o.month;
    if(o.car&&/^[가-힣A-Za-z0-9]{1,8}$/.test(o.car))nv.car=o.car;
    if(o.go==="schedule"&&!/^\d{4}-\d{2}-\d{2}$/.test(nv.q))nv.q=todayStr();
    if(o.go==="sales"&&nv.q!=="dda")nv.q="transfer";
    return high?{type:"nav",nv}:null; // 확신이 낮으면 규칙 해석으로
  }
  if(o.action==="record"&&ids.includes(o.app)&&kindOf(o.app,o.kind)){
    const alt=(o.alt||[]).filter(x=>x&&ids.includes(x.app)&&kindOf(x.app,x.kind)).map(x=>({app:x.app,kind:x.kind,score:0,why:["AI"]}));
    return{type:"route",pick:{app:o.app,kind:o.kind,score:0,why:["AI"]},high,alt};
  }
  if(o.action==="find")return{type:"find",q:S(o.q,60)};
  return null;
}

/* 보내기 → 걸러내기 → 원문 기록 → 해석 → (확실하면) 반영 / (애매하면) 되묻기 */
async function submit(raw){
  raw=String(raw||"").trim();if(!raw)return;
  if(pending){ // 고르는 중에 새로 쓰면 그 말로 다시 시작: 하던 되묻기·확인은 접음
    if(pending.stage==="work")return;
    const o=pending.rec;if(o&&(o.status==="ask"||o.status==="new"||o.status==="find")){o.status="cancelled";save()}
    pending=null;
  }
  const apps=activeApps();if(!apps.length)return;
  const s=Sens.mask(raw);
  const nv=navIntent(s.text);
  const refuse=!!(nv&&nv.refuse);
  const useAI=aiReady()&&!refuse&&Date.now()>aiOffUntil; // Claude 중계나 Gemini 키가 있으면 AI 먼저(민감 값을 불러 달라는 말은 앱이 먼저 판단해 거절)
  const gen=nv&&nv.app==="shinhanfc"&&nv.go==="customers";
  const rec={id:uid(),at:new Date().toISOString(),text:useAI?"(해석 중)":gen?"고객 검색 (이름은 기록 안 함)":s.text,masked:s.hit,status:"new",target:null,fields:{}};
  db.records.push(rec);save();
  if(refuse){await navFlow(nv,rec);return}
  let g=null;
  if(useAI){
    try{g=await geminiFirst(s.text,apps,window.__geminiFetch)}
    catch(e){rec.aiError=String(e&&e.message||e).slice(0,40);if(/429|RESOURCE|quota/i.test(rec.aiError))aiOffUntil=Date.now()+120000} // 한도 초과면 잠시 규칙으로만
    if(!g)rec.text=gen?"고객 검색 (이름은 기록 안 함)":s.text; // 실패·확신 낮음 → 규칙 해석으로 대신
  }
  if(g&&g.type==="nav"){await navFlow(g.nv,rec);return}
  if(g&&g.type==="find"){
    rec.text="검색 (검색어는 기록 안 함)";rec.status="find";rec.fields={};save();
    pending={rec,stage:"find",q:g.q||s.text.slice(0,60)};render();return;
  }
  if(!g&&nv){await navFlow(nv,rec);return}
  const res=await Providers[providerId].classify(s.text,apps);
  rec.fields={title:s.text.length>60?s.text.slice(0,60)+"…":s.text,...res.fields}; // 받는 앱이 필수로 쓰는 제목 칸(항상일상 등)
  if(apps.some(a=>a.id==="gcal")&&!WRITE_WORDS_NOCAL.test(s.text)&&nameMeet(s.text)){ // "최민수 만남" → 고객 일정으로(확인 카드)
    const c=res.candidates.find(x=>x.app==="gcal"&&x.kind==="add");
    if(c)c.score=Math.max(c.score,3);else res.candidates.unshift({app:"gcal",kind:"add",score:3,why:["이름+만남"]});
    res.candidates.sort((x,y)=>y.score-x.score);
  }
  let d;
  if(g&&g.type==="route"){ // Gemini가 고른 곳: 확신하면 바로(확인 카드는 일정 쪽이 따로), 아니면 후보 3개로 되묻기
    rec.text=s.text;
    d=g.high?{mode:"auto",pick:g.pick,options:[g.pick]}:{mode:"ask",options:[g.pick,...g.alt].slice(0,3)};
  }else{
    d=decide(res,apps);
    if(d.mode==="ask"&&findLike(res,s.text,apps)){ // 기록하는 말이 아니라 이름·낱말만 있으면: 어디서 찾을지 묻기
      rec.text="검색 (검색어는 기록 안 함)";rec.status="find";rec.fields={};save();
      pending={rec,stage:"find",q:s.text.slice(0,60)};render();return;
    }
  }
  pending={rec,options:d.options,stage:"ask"};
  if(d.mode==="auto"){await apply(d.pick,d.pick.why.includes("AI")?"AI":"자동")}
  else{rec.status="ask";rec.options=d.options;save();render()}
}
async function choose(i){
  if(!pending)return;

  await apply(pending.options[+i],"선택");
}
async function apply(pick,how){
  const rec=pending.rec,a=adapter(pick.app),k=kindOf(pick.app,pick.kind);
  if(a.direct==="calendar"&&pick.kind==="list"&&activeApps().some(x=>x.id==="shinhanfc")&&!/다음\s?(일정|약속)|언제|이번\s?주|다음\s?주/.test(rec.text)){
    // "오늘 일정 보여줘": 신한FC m의 일정 페이지만 말만해요 안에 띄움 (하루 단위 질문. 주 단위·다음 일정은 아래 결과 카드)
    const day=rec.fields.date||todayStr();
    rec.status="done";rec.target={app:"shinhanfc",kind:"nav"};save();
    openModule({app:"shinhanfc",go:"schedule",q:day,kind:""});
    pending=null;render();return;
  }
  if(a.direct==="calendar"){pending.stage="work";pending.note="확인하는 중…";render();await calFlow(pick.kind,rec);return} // 앱을 거치지 않고 바로 처리
  if(pick.app==="shinhanfc"){ // 신한FC는 아직 받은편지함을 안 읽음 → 고객 화면을 띄워 직접 쓰게 안내
    rec.status="done";rec.target={app:"shinhanfc",kind:"nav"};save();
    openModule({app:"shinhanfc",go:"customers",q:"",kind:""});
    pending=null;render();return;
  }
  pending.stage="work";pending.note="보내는 중…";render();
  const item={id:rec.id,at:rec.at,from:"onething",kind:pick.kind,text:rec.text,fields:rec.fields,status:"new"};
  try{
    await inboxPut(pick.app,item);
    rec.status="done";rec.target={app:pick.app,kind:pick.kind};delete rec.options;save();
    if(pick.app==="chachacha"&&["odo","fuel","maint"].includes(pick.kind)&&activeApps().some(x=>x.id==="chachacha")){ // 입력 뒤 그 화면만 보여 줌(위·아래 메뉴 없이)
      openModule({app:"chachacha",go:pick.kind==="odo"?"records":"maint",q:"",kind:"",car:rec.fields.car||""});
      sendAdd("chachacha",item);
      pending=null;render();return;
    }
    const f=rec.fields,bits=[f.car&&"차 "+f.car,f.date&&"날짜 "+f.date,f.time&&"시간 "+f.time,f.km&&f.km.toLocaleString("ko-KR")+"km",f.cost&&f.cost.toLocaleString("ko-KR")+"원"].filter(Boolean);
    pending={...pending,stage:"done",canUndo:true,pickApp:pick.app,
      note:"‘"+a.name+" · "+k.label+"’ 받은편지함에 담았어요 ("+how+").\n"+(bits.length?"읽어낸 것: "+bits.join(", ")+"\n":"")+(rec.masked.length?"가린 정보: "+rec.masked.join(", ")+"\n":"")+a.name+"을 열면 반영돼요."};
  }catch(e){
    rec.status="fail";save();
    pending={...pending,stage:"done",canUndo:false,note:"보내지 못했어요. 기록은 남겨 두었어요.\n"+String(e.message).slice(0,80)};
  }
  render();
}
async function undo(){
  if(!pending)return;const rec=pending.rec;
  if(pending.undoFn){
    try{await pending.undoFn();rec.status="cancelled";save();pending={...pending,undoFn:null,canUndo:false,note:"되돌렸어요."}}
    catch(e){pending.note="되돌리지 못했어요. "+String(e.message).slice(0,60)}
    render();return;
  }
  try{
    const ok=await inboxCancel(rec.target.app,rec.id);
    rec.status="cancelled";save();
    pending={...pending,canUndo:false,note:ok?"취소했어요.":"이미 앱이 가져가서 여기서는 못 되돌려요. 해당 앱에서 지워 주세요."};
  }catch(e){pending.note="취소하지 못했어요. "+String(e.message).slice(0,60)}
  render();
}

const CalApi=()=>DEMO?DemoCal:RealCal;

/* 설정: 기본 캘린더(이름), 보여줄 캘린더(이름들), 제목 앞 글자 → 내 설정 파일(cfg)에 저장 */
const fixPrefix=v=>{const t=String(v||"").trim().replace(/[)）\s]+$/,"");return t?t+")":""};
async function perms(){try{return await store().read(["Claude","app","신한FC","설정"],"shlife-권한.json")}catch(e){return null}}
async function myFc(){const p=await perms();return p&&p.names?p.names[me]||"":""}
async function myPrefix(){
  if(cfg.calPrefix)return fixPrefix(cfg.calPrefix);
  const p=await perms();const nm=p&&p.names&&p.names[me];
  return nm&&p.prefixes&&p.prefixes[nm]?fixPrefix(p.prefixes[nm]):"";
}
const writable=cals=>cals.filter(c=>c.write);
function defaultCal(cals){const w=writable(cals);return w.find(c=>c.name===(cfg.calName||TEAM_CAL))||w.find(c=>c.name===TEAM_CAL)||w.find(c=>c.primary)||w[0]||null}
async function myCal(cals){const w=writable(cals),nm=await myFc();return w.find(c=>nm&&c.name===nm)||w.find(c=>c.primary)||null}
function viewCals(cals){const w=cals.filter(c=>(cfg.viewNames||[]).includes(c.name));if(w.length)return w;const d=defaultCal(cals);return d?[d]:[]}

/* 말에서 제목 뽑기 (날짜·시간·동사·조사를 걷어냄) */
function calTitle(t){
  return String(t)
   .replace(/그제|그저께|어제|오늘|내일|모레|글피/g," ")
   .replace(/(다음\s?주|이번\s?주|돌아오는)?\s?[일월화수목금토]요일/g," ")
   .replace(/\d{1,2}\s?월\s?\d{1,2}\s?일/g," ")
   .replace(/(오전|오후|저녁|아침|점심|밤|새벽)?\s?\d{1,2}\s?시\s?(?:\d{1,2}\s?분|반)?/g," ")
   .replace(/일정\s*(?:을|를|에)?/g," ")
   .replace(/(등록|추가|잡아|넣어|만들어|삭제|지워|없애|취소|수정|변경|바꿔|옮겨|미뤄|당겨|보여|알려)\s*(?:해?\s*줘|주세요|해|줄래|줘)?/g," ")
   .replace(/(?:^|\s)(?:에|에서|를|을|으로|로|은|는|이|가|도|좀)(?=\s|$)/g," ")
   .replace(/\s+/g," ").trim();
}
// '내일 3시 상담을 5시로 바꿔줘' → 고칠 일정 설명 / 바뀔 값
function parseEdit(t){
  let m=t.match(/^(.*?)(?:을|를)\s+(.+?)\s*(?:으로|로)\s*(?:바꿔|변경|옮겨|미뤄|당겨|수정)/)||t.match(/^(.*?)\s+(\S+)\s*(?:으로|로)\s*(?:바꿔|변경|옮겨|미뤄|당겨|수정)/);
  if(!m)return null;
  const target=m[1].trim(),np=m[2].trim(),nf=extractFields(np);
  const ch={};
  if(nf.date)ch.date=nf.date;if(nf.time)ch.time=nf.time;
  if(!nf.date&&!nf.time){const nt=calTitle(np);if(nt)ch.title=nt}
  return{target,ch,tf:extractFields(target)};
}
async function findEvents(cals,desc,f){
  const base=f.date?ymdDate(f.date):dayS(new Date());
  const a=base,b=f.date?addD(base,1):addD(base,60);
  const kws=calTitle(desc).split(" ").filter(w=>w.length>=2);
  let out=[];
  for(const c of viewCals(cals).filter(c=>c.write))out=out.concat(await CalApi().list(c,a,b));
  const strip=s=>s.replace(/^[^\s)]{1,10}\)\s*/,"");
  let hit=out.filter(e=>!kws.length||kws.some(k=>strip(e.title).includes(k)||e.title.includes(k)));
  if(f.time){const h=hit.filter(e=>!e.allDay&&pad(e.start.getHours())+":"+pad(e.start.getMinutes())===f.time);if(h.length)hit=h}
  return hit.sort((x,y)=>x.start-y.start).slice(0,6);
}
function calFail(e){
  const scope=e.message==="CAL_SCOPE"||e.message==="GOOGLE_AUTH";
  pending={...pending,stage:"done",canUndo:false,reauth:scope,
    note:scope?"구글 일정 권한이 아직 없어요. 아래 버튼으로 다시 로그인하면서 ‘캘린더’ 항목을 허용해 주세요.":"일정을 처리하지 못했어요.\n"+String(e.message).slice(0,80)};
  pending.rec.status="fail";save();render();
}
async function calFlow(kind,rec){
  try{
    const cals=await CalApi().calendars(),f=rec.fields;
    let t=rec.text;
    if(kind==="list"){ // 질문: 답을 앱 안에서 정리해 바로 보여 줌 (일정 내용은 AI로 보내지 않음)
      const today=dayS(new Date());let a,b,label,next=false;
      if(/다음\s?(일정|약속)|언제/.test(t)&&!f.date){next=true;a=new Date();b=addD(today,90);label="다음 일정"}
      else if(/이번\s?주/.test(t)){a=today;b=addD(today,(7-today.getDay())%7+1);label="이번 주(오늘~일요일)"}
      else if(/다음\s?주(?!\s?[일월화수목금토]요일)/.test(t)){const d=(8-today.getDay())%7||7;a=addD(today,d);b=addD(a,7);label="다음 주"}
      else{const day=f.date?ymdDate(f.date):today;a=day;b=addD(day,1);label=(day.getMonth()+1)+"월 "+day.getDate()+"일("+DAYN[day.getDay()]+")"}
      let evs=[];
      for(const c of viewCals(cals))evs=evs.concat((await CalApi().list(c,a,b)).map(e=>({...e,writeOk:c.write})));
      evs.sort((x,y)=>x.start-y.start);
      if(next)evs=evs.filter(e=>e.end>new Date()).slice(0,3);
      rec.status="done";rec.target={app:"gcal",kind};save();
      pending={...pending,stage:"answer",canUndo:false,events:evs,ansTitle:label+" 일정 "+evs.length+"개",ansCals:viewCals(cals).map(c=>c.name).join(", ")};
      render();return;
    }
    if(kind==="add"){
      const mine=/(?:^|\s)내\s*(?:일정|캘린더)/.test(t);
      t=t.replace(/(?:^|\s)내\s*(?:일정|캘린더)\s*(?:에다가|에다|에서|에)?/," ");
      let cal=null;
      for(const c of writable(cals)){const re=new RegExp(c.name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\s*캘린더\\s*(?:에다가|에다|에서|에)?");if(re.test(t)){cal=c;t=t.replace(re," ");break}}
      if(!cal)cal=mine?await myCal(cals):defaultCal(cals);
      if(!cal){pending={...pending,stage:"done",note:"쓸 수 있는 캘린더를 찾지 못했어요. 설정에서 확인해 주세요."};rec.status="fail";save();render();return}
      let title=calTitle(t);
      if(!title){rec.status="kept";save();pending={...pending,stage:"done",canUndo:false,note:"무슨 일정인지 알려 주세요.\n예: “내일 오후 3시 김OO 고객 상담 일정 추가”"};render();return}
      const pre=(!mine&&cal.name===TEAM_CAL)?await myPrefix():"";
      title=pre+title;
      const date=f.date?ymdDate(f.date):dayS(new Date());
      let s=date,e=addD(date,1),allDay=true;
      if(f.time){const[h,m]=f.time.split(":").map(Number);s=new Date(date.getFullYear(),date.getMonth(),date.getDate(),h,m);e=new Date(s.getTime()+3600000);allDay=false}
      const body={summary:title,...timesBody(s,e,allDay)};
      pending={...pending,stage:"confirm",cal:{op:"add",opLabel:"일정 등록",calObj:cal,body},lines:[title,(date.getMonth()+1)+"월 "+date.getDate()+"일("+DAYN[date.getDay()]+") "+(allDay?"종일":f.time+" ~ "+pad(e.getHours())+":"+pad(e.getMinutes())),"캘린더: "+cal.name+(f.date?"":"  (날짜를 말하지 않아 오늘로 했어요)")]};
      render();return;
    }
    // 수정·삭제: 대상 일정을 찾아서 확인 카드
    let desc=t,ch={},tf=f;
    if(kind==="edit"){const pe=parseEdit(t);if(!pe){rec.status="kept";save();pending={...pending,stage:"done",canUndo:false,note:"무엇을 어떻게 바꿀지 알려 주세요.\n예: “내일 3시 김OO 상담을 5시로 바꿔줘”"};render();return}desc=pe.target;ch=pe.ch;tf=pe.tf}
    const evs=await findEvents(cals,desc,tf);
    if(!evs.length){rec.status="kept";save();pending={...pending,stage:"done",canUndo:false,note:"찾는 일정이 없어요. 날짜나 제목을 더 알려 주세요.\n(찾는 캘린더: "+viewCals(cals).map(c=>c.name).join(", ")+")"};render();return}
    pending={...pending,cal:{op:kind,change:ch}};
    if(evs.length===1)return calConfirm(evs[0]);
    pending={...pending,stage:"pick",events:evs};render();
  }catch(e){calFail(e)}
}
async function calPick(i){const e=pending.events[i];if(e)await calConfirm(e)}
async function calConfirm(ev){
  const op=pending.cal.op,ch=pending.cal.change||{};
  const lines=[ev.title,fmtEv(ev)+" · "+ev.calName];
  let body=null;
  if(op==="edit"){
    body={};
    if(ch.title){let nt=ch.title;const m=ev.title.match(/^([^\s)]{1,10}\))\s*/);if(m&&!nt.startsWith(m[1]))nt=m[1]+nt;body.summary=nt;lines.push("→ 제목: "+nt)}
    if(ch.date||ch.time){
      const d=ch.date?ymdDate(ch.date):dayS(ev.start),dur=ev.end-ev.start;
      let s,e,allDay=ev.allDay&&!ch.time;
      if(allDay){s=d;e=new Date(d.getTime()+dur)}
      else{const[h,m]=ch.time?ch.time.split(":").map(Number):[ev.start.getHours(),ev.start.getMinutes()];s=new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,m);e=ev.allDay?new Date(s.getTime()+3600000):new Date(s.getTime()+dur)}
      Object.assign(body,timesBody(s,e,allDay));
      lines.push("→ "+(s.getMonth()+1)+"/"+s.getDate()+"("+DAYN[s.getDay()]+") "+(allDay?"종일":pad(s.getHours())+":"+pad(s.getMinutes())));
    }
    if(!Object.keys(body).length){pending.rec.status="kept";save();pending={...pending,stage:"done",canUndo:false,note:"바꿀 내용을 못 알아들었어요. 예: “5시로”, “다음주 월요일로”"};render();return}
  }
  pending={...pending,stage:"confirm",lines,cal:{...pending.cal,opLabel:op==="edit"?"일정 수정":"일정 삭제",ev,body}};render();
}
async function calRun(){
  if(!pending||!pending.cal)return;
  const c=pending.cal,rec=pending.rec;
  pending.stage="work";pending.note="처리 중…";render();
  try{
    let note,undoFn;
    if(c.op==="add"){
      const ev=await CalApi().insert(c.calObj,c.body);rec.result={calId:ev.calId,eventId:ev.id};
      note="‘"+ev.calName+"’ 캘린더에 등록했어요.\n"+ev.title+" · "+fmtEv(ev);undoFn=()=>CalApi().remove(ev);
    }else if(c.op==="delete"){
      await CalApi().remove(c.ev);rec.result={calId:c.ev.calId,eventId:c.ev.id};
      note="삭제했어요.\n"+c.ev.title+" · "+fmtEv(c.ev);undoFn=()=>CalApi().restore(c.ev);
    }else{
      const old=c.ev,back={summary:old.title,...timesBody(old.start,old.end,old.allDay)};
      const ev=await CalApi().patch(old,c.body);rec.result={calId:ev.calId,eventId:ev.id};
      note="수정했어요.\n"+ev.title+" · "+fmtEv(ev);undoFn=()=>CalApi().patch(old,back);
    }
    rec.status="done";rec.target={app:"gcal",kind:c.op};save();
    pending={...pending,stage:"done",canUndo:true,undoFn,note};
  }catch(e){return calFail(e)}
  render();
}
async function fillCalSettings(){
  const box=$("#calset");if(!box)return;
  try{
    const cals=await CalApi().calendars(),w=writable(cals),def=defaultCal(cals);
    box.innerHTML=`<label for="calDef">새 일정 기본 캘린더</label><select id="calDef">${w.map(c=>`<option ${def&&c.id===def.id?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
      <label>보여줄 캘린더 (일정 보기·수정·삭제 때 찾는 곳)</label>${w.map(c=>`<label class="chk"><input type="checkbox" data-vc="${esc(c.name)}" ${viewCals(cals).some(v=>v.id===c.id)?"checked":""}>${esc(c.name)}</label>`).join("")}
      <label for="calPfx">1팀 캘린더에 등록할 때 제목 앞 글자 (비워 두면 신한FC 설정에서 가져와요)</label><input id="calPfx" value="${esc(cfg.calPrefix||"")}" maxlength="10" placeholder="예: 최">
      <div class="acts"><button class="btn pri" id="calsave">저장</button></div>
      <p class="k">쓸 수 있는 캘린더만 보여요. 다른 사람 캘린더는 내가 쓰기 권한이 있을 때만 등록·수정·삭제할 수 있어요.</p>`;
    $("#calsave").onclick=async()=>{cfg.calName=$("#calDef").value;cfg.viewNames=[...box.querySelectorAll("[data-vc]")].filter(x=>x.checked).map(x=>x.dataset.vc);cfg.calPrefix=$("#calPfx").value.trim();await saveCfg();$("#calsave").textContent="저장됨"};
  }catch(e){
    box.innerHTML=e.message==="CAL_SCOPE"||e.message==="GOOGLE_AUTH"?`<p class="k">구글 일정 권한이 아직 없어요.</p><div class="acts"><button class="btn pri" id="reauth2">일정 권한 연결(다시 로그인)</button></div>`:`<p class="k">캘린더 목록을 못 불러왔어요. (${esc(String(e.message).slice(0,60))})</p>`;
    const r=$("#reauth2");if(r)r.onclick=()=>doLogin(false);
  }
}
/* ===== 설치 준비: 서비스워커 + [앱 설치] 버튼 (규칙: app\_공통\설치준비.md) ===== */
let installEv=null;
const isStandalone=()=>{try{return matchMedia("(display-mode: standalone)").matches||navigator.standalone===true}catch(e){return false}};
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEv=e;const b=$("#installbtn");if(b)b.hidden=false});
window.addEventListener("appinstalled",()=>{installEv=null;const c=$("#installcard");if(c)c.hidden=true});
try{if("serviceWorker"in navigator&&!DEMO)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}catch(e){}
boot();
