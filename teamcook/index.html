(function(){var t="dark";try{if(localStorage.getItem("teamcook.theme")==="light")t="light"}catch(e){}try{var q=location.search.match(/[?&]theme=(dark|light)/);if(/[?&]embed=1/.test(location.search)&&q){window.__forceTheme=t=q[1]}}catch(e){}document.documentElement.setAttribute("data-theme",t);document.getElementById("tcolor").setAttribute("content",t==="light"?"#fafafa":"#141415")})();</script>

<title>팀쿡</title>
<style>
:root{
  color-scheme:dark;
  --bg:#141415;--card:#19191b;--raised:#232325;
  --t1:#ededed;--t2:#a1a1a6;--t3:#85858b;--line:rgba(237,237,237,.08);--line2:rgba(237,237,237,.14);
  --acc:#f2a93b;--acc-ink:#f2a93b;--on-acc:#1c1406;--pos:#4cc38a;--neg:#e5484d;--pwc:#6cb8f5;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1)
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#fafafa;--card:#ffffff;--raised:#f4f4f5;
  --t1:#171717;--t2:#525252;--t3:#737373;--line:rgba(23,23,23,.08);--line2:rgba(23,23,23,.14);
  --acc:#f2a93b;--acc-ink:#a8650c;--on-acc:#1c1406;--pos:#16a34a;--neg:#dc2626;--pwc:#1d6fb8
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--t1);font-family:var(--font);font-size:14px;line-height:1.45;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
html{overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
svg.i{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 위 바 */
.top{position:sticky;top:0;z-index:5;background:var(--bg);height:calc(48px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 16px 0;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.logo{font-size:16px;font-weight:600;display:flex;align-items:center;gap:8px}
.mark{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--t1);position:relative;flex:none}
.mark:after{content:"";position:absolute;left:3px;right:3px;bottom:3px;height:4px;border-radius:1px;background:var(--acc)}
.sync{font-size:11px;color:var(--t3);margin-left:4px}
.sync.fail{color:var(--neg)}
.sp{flex:1}
.seg{display:flex;background:var(--raised);border-radius:8px;padding:2px;height:28px;flex:none}
.seg button{font-weight:500;font-size:12px;color:var(--t2);width:32px;border-radius:6px;transition:background-color .12s var(--ease),color .12s var(--ease)}
.seg button.on{background:var(--card);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line2)}
.ib{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:var(--t2);border-radius:8px;flex:none}
.ib:active{background:var(--raised)}

main{max-width:560px;margin:0 auto;padding:12px 16px 96px}
.dh{display:flex;align-items:center;gap:4px}
.dh h1{font-size:20px;font-weight:500;letter-spacing:-.01em;margin:0;flex:1}
.dh .ib{width:28px;height:28px}
.sub{font-size:12px;color:var(--t2);margin-top:2px}
.acc{color:var(--acc-ink)}
.tag{display:inline-flex;align-items:center;height:18px;padding:0 6px;border-radius:4px;font-size:11px;color:var(--acc-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 45%,transparent);font-weight:500;flex:none}
.tag.n{color:var(--t2);box-shadow:inset 0 0 0 1px var(--line2)}

/* 주 띠 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.wd{position:relative;height:52px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.wd:active{background:var(--raised)}
.wd small{font-size:11px;color:var(--t3)}
.wd b{font-size:15px;font-weight:500}
.wd i,.mc i{width:20px;height:3px;border-radius:2px;background:var(--line2);overflow:hidden;display:block}
.wd i em,.mc i em{display:block;height:100%;background:var(--t2)}
.wd.sel{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.wd.today b{color:var(--acc-ink)}
.wd.today i em,.mc.today i em{background:var(--acc)}
.wd.off b{color:var(--t3)}
.wd .dot{position:absolute;top:8px;right:calc(50% - 14px);width:4px;height:4px;border-radius:2px;background:var(--acc)}
.wd .dot.n{background:var(--t2)}

/* 카드 */
.card{background:var(--card);border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);padding:12px}
.mt12{margin-top:12px}.mt8{margin-top:8px}
.row{display:flex;align-items:center;gap:8px}
.btn{height:36px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;flex:none;transition:background-color .12s var(--ease),transform .12s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--acc);color:var(--on-acc)}
.btn.sec{background:var(--raised);color:var(--t1);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5}
.ct{font-size:15px;font-weight:500}
.big{font-size:24px;font-weight:500;letter-spacing:-.01em;line-height:1.2}
.big small{font-size:13px;color:var(--t3);font-weight:400;margin-left:2px}
.bar{height:4px;border-radius:2px;background:var(--line2);overflow:hidden}
.bar em{display:block;height:100%;background:var(--acc);border-radius:2px}
.live{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:13px}
.ld{width:8px;height:8px;border-radius:4px;background:var(--acc);flex:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 22%,transparent)}
.muted{color:var(--t3)}.t2{color:var(--t2)}
.small{font-size:12px}

/* 담당별 */
.sh{display:flex;align-items:center;justify-content:space-between;margin:16px 0 4px;font-size:12px;color:var(--t2)}
.who{display:grid;grid-template-columns:84px 1fr 44px;align-items:center;gap:8px;height:30px;font-size:13px;width:100%;text-align:left;border-radius:6px}
.who .bar{height:3px}
.who .bar em{background:var(--t2)}
.who.cur .bar em,.who.on .bar em{background:var(--acc)}
.who span:last-child{text-align:right;color:var(--t2);font-size:12px}
.who .n{display:flex;align-items:center;gap:4px;white-space:nowrap}
.who.on .n{color:var(--acc-ink)}
.who.dim{opacity:.45}

/* 작업 목록 */
.grp{display:flex;align-items:center;gap:8px;height:36px;margin-top:8px;font-size:13px;font-weight:500;width:100%;text-align:left}
.grp .c{margin-left:auto;font-weight:400;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:4px}
.task{display:grid;grid-template-columns:16px 1fr auto;gap:10px;padding:7px 0;border-top:1px solid var(--line);align-items:start;width:100%;text-align:left}
.task .nm{font-size:13px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task .rs{font-size:12px;color:var(--t2);margin-top:1px}
.task .tm{font-size:11px;color:var(--t3);padding-top:2px}
.box{width:14px;height:14px;border-radius:4px;margin-top:3px;box-shadow:inset 0 0 0 1.5px var(--line2);position:relative}
.box.done{background:var(--t2);box-shadow:none}
.box.done:after{content:"";position:absolute;left:4.5px;top:2px;width:3px;height:6px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:rotate(45deg)}
.box.doing{box-shadow:inset 0 0 0 1.5px var(--acc);background:linear-gradient(90deg,var(--acc) 50%,transparent 50%)}
.box.fail{box-shadow:inset 0 0 0 1.5px var(--neg)}
.box.fail:after{content:"";position:absolute;left:3px;right:3px;top:6px;height:1.5px;background:var(--neg)}
.box.skip{opacity:.4}
.task.done .nm,.task.skip .nm{color:var(--t2)}
.fold{display:flex;align-items:center;gap:8px;height:36px;border-top:1px solid var(--line);font-size:13px;width:100%;text-align:left}
.fold .c{margin-left:auto;font-size:12px;color:var(--t3);display:flex;align-items:center;gap:4px}
.empty{color:var(--t3);text-align:center;padding:24px 0;font-size:13px}

/* 주 보기 */
.wrow{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.wrow:first-child{border-top:0}
.wrow .d b{display:block;font-size:15px;font-weight:500}
.wrow .d small{font-size:11px;color:var(--t3)}
.wrow.today{background:var(--raised);margin:0 -12px;padding:10px 12px;border-radius:8px;width:calc(100% + 24px);border-top-color:transparent}
.wrow.today+.wrow{border-top-color:transparent}
.wrow .ln{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2)}
.wrow .ln .bar{flex:1;height:3px}
.wrow .ln .bar em{background:var(--t2)}
.wrow.today .ln .bar em{background:var(--acc)}
.wrow ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.wrow li{font-size:12px;display:flex;gap:6px;align-items:center}
.k{width:6px;height:6px;border-radius:3px;background:var(--acc);flex:none}
.k.n{background:var(--t3)}
.wrow.off .d b{color:var(--t3)}

/* 월 보기 */
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:8px}
.mh{font-size:11px;color:var(--t3);text-align:center;height:20px}
.mc{height:48px;border-radius:6px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:13px}
.mc:active{background:var(--raised)}
.mc.out{color:var(--t3);opacity:.5}
.mc.we{color:var(--t3)}
.mc.today{background:var(--raised);box-shadow:inset 0 0 0 1px var(--line2)}
.mc i{width:18px}
.mc .ds{display:flex;gap:3px;height:5px}
.mc .ds u{width:5px;height:5px;border-radius:3px;background:var(--acc)}
.mc .ds u.n{background:var(--t2)}
.lg{display:flex;gap:12px;font-size:11px;color:var(--t3);margin-top:8px}
.lg span{display:flex;align-items:center;gap:4px}
.lg u{width:6px;height:6px;border-radius:3px;background:var(--acc);display:inline-block}
.lg u.n{background:var(--t2)}
.ml{display:grid;grid-template-columns:52px 1fr auto;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px;align-items:start;width:100%;text-align:left}
.ml .dd{color:var(--t2);font-size:12px;padding-top:1px}
.ml .rs{font-size:12px;color:var(--t2);margin-top:1px}
.ml .st{font-size:11px;color:var(--t3);padding-top:2px}
.ml .st.on{color:var(--acc-ink)}
.ml .st.bad{color:var(--neg)}

/* 시트(상세·설정) */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);color:var(--t1);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up .2s var(--ease);box-shadow:inset 0 1px 0 var(--line2)}
.sheet::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--t3);opacity:.5;margin:2px auto 12px}
.sheet h3{margin:0 0 8px;font-size:16px;font-weight:500}
#rbtn.on svg{animation:rspin .8s linear infinite}
@keyframes rspin{to{transform:rotate(360deg)}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.kv span:first-child{color:var(--t3)}
.opt{display:flex;align-items:center;gap:10px;min-height:40px;border-top:1px solid var(--line);font-size:13px}
.opt input{width:18px;height:18px;accent-color:var(--acc);margin:0}
.mr,.mhd{display:grid;grid-template-columns:64px 76px 1fr auto;gap:8px;align-items:center;font-size:13px}
.mhd{font-size:11px;color:var(--t3);height:20px;margin-top:8px}
.mr{min-height:44px;border-top:1px solid var(--line);padding:4px 0}
.mr .r{display:block;font-size:11px;color:var(--t3)}
.pw{font-family:ui-monospace,Consolas,monospace;color:var(--t2);letter-spacing:.08em;word-break:break-all}
.pw.show{color:var(--t1);letter-spacing:0;user-select:all}
.gpw{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:400;color:var(--pwc);user-select:all;margin-left:2px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gpw.gno{color:var(--acc-ink);flex:none}
.mi{width:100%;min-width:0;height:32px;padding:0 6px;border:0;border-radius:6px;background:var(--raised);color:var(--t1);font:13px ui-monospace,Consolas,monospace;outline:none;box-shadow:inset 0 0 0 1px var(--line)}
.mi:focus{box-shadow:inset 0 0 0 1px var(--acc)}
.mi.pwi{color:var(--pwc)}
.mi.chg{box-shadow:inset 0 0 0 1px var(--acc)}
.mr.ed{grid-template-columns:64px 92px 1fr}
.help{font-size:13px;color:var(--t2);line-height:1.6}
.help h4{font-size:13px;color:var(--t1);font-weight:500;margin:12px 0 2px}
.help p{margin:0}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* 로그인 (차차차와 같은 모양) */
.login{max-width:360px;margin:16vh auto 0;padding:0 24px;text-align:center}
.login h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px}
.login p{margin:0 0 24px;color:var(--t2);font-size:14px}
.login .btn{width:100%;height:44px;font-size:15px;margin-top:8px}
.login .lm{min-height:22px;margin:0 0 12px;font-size:13px;color:var(--t3)}
.login .lm.err{color:var(--neg)}

/* 말만해요 안에 모듈로 뜰 때(?embed=1): 위 바 없이 내용만 */
.embed .top{display:none!important}
.embed main{padding-top:56px;padding-bottom:96px}
.embed .login{margin-top:22vh}
.eseg{display:none}
.embed .eseg{display:flex}
</style>
</head>

<section id="login" class="login">
  <h1>팀쿡</h1>
  <p>팀 운영 일과판</p>
  <div class="lm" id="lmsg">확인 중…</div>
  <button class="btn pri" id="loginBtn" hidden>Google 계정으로 로그인</button>
  <button class="btn sec" id="loginOtherBtn" hidden>다른 계정으로 로그인</button>
</section>
<header class="top" id="top" hidden>
  <button class="logo" data-act="today" aria-label="오늘로"><span class="mark"></span>팀쿡</button><span class="sync" id="sync"></span>

  <button class="ib" data-act="settings" aria-label="설정"><svg class="i" style="width:18px;height:18px"><use href="#gear"/></svg></button>
</header>
<main id="main" hidden></main>

<script>
"use strict";
/* ===== 설정 (여기만 고치면 됩니다) ===== */
const VER="1.2.5";
const ALLOWED=["blue10kp@gmail.com"]; // 로그인을 허용할 구글 계정 (소문자로, 여러 개면 쉼표로 추가)
const GCLIENT="482206908404-5sdbvetcrc8j7ctrhe6aa23ccmd3d05d.apps.googleusercontent.com"; // 구글 로그인 클라이언트 ID (공개되어도 되는 값)
const GSCOPE="openid email https://www.googleapis.com/auth/drive"; // PC 세션들이 쓴 파일을 읽어야 해서 drive (차차차·신한FC와 같은 권한)
const ROOT=["Claude","app","teamcook"]; // 내 드라이브 안 저장 위치
const TL_FILE="작업목록.json",PREF_FILE="팀쿡_설정.json",REQ_FILE="시작요청.json";
const REFRESH_MS=60000; // 화면이 열려 있으면 1분마다 새로 읽음

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const I=(n,s)=>`<svg class="i"${s?` style="width:${s}px;height:${s}px"`:""}><use href="#${n}"/></svg>`;

/* ---------- 구글 로그인 (공통 출입증 blue10kp.gauth — app\_공통\공통로그인.md) ---------- */
const GAUTH="blue10kp.gauth",GAC="teamcook.gaccount";
let gTok=null,lsBad=false;
const normScope=s=>({email:"https://www.googleapis.com/auth/userinfo.email",profile:"https://www.googleapis.com/auth/userinfo.profile"})[s]||s;
const SCOPE_UP={"https://www.googleapis.com/auth/drive.file":["https://www.googleapis.com/auth/drive"],"https://www.googleapis.com/auth/drive.readonly":["https://www.googleapis.com/auth/drive"]};
function scopesCover(have,need){have=(have||[]).map(normScope);return need.map(normScope).every(n=>have.includes(n)||(SCOPE_UP[n]||[]).some(u=>have.includes(u)))}
const allowedEm=e=>ALLOWED.map(x=>x.toLowerCase()).includes(String(e||"").toLowerCase());
function readAuth(){try{const a=JSON.parse(localStorage.getItem(GAUTH)||"null");return a&&typeof a==="object"&&typeof a.token==="string"&&a.token&&a.exp>0?a:null}catch(e){return null}}
function writeAuth(a){try{localStorage.setItem(GAUTH,JSON.stringify(a));lsBad=false}catch(e){lsBad=true}}
function storedTok(){const a=readAuth();return a&&a.exp>Date.now()+60000?a.token:(lsBad?gTok:null)}
function authOK(){const a=readAuth();return!!(a&&a.exp>Date.now()+120000&&scopesCover(a.scopes,GSCOPE.split(" "))&&allowedEm(a.email))}
function setAuthEmail(em){const a=readAuth();if(a){a.email=em;writeAuth(a)}}
function clearTok(onlyIf){try{const a=readAuth();if(!onlyIf||(a&&a.token===onlyIf))localStorage.removeItem(GAUTH)}catch(e){}if(!onlyIf||gTok===onlyIf)gTok=null}
/* 오전 6시 일괄 로그아웃 (공통로그인.md, 2026-11-24 사용자 지시): 오늘 06:00 전에 받은 출입증이면 지우고 로그인 화면 */
const AM6="blue10kp.gauth.am6";
const am6Cut=()=>{const d=new Date(),c=new Date(d.getFullYear(),d.getMonth(),d.getDate(),6,0,0);if(d<c)c.setDate(c.getDate()-1);return+c};
const am6Day=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const am6Pending=()=>{try{return localStorage.getItem(AM6)===am6Day()}catch(e){return false}};
function am6Check(){
  if(DEMO)return false;const a=readAuth();if(!a)return false;
  const at=a.login>0?a.login:a.exp-3600000;if(at>=am6Cut())return false;
  try{localStorage.removeItem(GAUTH);localStorage.setItem(AM6,am6Day())}catch(e){}
  gTok=null;
  if(ready||!$("#login").hidden){tl=null;for(const k in days)delete days[k];for(const k in dayMeta)delete dayMeta[k];for(const k in fcache)delete fcache[k];team=null;
    showLogin("오전 6시가 지나 로그아웃되었습니다. 다시 로그인해 주세요.")}
  return true;
}
const gAcct=()=>{try{return localStorage.getItem(GAC)||""}catch(e){return""}};
function requestTok(prompt,noHint){
  return new Promise((res,rej)=>{
    const g=window.google&&google.accounts&&google.accounts.oauth2;
    if(!g)return rej(new Error("구글 로그인 모듈을 불러오지 못했습니다. 잠시 후 다시 시도하세요."));
    const sa=readAuth(),hintEm=gAcct()||(sa&&allowedEm(sa.email)?sa.email:"");
    const c=g.initTokenClient({client_id:GCLIENT,scope:GSCOPE,include_granted_scopes:true,hint:noHint?undefined:(hintEm||undefined),
      callback:r=>{
        if(r.error)return rej(new Error("구글 연결 실패: "+r.error));
        const sc=r.scope?String(r.scope).split(/\s+/).filter(Boolean):[];
        if(!scopesCover(sc,GSCOPE.split(" ")))return rej(new Error("Google Drive 권한을 허용해야 합니다. 다시 로그인하면서 모든 항목에 체크해 주세요."));
        gTok=r.access_token;
        writeAuth({v:1,token:r.access_token,exp:Date.now()+(r.expires_in||3600)*1000,scopes:sc,email:"",login:Date.now()});
        res(r.access_token);
      },
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"구글 로그인 창이 닫혔습니다.":"구글 로그인 창을 열 수 없습니다. 팝업 차단을 확인하세요."))});
    c.requestAccessToken({prompt:prompt==null?"":prompt});
  });
}
async function gfetch(url,opt,asText){
  const t=storedTok()||gTok;if(!t)throw new Error("GOOGLE_AUTH");
  const o=opt||{};let r=await fetch(url,{...o,headers:{Authorization:"Bearer "+t,...(o.headers||{})},cache:"no-store"});
  if(r.status===401){
    const a=readAuth();
    if(a&&a.token!==t&&a.exp>Date.now()+60000)r=await fetch(url,{...o,headers:{Authorization:"Bearer "+a.token,...(o.headers||{})},cache:"no-store"});
    if(r.status===401){clearTok(t);if(a)clearTok(a.token);throw new Error("GOOGLE_AUTH")}
  }
  if(!r.ok)throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,160));
  return asText?r.text():r.json();
}

/* ---------- 구글 드라이브 (Claude/app/teamcook/설정 · 데이터) ---------- */
const DAPI="https://www.googleapis.com/drive/v3",DUP="https://www.googleapis.com/upload/drive/v3";
const qv=x=>String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
const parseDoc=t=>JSON.parse(String(t).replace(/^﻿/,""));
const folders={};
async function dList(q,fields){const d=await gfetch(DAPI+"/files?pageSize=200&fields="+encodeURIComponent("files("+(fields||"id,name,modifiedTime")+")")+"&q="+encodeURIComponent(q+" and trashed=false"));return d.files||[]}
async function dFolder(sub,create){ // sub = "설정" | "데이터"
  if(folders[sub])return folders[sub];
  let id="root";
  for(const n of[...ROOT,sub]){
    let f=(await dList("'"+qv(id)+"' in parents and name='"+qv(n)+"' and mimeType='application/vnd.google-apps.folder'"))[0];
    if(!f){if(!create)return null;f=await gfetch(DAPI+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,mimeType:"application/vnd.google-apps.folder",parents:[id]})})}
    id=f.id;
  }
  return folders[sub]=id;
}
const fcache={}; // "설정/이름" → {id,mod,data}
async function readFile(sub,name){ // 없으면 null
  if(DEMO){const r=await fetch((sub==="데이터"?"_데모/":"설정/")+encodeURIComponent(name),{cache:"no-store"});return r.ok?r.json():null}
  const k=sub+"/"+name;let c=fcache[k];
  if(c){try{const m=await gfetch(DAPI+"/files/"+c.id+"?fields=modifiedTime,trashed");if(!m.trashed){if(m.modifiedTime!==c.mod){c.data=parseDoc(await gfetch(DAPI+"/files/"+c.id+"?alt=media",null,true));c.mod=m.modifiedTime}return c.data}}catch(e){if(e.message==="GOOGLE_AUTH")throw e}delete fcache[k]}
  const fo=await dFolder(sub,false);if(!fo)return null;
  const f=(await dList("'"+qv(fo)+"' in parents and name='"+qv(name)+"'"))[0];if(!f)return null;
  c=fcache[k]={id:f.id,mod:f.modifiedTime,data:parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true))};
  return c.data;
}
async function writeFile(sub,name,obj){
  if(DEMO)return;
  const k=sub+"/"+name,body=JSON.stringify(obj,null,1);let c=fcache[k];
  if(!c){const fo=await dFolder(sub,true),f=(await dList("'"+qv(fo)+"' in parents and name='"+qv(name)+"'"))[0];if(f)c=fcache[k]={id:f.id,mod:f.modifiedTime,data:null}}
  let meta;
  if(c)meta=await gfetch(DUP+"/files/"+c.id+"?uploadType=media&fields=id,modifiedTime",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
  else{
    const fo=await dFolder(sub,true),bd="tc"+Date.now().toString(36);
    const mp="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name,parents:[fo],mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
    meta=await gfetch(DUP+"/files?uploadType=multipart&fields=id,modifiedTime",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});
  }
  fcache[k]={id:meta.id,mod:meta.modifiedTime,data:obj};
}
/* 날짜 파일: 데이터/YYYY-MM-DD.json. 한 달 치를 이름으로 찾아 바뀐 것만 다시 읽음 */
const days={},dayMeta={};
async function loadMonth(ym){
  if(DEMO){
    const list=await fetch("_데모/목록.json",{cache:"no-store"}).then(r=>r.ok?r.json():[]).catch(()=>[]);
    await Promise.all(list.filter(n=>n.startsWith(ym)).map(async n=>{const d=await readFile("데이터",n);if(d)days[n.slice(0,10)]=d}));
    return;
  }
  const fo=await dFolder("데이터",false);if(!fo)return;
  const fs=await dList("'"+qv(fo)+"' in parents and name contains '"+qv(ym)+"-'");
  await Promise.all(fs.filter(f=>/^\d{4}-\d{2}-\d{2}\.json$/.test(f.name)).map(async f=>{
    const ds=f.name.slice(0,10);
    if(dayMeta[ds]&&dayMeta[ds].mod===f.modifiedTime)return;
    try{days[ds]=parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));dayMeta[ds]={id:f.id,mod:f.modifiedTime}}catch(e){if(e.message==="GOOGLE_AUTH")throw e}
  }));
}

const hol=()=>new Set((tl&&tl.holidays)||[]);
function isBiz(ds){const w=pd(ds).getDay();return w>0&&w<6&&!hol().has(ds)}
function nextBiz(ds){while(!isBiz(ds))ds=addD(ds,1);return ds}
function addBiz(ds,n){while(n>0){ds=addD(ds,1);if(isBiz(ds))n--}return ds}
function nthBiz(ds){if(!isBiz(ds))return 0;let n=0,d=ds.slice(0,8)+"01";while(d<=ds){if(isBiz(d))n++;d=addD(d,1)}return n}
function overdueOf(ds){ // 이 날이 연체 확인일이면 {m,d}(이체 월·일)
  const t=pd(ds);
  for(const back of[0,1]){const y=t.getFullYear(),m=t.getMonth()-back;
    for(const d of[5,10,15,20,25]){const x=iso(new Date(y,m,d));if(addBiz(nextBiz(x),2)===ds){const dd=pd(x);return{m:dd.getMonth()+1,d}}}}
  return null;
}
const prevMonthName=ds=>{const d=pd(ds);d.setDate(1);d.setMonth(d.getMonth()-1);return(d.getMonth()+1)+"월분"};
function plan(ds){ // 작업목록으로 계산한 그날 할 일 (special: 정해진 날 작업)
  if(!tl||!isBiz(ds))return[];
  const out=[];
  for(const t of tl.tasks||[]){
    const w=t.when||{type:"daily"};let name=t.name,tag="",special=false;
    if(w.type==="daily");
    else if(w.type==="weekly"){if(pd(ds).getDay()!==+w.dow)continue;tag="주간"}
    else if(w.type==="bizday"){if(nthBiz(ds)!==+w.n)continue;special=true;if(w.prevMonth)name+=" · "+prevMonthName(ds)}
    else if(w.type==="overdue"){const o=overdueOf(ds);if(!o)continue;special="overdue";tag="확인일";name+=" · "+o.m+"월 "+o.d+"일분"}
    else continue;
    out.push({id:t.id,who:t.who,name,tag,special,note:t.note||""});
  }
  return out;
}
function items(ds){ // 계획 + 날짜 파일 상태를 합침
  const p=plan(ds),f=days[ds],m=new Map(((f&&f.items)||[]).map(i=>[i.id,i]));
  const out=p.map(x=>{const i=m.get(x.id);m.delete(x.id);return i?{...x,...i,name:i.name||x.name,status:i.status||"wait"}:{...x,status:"wait"}});
  for(const i of m.values()){const t=(tl&&tl.tasks||[]).find(x=>x.id===i.id)||{};out.push({tag:"",note:t.note||"",special:false,...i,who:i.who||t.who||"etc",name:i.name||t.name||i.id,status:i.status||"wait"})}

  return out.map((x,k)=>[x,ix.has(x.id)?ix.get(x.id):1e6+k]).sort((p,q)=>p[1]-q[1]).map(z=>z[0]);
}

function vMonth(){

  try{
    const months=new Set([cur.slice(0,7),TODAY().slice(0,7)]);
    if(view!=="month"){const ws=weekStart(cur);months.add(ws.slice(0,7));months.add(addD(ws,6).slice(0,7))}
    const [t,r]=await Promise.all([readFile("설정",TL_FILE),readFile("데이터",REQ_FILE).catch(()=>null)]);
    tl=t;startReq=r;
    await Promise.all([...months].map(loadMonth).concat(loadTeam()));
    lastRead=new Date();readFail=false;
  }catch(e){
    if(e.message==="GOOGLE_AUTH"){busy=false;showLogin("로그인이 만료되었습니다. 다시 로그인해 주세요.");return}
    readFail=true;
  }finally{busy=false;if(rb)rb.classList.remove("on")}
  render();
}
async function startWork(){
  const t=TODAY();
  if(!confirm("업무를 시작할까요?\nPC에 오늘 일과 시작 요청을 보내요."))return;
  const off=-new Date().getTimezoneOffset(),now=new Date(),at=t+"T"+hm(now)+":"+pad(now.getSeconds())+(off>=0?"+":"-")+pad(Math.floor(Math.abs(off)/60))+":"+pad(Math.abs(off)%60);
  const req={v:1,date:t,at,from:"teamcook",state:"요청"};
  try{await writeFile("데이터",REQ_FILE,req);startReq=req;render()}
  catch(e){if(e.message==="GOOGLE_AUTH")showLogin("로그인이 만료되었습니다. 다시 로그인한 뒤 다시 눌러 주세요.");else alert("시작 요청을 저장하지 못했어요. 인터넷을 확인하고 다시 눌러 주세요.")}
}

/* ---------- 이동 ---------- */
function go(o){ // {view,day}
  navStack.push({view,cur,filt});if(navStack.length>30)navStack.shift();
  if(o.view)view=o.view;if(o.day)cur=o.day;filt=null;
  const need=[cur.slice(0,7)].filter(ym=>!Object.keys(days).some(k=>k.startsWith(ym)));
  render();scrollTo(0,0);if(need.length&&ready)loadAll();
}
function step(dir){ // 앞뒤 이동: 일 보기 = 하루, 주 보기 = 1주, 월 보기 = 1개월
  if(view==="month"){const d=pd(cur.slice(0,8)+"01");d.setMonth(d.getMonth()+dir);cur=iso(d)}
  else cur=addD(cur,dir*(view==="week"?7:1));
  filt=null;render();loadAll();
}
(()=>{ // 화면을 옆으로 밀어도 같은 단위로 이동 (왼쪽으로 밀기 = 다음, 오른쪽 = 이전)
  let x0=null,y0=0,t0=0;
  document.addEventListener("touchstart",e=>{if(!ready||$("#modal").innerHTML.trim()||e.touches.length!==1||!e.target.closest("main")){x0=null;return}x0=e.touches[0].clientX;y0=e.touches[0].clientY;t0=Date.now()},{passive:true});
  document.addEventListener("touchend",e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>60&&Math.abs(dy)<Math.abs(dx)*0.6&&Date.now()-t0<600)step(dx<0?1:-1)},{passive:true});
})();
function goBack(){
  if($("#modal").innerHTML.trim()){closeSheet();return true}
  const p=navStack.pop();if(p){view=p.view;cur=p.cur;filt=p.filt;render();scrollTo(0,0);return true}
  return false;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act],[data-view],[data-day],[data-move],[data-mmove],[data-who],[data-grp],[data-task]");if(!b)return;
  if(b.classList.contains("modal")&&e.target!==b)return; // 시트 안을 누른 것은 닫지 않음
  const a=b.dataset;
  if(a.act==="close")closeSheet();
  else if(a.act==="settings")settingsSheet();
  else if(a.act==="team")teamSheet();
  else if(a.act==="tsave")saveTeam();
  else if(a.act==="tcancel"){teamEdit={};drawTeam()}
  else if(a.act==="today")go({view:"day",day:TODAY()});
  else if(a.act==="start")startWork();
  else if(a.act==="reload"){$("#modal").innerHTML="";loadAll(true)}
  else if(a.act==="logout")logout();
  else if(a.act==="install"&&deferredInstall){deferredInstall.prompt();deferredInstall=null;$("#modal").innerHTML=""}
  else if(a.view){if(a.view!==view)go({view:a.view})}
  else if(a.day){go({view:"day",day:a.day})}
  else if(a.move||a.mmove)step(+(a.move||a.mmove)<0?-1:1);
  else if(a.who){filt=filt===a.who?null:a.who;render()}
  else if(a.grp){const k=cur+"|"+a.grp,o=document.querySelector(`[data-grp="${CSS.escape(a.grp)}"]`);openGrp[k]=!(o&&o.classList.contains("grp"));render()}
  else if(a.task)taskSheet(a.task);
});

/* ---------- 로그인 흐름 ---------- */
function setShell(on){$("#top").hidden=!on;$("#main").hidden=!on;$("#login").hidden=on}
function showLogin(msg,isErr){
  ready=false;closeSheet();$("#main").innerHTML="";setShell(false);
  const m=$("#lmsg");m.textContent=msg||"";m.className="lm"+(msg&&isErr!==false&&/권한|실패|만료|못|않|닫혔|허용/.test(msg)?" err":"");
  $("#loginBtn").textContent="Google 계정으로 로그인";$("#loginBtn").hidden=false;$("#loginOtherBtn").hidden=false;
  if(EMBED){m.textContent="말만해요에서 다시 로그인해 주세요.";m.className="lm";$("#loginBtn").hidden=true;$("#loginOtherBtn").hidden=true}
}
function denyAccount(em){setAuthEmail(em);try{localStorage.removeItem(GAC)}catch(e){}ready=false;showLogin("권한이 없습니다. 이 앱은 허용된 계정만 쓸 수 있어요. 허용된 계정으로 다시 로그인해 주세요.")}
async function checkAccount(){
  const u=await gfetch("https://www.googleapis.com/oauth2/v3/userinfo"),em=String(u.email||"").toLowerCase();
  if(!em)throw new Error("구글 계정 이메일을 읽지 못했습니다.");
  return{em,ok:allowedEm(em)&&u.email_verified!==false};
}
async function startApp(){
  $("#lmsg").className="lm";$("#lmsg").textContent="불러오는 중…";$("#loginBtn").hidden=true;$("#loginOtherBtn").hidden=true;
  const p=await readFile("설정",PREF_FILE).catch(e=>{if(e.message==="GOOGLE_AUTH")throw e;return null});
  if(p&&typeof p==="object")prefs={...prefs,...p};
  applyTheme(window.__forceTheme?window.__forceTheme==="dark":prefs.dark!==false);
  ready=true;setShell(true);
  if(pendingGo){applyGoObj(pendingGo);pendingGo=null}
  await loadAll();
}
async function doLogin(other){
  $("#lmsg").className="lm";$("#lmsg").textContent="로그인 중…";
  try{await requestTok(other||am6Pending()?"select_account":undefined,other);try{localStorage.removeItem(AM6)}catch(e){}const a=await checkAccount();if(!a.ok)return denyAccount(a.em);setAuthEmail(a.em);try{localStorage.setItem(GAC,a.em)}catch(e){}await startApp()}
  catch(e){showLogin(e.message==="GOOGLE_AUTH"?"로그인이 만료되었습니다. 다시 로그인해 주세요.":e.message)}
}
$("#loginBtn").addEventListener("click",()=>doLogin(false));
$("#loginOtherBtn").addEventListener("click",()=>{clearTok();doLogin(true)});
async function boot(){
  if(DEMO){prefs.dark=true;ready=true;setShell(true);if(pendingGo){applyGoObj(pendingGo);pendingGo=null}await loadAll();return}
  am6Check();
  if(authOK()){
    try{checkAccount().then(a=>{if(!a.ok)denyAccount(a.em)},()=>{});await startApp();return}
    catch(e){showLogin(e.message==="GOOGLE_AUTH"?"":"불러오지 못했어요. 인터넷을 확인하고 다시 시도해 주세요.");return}
  }
  const a=readAuth();showLogin("");
  if(a&&a.exp>Date.now()&&allowedEm(a.email)&&!scopesCover(a.scopes,GSCOPE.split(" ")))$("#loginBtn").textContent="구글 연결 (권한 추가)";
}
function logout(){
  if(!confirm("모든 앱에서 로그아웃됩니다. 로그아웃할까요?"))return;
  clearTok();ready=false;tl=null;for(const k in days)delete days[k];for(const k in dayMeta)delete dayMeta[k];for(const k in fcache)delete fcache[k];
  showLogin("로그아웃했습니다.",false);
}
document.addEventListener("visibilitychange",()=>{if(document.hidden||am6Check())return;if(ready)loadAll();else if(!$("#login").hidden&&authOK())boot()});
window.addEventListener("focus",()=>{if(am6Check())return;if(!ready&&!$("#login").hidden&&authOK())boot()});
setInterval(()=>{if(ready&&!document.hidden)loadAll()},REFRESH_MS);
setInterval(am6Check,60000);

/* ---------- 말만해요 모듈 (#go=day|week|month&date=YYYY-MM-DD) ---------- */
let pendingGo=null;
function parseGo(h){const p=new URLSearchParams(String(h||"").replace(/^#/,""));const g=p.get("go");if(!g)return null;return{go:g,date:p.get("date")||p.get("id")||""}}
function applyGoObj(g){if(!g)return;if(["day","week","month"].includes(g.go))view=g.go;if(/^\d{4}-\d{2}-\d{2}$/.test(g.date))cur=g.date;else if(g.go==="today"){view="day";cur=TODAY()}}
function notifyWhere(){
  if(!EMBED||window.parent===window)return;
  const canBack=!!$("#modal").innerHTML.trim()||navStack.length>0;
  try{window.parent.postMessage({type:"blue10kp-where",app:"teamcook",go:view,id:cur,canBack},location.origin)}catch(e){}
}
window.blue10kpGo=g=>{const o=typeof g==="string"?parseGo(g):g;if(!o)return;if(!ready){pendingGo=o;return}navStack.push({view,cur,filt});applyGoObj(o);filt=null;render();loadAll()};
if(EMBED&&window.parent!==window){ // 시트가 떠 있으면 그 버튼 줄 높이만큼 말만해요 버튼을 올려 달라고 알림
  let last=-1;
  const calc=()=>{const m=$("#modal");let lift=0;
    if(m&&m.innerHTML.trim()){const sh=m.querySelector(".sheet");if(sh){const sb=sh.getBoundingClientRect().bottom;m.querySelectorAll(".acts .btn").forEach(b=>{const r=b.getBoundingClientRect();if(r.height>0&&r.bottom>sb-160)lift=Math.max(lift,Math.round(sb-r.top))})}}
    if(lift!==last){last=lift;try{window.parent.postMessage({type:"blue10kp-fab",lift},location.origin)}catch(e){}}};
  const sched=()=>{setTimeout(calc,30);setTimeout(calc,300)};
  new MutationObserver(sched).observe($("#modal"),{childList:true,subtree:true});
}
window.addEventListener("message",e=>{
  if(e.origin!==location.origin||!e.data||typeof e.data!=="object")return;
  if(e.data.type==="blue10kp-go")window.blue10kpGo(e.data);
  else if(e.data.type==="blue10kp-back"){goBack();notifyWhere()}
  else if(e.data.type==="blue10kp-theme"&&(e.data.theme==="dark"||e.data.theme==="light")){window.__forceTheme=e.data.theme;applyTheme(e.data.theme==="dark")}
});
window.addEventListener("hashchange",()=>{const g=parseGo(location.hash);if(g)window.blue10kpGo(g)});
window.addEventListener("popstate",()=>{});
pendingGo=parseGo(location.hash);
if("serviceWorker" in navigator&&!DEMO)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
