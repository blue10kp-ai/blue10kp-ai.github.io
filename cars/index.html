<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171B22" media="(prefers-color-scheme: dark)">

<link rel="preconnect" href="https://www.googleapis.com">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">

<title>차차차</title>
<style>
/* 신한FC m과 같은 디자인 기준(tokens.css·design.css)을 이 파일 안에 옮겨 둔 것. 신한FC 파일은 링크하지 않음 */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--raised:#F0F2F5;--line:rgba(20,30,50,.10);
  --t1:#151A22;--t2:#4B5361;--t3:#6B7382;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--accent-weak:rgba(31,78,140,.08);
  --ok:#1D7A46;--warn:#A8620B;--bad:#C0392B;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-ctl:8px;--r-card:12px;--r-panel:16px;
  --ease:cubic-bezier(.2,.8,.2,1);--t-fast:120ms;--t-in:200ms;--navh:60px
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#747C8A;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --ok:#4CC282;--warn:#E0A04A;--bad:#EF7A6C}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.lock{overflow:hidden;overscroll-behavior-y:contain}
html,body{font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--t1)}
body{margin:0;padding-bottom:calc(var(--navh) + 36px + env(safe-area-inset-bottom));font-variant-numeric:tabular-nums}
button,input,select,textarea{font-family:var(--font)}
button{color:inherit;cursor:pointer}
/* 상단 바: 색 없이 표면 + 헤어라인 */
header{position:sticky;top:0;z-index:5;background:var(--surface);color:var(--t1);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:56px;display:flex;align-items:center;font-size:17px;font-weight:600;cursor:pointer}
.wrap{padding:16px 16px 0;max-width:640px;margin:0 auto}
/* 차 고르기: 바탕 칸 안에서 선택만 흰색 */
.cars{display:flex;gap:2px;background:var(--raised);border-radius:var(--r-ctl);padding:2px;margin:12px 16px 0}
@media(min-width:672px){.cars{max-width:608px;margin:12px auto 0}}
.chip{flex:1;min-height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--t2);font-size:13px;font-weight:500;white-space:nowrap}
.chip:last-child:not(.on){flex:0 0 40px}
.chip.on{background:var(--surface);color:var(--t1);box-shadow:0 0 0 1px var(--line)}
/* 카드: 얇은 테두리, 그림자 없음 */
.card{background:var(--surface);border:1px solid var(--line);box-shadow:none;border-radius:var(--r-card);padding:16px;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--t3)}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;margin:0 0 8px}
.hero .ph{background:var(--raised);aspect-ratio:5/2;display:flex;align-items:center;justify-content:center}
.hero .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 58%}
.hero .ph svg{width:64%;max-width:260px}
.hero .in{padding:14px 16px}
.hero h2{margin:0;font-size:19px;font-weight:600}
.sub{color:var(--t2);font-size:13px;line-height:1.45}
.k{color:var(--t3);font-size:12px}.v{font-weight:600}
.big{font-size:22px;font-weight:600;letter-spacing:-.2px}
.save{color:var(--ok)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{font-weight:500}.row .r{text-align:right;white-space:nowrap}
.l{display:flex;align-items:center;min-width:0}
.ic{flex:0 0 42px;height:24px;border-radius:6px;background:var(--raised);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--t2);margin-right:12px}
.empty{color:var(--t3);text-align:center;padding:20px 0;font-size:13px}
.note{font-size:13px;color:var(--t3);margin-top:8px}
.warn{border:1px solid var(--warn);border-left:3px solid var(--warn);background:var(--surface);color:var(--t1);border-radius:var(--r-card);padding:8px 10px;font-size:13px;margin-top:8px}
/* 버튼: 작은 윤곽 버튼, 주요 버튼은 강조색 테두리·글자 */
.btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:30px;padding:0 14px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t2);font-size:13px;font-weight:600;line-height:1;white-space:nowrap;transition:background-color var(--t-fast) var(--ease)}
.btn:active{background:var(--raised)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.btn.sm{height:24px;padding:0 9px;font-size:12px;font-weight:700;color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn:disabled{opacity:.4}
.acts{display:flex;gap:8px;margin-top:12px}.acts .btn{flex:1}
/* 입력칸: 낮고 단정하게 */
label{display:block;font-size:13px;color:var(--t3);margin:12px 0 4px}
input,select,textarea{width:100%;height:32px;padding:0 10px;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t1)}
textarea{height:auto;padding:8px 10px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=color]{padding:2px}
.inl{display:flex;gap:8px}.inl>*{flex:1;min-width:0}
/* 상태 표시: 색 알약 대신 점 + 글자 */
.badge{display:inline-flex;align-items:center;gap:6px;height:fit-content;background:none;padding:0;border-radius:0;font-size:12px;font-weight:500;color:var(--t2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--t3);flex:none}
.badge.on::before{background:var(--ok)}
/* 하단 메뉴: 선 아이콘 + 글자, 선택은 위쪽 책갈피 선 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 8px max(0px,calc(env(safe-area-inset-bottom) - 10px))}
nav button{flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:0;background:none;position:relative;font-size:11px;font-weight:500;color:var(--t3)}
nav .ni{display:block;line-height:0}
nav .ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
/* 입력 창(시트) */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--t1);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);width:100%;max-width:640px;max-height:90vh;overflow:auto;padding:8px 16px 16px;animation:up var(--t-in) var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--t3);opacity:.5;margin:2px auto 12px}
.sheet h3{margin:0 0 4px;font-size:17px;font-weight:600}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.msg{margin:0;padding:10px 12px;border-radius:var(--r-card);background:var(--accent-weak);color:var(--t1);font-size:13.5px;text-align:left;white-space:pre-line}
.pend{border:1px solid var(--line);border-radius:var(--r-card);padding:12px;text-align:left}
.crop canvas{display:block}
.crop input[type=range]{width:100%;height:auto;padding:0;border:0;margin-top:4px;accent-color:var(--accent)}
.sec{font-size:13px;font-weight:600;color:var(--t2);margin:16px 2px 8px}
.evb+.evb{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 6px;text-align:right;border-top:1px solid var(--line);white-space:nowrap}
.tbl th{color:var(--t3);font-weight:500;border-top:0}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.bar{height:6px;border-radius:3px;background:var(--raised);margin-top:6px}
.bar i{display:block;height:6px;border-radius:3px;background:var(--accent)}
[hidden]{display:none!important}
header small{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}
header small.fail{color:var(--bad)}
.login{max-width:360px;margin:16vh auto 0;padding:0 24px;text-align:center}
.login h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px}
.login p{margin:0 0 24px;color:var(--t2);font-size:14px}
.login .btn{width:100%;height:44px;font-size:15px;margin-top:8px}
.login .lm{min-height:22px;margin:0 0 12px;font-size:13px;color:var(--t3)}
.login .lm.err{color:var(--bad)}
.login .hint{margin-top:20px;font-size:12px;color:var(--t3)}
/* 말만해요 안에 모듈로 뜰 때(?embed=1): 위·아래 메뉴 없이 내용만 */
.embed header,.embed nav,.embed .ai,.embed .scrim{display:none!important}
.embed body{padding-top:56px;padding-bottom:96px} /* 위: 말만해요 플로팅 버튼 자리, 아래: 말만해요 버튼(오른쪽 아래)에 마지막 내용이 가리지 않게 */
.embed [data-act="logout"]{display:none}
.embed .login{margin-top:22vh}
</style>
</head>
<body>
<script>try{if(new URLSearchParams(location.search).get('embed')==='1')document.documentElement.classList.add('embed')}catch(e){}</script>
<section id="login" class="login">
  <h1>차차차</h1>
  <p>나의 차 기록장</p>
  <div class="lm" id="lmsg">확인 중…</div>
  <button class="btn pri" id="loginBtn" hidden>Google 계정으로 로그인</button>
  <button class="btn" id="loginOtherBtn" hidden>다른 계정으로 로그인</button>
</section>
<header id="title" hidden><span>차차차</span><small id="sync"></small></header>
<div class="cars" id="cars" hidden></div>
<div class="wrap" id="main" hidden></div>
<nav id="nav" hidden></nav>
<div id="modal"></div>

<script>
"use strict";
/* ===== 설정 (여기만 고치면 됩니다) ===== */
const ALLOWED=["blue10kp@gmail.com"]; // 로그인을 허용할 구글 계정 (소문자로, 여러 개면 쉼표로 추가)
const GCLIENT="482206908404-5sdbvetcrc8j7ctrhe6aa23ccmd3d05d.apps.googleusercontent.com"; // 구글 로그인 클라이언트 ID (공개되어도 되는 값)
const GSCOPE="openid email https://www.googleapis.com/auth/drive"; // 신한FC m과 같은 권한(이미 허용해 둔 권한이라 한 번에 로그인됨)
const DRIVE_PATH=["Claude","app","차차차","설정"],DRIVE_FILE="차차차_기록.json"; // 내 드라이브 안 저장 위치
/* ===== 끝 ===== */
const KEY="chachacha.v1",OLDKEYS=["teslaChagyebu.v1","teslaGagyeok.v1"]; // 옛 이름으로 저장된 기록은 읽어서 새 키로 옮김
const COMPS=[["BMW 5시리즈 528i 가솔린",11.0],["BMW 5시리즈 520i 가솔린",11.5],["직접 입력",11.0]];
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return iso(d)};
const won=n=>(Math.round(n)||0).toLocaleString("ko-KR")+"원";
const num=n=>Math.round(n).toLocaleString("ko-KR");
const fuelDef=()=>({comp:COMPS[0][0],kmL:11.0,price:1840,kmkWh:5.0,kwh:319});

let tiresMigrated=false;
function norm(d){ // 옛 파일·새 파일 모두 같은 모양으로 맞춤
  d.events??=[];d.inboxDone??=[];
  d.cars.forEach(c=>{c.photo??="";c.photoCredit??="";c.startKm??=0;c.plate??="";c.notes??="";c.fuel??=fuelDef();
    ["odo","maint","ins","plans"].forEach(k=>{c[k]??=[]})});
  if(!d.tires){ // 옛 모양(차마다 따로)의 타이어·장착 이력을 모두 공용 목록으로 옮김
    d.tires=[];d.mounts=d.mounts||[];
    d.cars.forEach(c=>{(c.tires||[]).forEach(t=>d.tires.push(t));(c.mounts||[]).forEach(m=>d.mounts.push({...m,carId:c.id}));delete c.tires;delete c.mounts});
    tiresMigrated=true;
  }
  d.mounts??=[];d.cars.forEach(c=>{delete c.tires;delete c.mounts});
  d.events.forEach(e=>{if(e.name==="BMW 차징카드 구입"){e.name="BMW 차징카드";tiresMigrated=true}}); // 이름에서 "구입" 제외 (한 번만, 고친 뒤 자동 저장)
  d.tires.forEach(t=>{t.newDepth??=0;t.treads??=[];t.baseKm??=0;t.lifeKm??=0;t.price??="";t.note??="";t.size??="";t.bought??=""});
  d.sel??=d.cars[0]&&d.cars[0].id;return d;
}
function seed(){ // 처음 쓰는 계정의 빈 시작 상태 (개인 정보 없음)
  return norm({cars:[{id:uid(),nick:"내 차",model:"Tesla Model 3",trim:"",year:new Date().getFullYear(),color:"흰색",colorHex:"#f1f1f1",wheel:"",delivered:"",tireSpec:"",tireAlt:""}]});
}
let db=null,dirty=false; // db는 로그인 뒤에야 채워짐
const legacyRaw=()=>{try{for(const k of [KEY,...OLDKEYS]){const r=localStorage.getItem(k);if(r)return r}}catch(e){}return null};

/* ---------- 구글 로그인 (신한FC m과 같은 방식: Google Identity Services 토큰) ---------- */
/* 공통 로그인: 모든 앱이 localStorage "blue10kp.gauth" {v,token,exp,scopes,email} 를 같이 씀 (규칙: app\_공통\공통로그인.md)
   이 토큰은 구글 API 호출에만 쓰고, 다른 서버·파일에는 보내거나 저장하지 않음 */
const EMBED=(()=>{try{return new URLSearchParams(location.search).get('embed')==='1'}catch(e){return false}})(); // 말만해요 안에 모듈로 뜬 모드
const GAUTH="blue10kp.gauth",GTK="chacha.gtoken",GAC="chacha.gaccount"; // GTK = 예전 전용 저장값(한 번 옮기고 지움)
let gTok=null,lsBad=false;
const normScope=s=>({email:"https://www.googleapis.com/auth/userinfo.email",profile:"https://www.googleapis.com/auth/userinfo.profile"})[s]||s;
const SCOPE_UP={"https://www.googleapis.com/auth/drive.file":["https://www.googleapis.com/auth/drive"],"https://www.googleapis.com/auth/drive.readonly":["https://www.googleapis.com/auth/drive"],"https://www.googleapis.com/auth/calendar.events":["https://www.googleapis.com/auth/calendar"],"https://www.googleapis.com/auth/calendar.readonly":["https://www.googleapis.com/auth/calendar"],"https://www.googleapis.com/auth/calendar.events.readonly":["https://www.googleapis.com/auth/calendar.events","https://www.googleapis.com/auth/calendar"]};
function scopesCover(have,need){have=(have||[]).map(normScope);return need.map(normScope).every(n=>have.includes(n)||(SCOPE_UP[n]||[]).some(u=>have.includes(u)))}
function readAuth(){ // 공통 출입증 읽기 (없거나 깨졌으면 null) + 예전 전용 토큰은 한 번 옮김
  try{
    let a=null;try{a=JSON.parse(localStorage.getItem(GAUTH)||"null")}catch(e){}
    if(!a||typeof a!=="object"||typeof a.token!=="string"||!a.token||!(a.exp>0))a=null;
    if(!a){
      const o=JSON.parse(localStorage.getItem(GTK)||"null");
      if(o&&o.token&&o.exp>Date.now()){a={v:1,token:o.token,exp:o.exp,scopes:GSCOPE.split(" "),email:localStorage.getItem(GAC)||""};localStorage.setItem(GAUTH,JSON.stringify(a))}
      if(o)localStorage.removeItem(GTK);
    }
    return a;
  }catch(e){return null}
}
function writeAuth(a){try{localStorage.setItem(GAUTH,JSON.stringify(a));lsBad=false}catch(e){lsBad=true}}
function storedTok(){const a=readAuth();return a&&a.exp>Date.now()+60000?a.token:(lsBad?gTok:null)}
function authOK(){const a=readAuth(); // 열 때: 만료 2분 이상 + 필요한 권한 + 허용 계정
  return!!(a&&a.exp>Date.now()+120000&&scopesCover(a.scopes,GSCOPE.split(" "))&&ALLOWED.map(x=>x.toLowerCase()).includes(String(a.email||"").toLowerCase()))}
function setAuthEmail(em){const a=readAuth();if(a){a.email=em;writeAuth(a)}}
function clearTok(onlyIf){ // 공통 출입증 삭제 (onlyIf가 있으면 그 토큰일 때만)
  try{const a=readAuth();if(!onlyIf||(a&&a.token===onlyIf))localStorage.removeItem(GAUTH)}catch(e){}
  if(!onlyIf||gTok===onlyIf)gTok=null;
}
const gAcct=()=>{try{return localStorage.getItem(GAC)||""}catch(e){return""}};
function requestTok(prompt,noHint){
  return new Promise((res,rej)=>{
    const g=window.google&&google.accounts&&google.accounts.oauth2;
    if(!g)return rej(new Error("구글 로그인 모듈을 불러오지 못했습니다. 잠시 후 다시 시도하세요."));
    const sa=readAuth(),hintEm=gAcct()||(sa&&ALLOWED.map(x=>x.toLowerCase()).includes(String(sa.email||"").toLowerCase())?sa.email:"");
    const c=g.initTokenClient({client_id:GCLIENT,scope:GSCOPE,include_granted_scopes:true,hint:noHint?undefined:(hintEm||undefined),
      callback:r=>{
        if(r.error)return rej(new Error("구글 연결 실패: "+r.error));
        const sc=r.scope?String(r.scope).split(/\s+/).filter(Boolean):(g.hasGrantedAllScopes(r,"https://www.googleapis.com/auth/drive")?GSCOPE.split(" "):[]);
        if(!scopesCover(sc,GSCOPE.split(" ")))return rej(new Error("Google Drive 권한을 허용해야 합니다. 다시 로그인하면서 모든 항목에 체크해 주세요."));
        gTok=r.access_token;

const INBOX_PATH=["Claude","app","onething","받은편지함"],INBOX_FILE="chachacha.json";
async function importInbox(){
  if(!db)return;
  let id="root";
  for(const n of INBOX_PATH){const f=await dFind(id,n,true);if(!f)return;id=f.id}
  const f=await dFind(id,INBOX_FILE,false);if(!f)return;
  const box=parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));
  const items=Array.isArray(box.items)?box.items:[];
  const todo=items.filter(x=>x&&x.status==="new"&&x.id!=null);
  if(!todo.length)return;
  const done=[];
  for(const it of todo){
    const sid=String(it.id),fl=it.fields||{};
    if(db.inboxDone.includes(sid)){done.push(sid);continue} // 이미 반영됨(중복 방지) → 편지만 done 처리
    const txt=String(it.text||"");
    let c=db.cars.find(x=>x.nick&&txt.includes(x.nick));

      const col=/빨강|빨간|레드/.test(txt)?"빨":/하양|흰|화이트/.test(txt)?"흰":"";
      if(col)c=db.cars.find(x=>x.color&&x.color.startsWith(col)||(x.nick||"").startsWith(col==="빨"?"빨":"하"));
    }
    if(!c){

    }
    const d=/^\d{4}-\d{2}-\d{2}/.test(fl.date||"")?fl.date.slice(0,10):iso(new Date(it.at||Date.now()));
    const km=+fl.km||0,cost=+fl.cost||0;
    if(it.kind==="odo"){if(!km)continue;c.odo.push({id:uid(),date:d,km})}
    else if(it.kind==="fuel"||it.kind==="maint"){
      const item=it.kind==="fuel"?(fl.note||"주유·충전"):(fl.item||"정비·관리");
      c.maint.push({id:uid(),date:d,item,amount:cost,shop:"",km:km||"",memo:"말만해요"});
      if(it.kind==="fuel"&&km)c.odo.push({id:uid(),date:d,km});
    }else continue;
    db.inboxDone.push(sid);done.push(sid);
  }
  if(!done.length)return;
  dirty=true;await driveSave(true);render(); // 기록을 먼저 저장한 뒤에 편지를 done으로
  const cur=parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true)); // 다시 읽고 해당 id만 바꿔 저장
  const at=new Date().toISOString();let ch=false;

}

function kmAt(c,ds){ // 그 날짜의 누적 km 추정(기록 사이는 날짜 비율로 나눔, 기록 범위 밖은 null)
  const p=pts(c);if(!p.length)return null;const t=day(ds);
  if(t<day(p[0][0])||t>day(p[p.length-1][0]))return null;
  for(let i=0;i<p.length;i++){const a=day(p[i][0]);if(t===a)return p[i][1];if(t<a){const b0=p[i-1],a0=day(b0[0]);return b0[1]+(p[i][1]-b0[1])*(t-a0)/(a-a0)}}

function monthTable(){ // 달마다 차별 주행 km, 합계, 지난달 대비
  const cars=db.cars.filter(c=>c.odo.length);if(!cars.length)return[];
  const firsts=cars.map(c=>pts(c)[0][0]).sort(),lasts=cars.map(c=>{const p=pts(c);return p[p.length-1][0]}).sort();
  const end=ymOf(lasts[lasts.length-1]),rows=[];
  for(let ym=ymOf(firsts[0]);ym<=end;ym=nextMonth(ym)){
    const s0=ym+"-01",nx=nextMonth(ym)+"-01";
    const vals=db.cars.map(c=>{
      if(!c.odo.length)return null;
      const p=pts(c),last=p[p.length-1],a=kmAt(c,s0);if(a==null)return null;
      let b=kmAt(c,nx),partial=false;
      if(b==null){if(last[0]>=s0){b=last[1];partial=true}else return null}
      return{km:Math.round(b-a),partial};
    });
    if(vals.some(v=>v))rows.push({ym,vals});
  }

    const partial=r.vals.some(v=>v&&v.partial);

    return{...r,tot,diff,partial}});
}

function showCrop(im,c){

  const cv=$("#cv"),ctx=cv.getContext("2d"),zm=$("#zm");
  const clamp=()=>{const dw=iw*base*z,dh=ih*base*z,mx=Math.max((dw-W)/2,0),my=Math.max((dh-H)/2,0);ox=Math.min(Math.max(ox,-mx),mx);oy=Math.min(Math.max(oy,-my),my)};

  const pts=new Map();let last=0;
  const dist=()=>{const a=[...pts.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)};
  cv.addEventListener("pointerdown",e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2)last=dist();cv.style.cursor="grabbing"});
  cv.addEventListener("pointermove",e=>{
    const p=pts.get(e.pointerId);if(!p)return;
    if(pts.size===1){ox+=e.clientX-p.x;oy+=e.clientY-p.y}
    p.x=e.clientX;p.y=e.clientY;
    if(pts.size===2){const d=dist();if(last>0){z=Math.min(4,Math.max(1,z*d/last));zm.value=Math.round(z*100)}last=d}
    draw();
  });
  const up=e=>{pts.delete(e.pointerId);last=pts.size===2?dist():0;cv.style.cursor="grab"};
  cv.addEventListener("pointerup",up);cv.addEventListener("pointercancel",up);
  cv.addEventListener("wheel",e=>{e.preventDefault();z=Math.min(4,Math.max(1,z*(e.deltaY<0?1.08:1/1.08)));zm.value=Math.round(z*100);draw()},{passive:false});
  zm.addEventListener("input",()=>{z=zm.value/100;draw()});
  $("#cropOk").onclick=()=>{
    const OW=1000,OH=400,k=OW/W,o=document.createElement("canvas");o.width=OW;o.height=OH;
    const x=o.getContext("2d"),dw=iw*base*z*k,dh=ih*base*z*k;

  };
  draw();
}
