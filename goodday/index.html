(function(){var d=1;try{var v=localStorage.getItem("goodday.dark");if(v===null)v=localStorage.getItem("goodday.theme")==="light"?"0":null;d=v==="0"?0:1}catch(e){}

<title>항상일상</title>
<style>
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--raised:#ECEEF2;--line:rgba(20,30,50,.10);
  --t1:#151A22;--t2:#4B5361;--t3:#6B7382;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--accent-weak:rgba(31,78,140,.08);
  --bad:#C0392B;
  --c-see:#2F6FD0;--c-hear:#13897A;--c-eat:#B5701A;--c-go:#4F8A22;--c-work:#B04A66;--c-none:#7C8594;
  --pframe:#FFFFFF;--pink:#14181F;--pmut:#7C8594;--pshadow:0 1px 2px rgba(20,30,50,.08),0 4px 12px rgba(20,30,50,.06);
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","D2Coding",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);--navh:64px;
  color-scheme:light dark
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#7B8494;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --bad:#EF7A6C;
  --c-see:#7FAEF0;--c-hear:#5CC7B5;--c-eat:#E3AB5E;--c-go:#9CCB74;--c-work:#DE95A9;--c-none:#7B8494;
  --pframe:#E9E6DF;--pink:#1A1D22;--pmut:#6E6A62;--pshadow:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--t1)}
body{min-height:100vh;min-height:100dvh}
html.lock{overflow:hidden}
button,input,textarea,select{font-family:var(--font);color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ib{width:36px;height:36px;border:0;border-radius:10px;background:none;color:var(--t2);display:inline-grid;place-items:center;flex:none;transition:background-color .12s var(--ease)}
.ib:active{background:var(--raised)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:32px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:none;color:var(--t1);font-size:13px;white-space:nowrap;text-decoration:none;transition:background-color .12s var(--ease)}
.btn:active{background:var(--raised)}
.btn.p{background:var(--accent);border-color:transparent;color:var(--accent-ink);font-weight:500}
.btn.dng{color:var(--bad)}
.btn:disabled{opacity:.45}
.btn svg.i{width:16px;height:16px}
/* 테마 색 */
.see{--c:var(--c-see)}.hear{--c:var(--c-hear)}.eat{--c:var(--c-eat)}.go{--c:var(--c-go)}.work{--c:var(--c-work)}.none{--c:var(--c-none)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c,var(--c-none));flex:none}
/* 머리 */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(8px + env(safe-area-inset-top)) 12px 4px 16px}
.hrow{display:flex;align-items:center;gap:4px;min-height:40px}
.hrow h1{margin:0;font-size:20px;font-weight:500;flex:1;min-width:0;display:flex;align-items:center;gap:4px;white-space:nowrap}
.hrow h1 .cnt{font-size:12px;color:var(--t3);font-weight:400;margin-left:6px}
.hrow .nv{width:28px;height:28px}
#sync{font-size:11px;color:var(--t3);margin-right:2px;white-space:nowrap}
#sync.fail{color:var(--bad)}
.srow{display:flex;align-items:center;gap:8px;height:36px;padding:0 4px 0 12px;border-radius:10px;background:var(--raised);color:var(--t3);margin:4px 0 8px}
.srow input{flex:1;min-width:0;height:34px;border:0;background:none;font-size:15px;color:var(--t1);outline:0}
.srow input::placeholder{color:var(--t3)}
.seg{display:flex;gap:2px;background:var(--surface);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;font-size:12px;padding:2px 8px;border-radius:6px;color:var(--t3);height:26px}
.seg button.on{background:var(--raised);color:var(--t1)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;border:1px solid var(--line);background:none;font-size:13px;color:var(--t2);white-space:nowrap;flex:none}
.chip.on{background:var(--t1);color:var(--bg);border-color:transparent}
.chip.pick.on{background:var(--surface);color:var(--t1);border-color:var(--c,var(--t1))}
/* 목록 (폴라로이드) */
.wrap{padding:0 16px;max-width:720px;margin:0 auto}
.day{display:flex;justify-content:space-between;font-size:12px;color:var(--t3);margin:16px 2px 8px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.pola{display:block;width:100%;text-align:left;border:0;background:var(--pframe);border-radius:4px;padding:8px 8px 0;box-shadow:var(--pshadow);color:var(--pink);transition:transform .12s var(--ease)}
.pola:active{transform:scale(.98)}
.ph{position:relative;aspect-ratio:1/1;border-radius:2px;overflow:hidden;background:#2A2F38}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ph .stamp{position:absolute;right:6px;bottom:4px;font-size:10px;color:#F2C879;letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.ph .rec{position:absolute;left:6px;top:6px;font-size:10px;line-height:16px;padding:0 6px;border-radius:4px;background:rgba(10,13,17,.62);color:#E6E9EE}
.ph .busy{position:absolute;left:6px;bottom:6px;font-size:10px;line-height:16px;padding:0 6px;border-radius:4px;background:rgba(10,13,17,.62);color:#E6E9EE}
.ph .txt{position:absolute;inset:0;padding:12px;display:flex;align-items:center;font-size:14px;line-height:1.5;color:#3A3730;background:#F6F2E8;overflow:hidden;word-break:break-word}
:root[data-theme="dark"] .ph .txt{background:#D9D4C8}
.cp{padding:8px 2px 10px;min-height:52px}
.cp .ct{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cp .cm{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--pmut);margin-top:2px;white-space:nowrap;overflow:hidden}
.cp .cm .dot{width:6px;height:6px}
.empty{color:var(--t3);text-align:center;padding:48px 16px;font-size:14px;line-height:1.7}
/* 아래 메뉴 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:12;height:calc(var(--navh) + env(safe-area-inset-bottom));padding:0 24px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around}
nav .it{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--t2);border:0;background:none;width:64px;padding:6px 0}
nav .cam{width:52px;height:52px;border-radius:16px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
nav .cam svg.i{width:24px;height:24px}
html.embed header{padding-top:56px}
html.embed nav{left:50%;right:auto;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));height:56px;padding:0 8px;border:1px solid var(--line);border-radius:18px;gap:4px}
html.embed nav .it{width:52px}
html.embed nav .cam{width:44px;height:44px;border-radius:14px}
html.embed body{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
/* 겹 화면 (새 기록 · 상세 · 설정) */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;overscroll-behavior:contain;animation:rise .18s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.lh{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:4px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:var(--bg)}
.lh h2{margin:0;flex:1;font-size:17px;font-weight:500;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lh h2.sm{font-size:14px;font-weight:400;color:var(--t3)}
html.embed .lh{padding-top:56px}
.lb{max-width:640px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
html.embed .lb{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
/* 새 기록 */
.shot{position:relative;border-radius:12px;overflow:hidden;background:var(--raised);aspect-ratio:4/3;display:grid;place-items:center;color:var(--t3);font-size:13px}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot .stamp{position:absolute;right:10px;bottom:8px;font-size:11px;color:#F2C879;letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.shot .x{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:10px;border:0;background:rgba(10,13,17,.55);color:#fff;display:grid;place-items:center}
.shotbtns{display:flex;gap:8px;margin-top:8px}
.auto{display:grid;grid-template-columns:18px 1fr auto;gap:4px 10px;align-items:center;margin-top:12px;font-size:14px}
.auto svg.i{width:16px;height:16px;color:var(--t3)}
.auto input{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 8px;font-size:14px;color:var(--t1);min-width:0}
.auto .two{display:flex;gap:6px;min-width:0}.auto .two input{flex:1}
.auto .s{font-size:11px;color:var(--t3);white-space:nowrap}
.auto .lv{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
textarea.note{display:block;width:100%;margin-top:12px;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;font-size:16px;line-height:1.5;color:var(--t1);resize:vertical}
textarea.note:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hint{font-size:12px;color:var(--t3);margin-top:8px}
/* 상세 */
.dph{position:relative;margin:0 -16px;background:#000}
.dph img{display:block;width:100%;max-height:62vh;object-fit:contain;margin:0 auto}
.dph .ph{aspect-ratio:auto;height:240px;border-radius:0}
.dph .stamp{position:absolute;right:12px;bottom:10px;font-size:11px;color:#F2C879;letter-spacing:.04em;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.dph .rec{position:absolute;left:12px;top:12px;font-size:11px;line-height:18px;padding:0 8px;border-radius:4px;background:rgba(10,13,17,.62);color:#E6E9EE}
.dt{font-size:22px;font-weight:500;line-height:1.3;margin:16px 0 0;word-break:break-word}
.dw{font-size:15px;color:var(--t2);margin-top:8px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--t3)}
.meta span{display:inline-flex;align-items:center;gap:6px}
.meta svg.i{width:14px;height:14px}
.sec{margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.lab{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3);margin-bottom:10px}
.lab svg.i{width:14px;height:14px}
.inf{display:flex;gap:14px;align-items:flex-start}
.inf .po{width:76px;flex:none;border-radius:6px;overflow:hidden;background:var(--raised)}
.inf .po img{display:block;width:100%}
.l1{font-size:14px;color:var(--t1);font-weight:500;word-break:break-word}
.l2{font-size:13px;color:var(--t2);margin-top:4px;word-break:break-word}
.sum{font-size:13px;color:var(--t2);margin-top:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.cand{display:flex;flex-direction:column}
.cand button{display:flex;align-items:center;gap:10px;min-height:44px;padding:6px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:14px}
.cand button:first-child{border-top:0}
.cand .ck{width:16px;color:var(--accent)}
.cand .w{font-size:12px;color:var(--t3);margin-left:auto;text-align:right;max-width:45%}
.ppl{display:flex;flex-wrap:wrap;gap:8px}
.pp{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px 0 4px;border-radius:15px;background:var(--raised);font-size:13px}
.pp b{width:22px;height:22px;border-radius:50%;background:var(--accent-weak);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:500}
.why{font-size:12px;color:var(--t3);margin-top:8px}
.foot{display:flex;gap:8px;margin-top:28px;padding-top:16px;border-top:1px solid var(--line)}
.foot .sp{flex:1}
.full{position:fixed;inset:0;z-index:40;background:#000;display:grid;place-items:center}
.full img{max-width:100%;max-height:100%;object-fit:contain}
/* 설정 */
.rowbtn{display:flex;width:100%;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px}
.rowbtn:first-child{border-top:0}
.rowbtn .r{color:var(--t3);font-size:13px;text-align:right}
.rowbtn .r.ok{color:var(--t1)}
.grp{background:var(--surface);border-radius:12px;padding:0 16px;margin-top:12px}
.gl{font-size:12px;color:var(--t3);margin:20px 4px 0}
.sw{width:40px;height:24px;border-radius:12px;background:var(--raised);border:1px solid var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--t3);transition:transform .15s var(--ease)}
.sw.on{background:var(--accent);border-color:transparent}.sw.on::after{background:var(--accent-ink);transform:translateX(16px)}
.help p{font-size:14px;color:var(--t2);line-height:1.7;margin:12px 0}
.help b{color:var(--t1);font-weight:500}
input.fld{width:100%;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 12px;font-size:15px;color:var(--t1);margin-top:8px}
.trow{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.trow:first-child{border-top:0}
.trow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:50;max-width:420px;margin:0 auto;background:var(--t1);color:var(--bg);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;align-items:center;gap:12px;animation:rise .18s var(--ease)}
.toast button{margin-left:auto;border:0;background:none;color:var(--bg);font-weight:600;font-size:14px;text-decoration:underline}
html.embed .toast{bottom:calc(88px + env(safe-area-inset-bottom))}
.demo{font-size:11px;color:var(--c-eat);margin-left:6px;font-weight:400}
/* 손글씨 캡션 */
.pen{font-family:"Nanum Pen Script","Pretendard Variable",cursive;color:#2E2C28;font-size:21px;line-height:1.1;padding:8px 4px 10px;min-height:52px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:keep-all;overflow-wrap:anywhere}
.pola{display:block;background:var(--pframe);border-radius:3px;padding:8px 8px 0;box-shadow:var(--pshadow)}
.pola .ph{border-radius:1px}
/* 촬영 페이지: 카메라처럼 늘 어두운 화면 */
.shoot{position:fixed;inset:0;background:#0A0B0D;color:#E9ECF1;display:flex;flex-direction:column;align-items:center;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.stop{display:flex;align-items:center;gap:4px;width:100%;max-width:560px;padding:8px 12px}
.stop .sp{flex:1}
.sbtn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 10px;border:0;border-radius:10px;background:none;color:#C9CED6;font-size:13px}
.sbtn:active{background:rgba(255,255,255,.08)}
.shoot #sync{color:#8A919C}
.vf{position:relative;width:min(100vw,calc(100dvh - 240px),560px);aspect-ratio:1/1;margin:auto 0;background:#15171B;overflow:hidden}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf video.mir{transform:scaleX(-1)}
.vgrid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,transparent calc(33.33% - .5px),rgba(255,255,255,.14) calc(33.33% - .5px),rgba(255,255,255,.14) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.14) calc(66.66% - .5px),rgba(255,255,255,.14) calc(66.66% + .5px),transparent calc(66.66% + .5px)),linear-gradient(180deg,transparent calc(33.33% - .5px),rgba(255,255,255,.14) calc(33.33% - .5px),rgba(255,255,255,.14) calc(33.33% + .5px),transparent calc(33.33% + .5px),transparent calc(66.66% - .5px),rgba(255,255,255,.14) calc(66.66% - .5px),rgba(255,255,255,.14) calc(66.66% + .5px),transparent calc(66.66% + .5px))}
.vmsg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;font-size:13px;color:#8A919C;line-height:1.6;white-space:pre-line}
.vmsg:empty{display:none}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s ease}
.flash.on{opacity:.85;transition:none}
.sbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;width:100%;max-width:560px;padding:20px 28px 28px}

<script>
"use strict";
/* ===== 설정 (여기만 고치면 됩니다) ===== */

if(EMBED)document.documentElement.classList.add("embed");
const DEMO=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/[?&]demo=1/.test(location.search); // 내 컴퓨터에서 화면 확인용(구글 로그인·Drive 저장 없음)
/* localStorage는 막힐 수 있어 항상 감쌈 (화면 모드·파일 번호 같은 기기 편의 값만 둠. 기록은 두지 않음) */

/* ---------- 테마 5개 ---------- */
const THEMES=[["see","보고"],["hear","듣고"],["eat","먹고"],["go","가고"],["work","일"]];
const TH=Object.fromEntries(THEMES);

/* ---------- 자료 모양 ----------
   기록: {id,theme,date,time,title,note,loc:{lat,lng,addr},photo:{full,thumb},rec:{url,src},art,sub,info,link,map,cands:[{name,what,near}],pick,people:[],q,why,ts,upd,del}
   예전 기록(kind·x)은 불러올 때 새 모양으로 옮김(예전 칸은 그대로 둠) */
let db=null,dirty=false,me="";
function oldTheme(r){
  const x=r.x||{},t=x.type||"";
  if(r.kind==="video")return t==="음악"?"hear":"see";
  if(r.kind==="book")return"see";
  if(r.kind==="place")return t==="멋곳"?"go":"eat";
  if(r.kind==="trip")return"go";
  return"";
}
const TMDB_IMG="https://image.tmdb.org/t/p/";
function norm(d){
  d=d&&typeof d==="object"?d:{};
  d.records=Array.isArray(d.records)?d.records:[];
  const s=d.settings=d.settings&&typeof d.settings==="object"?d.settings:{};
  s.dark=typeof s.dark==="boolean"?s.dark:s.theme!=="light"; // 기본 다크
  if(d.v!==2){ // 예전(1단계) 기록 옮기기
    d.records.forEach(r=>{
      if(r.theme!==undefined)return;
      const x=r.x&&typeof r.x==="object"?r.x:{};
      r.theme=oldTheme(r);
      if(x.info&&!r.info)r.info=String(x.info);
      if(x.link&&!r.link)r.link=String(x.link);
      if(x.map&&!r.map)r.map=String(x.map);
      if(x.type&&!r.sub)r.sub=String(x.type);
      const p=String(x.poster||"");
      const u=/^\/[\w.-]+$/.test(p)?TMDB_IMG+"w342"+p:/\d+x\d+bb\.jpg$/.test(p)?p.replace(/\d+x\d+bb\.jpg$/,"400x400bb.jpg"):p;
      if(u&&imgOk(u)){r.art=u;r.rec={url:u,src:"예전 기록"}}
      if(x.addr&&!r.loc)r.loc={addr:String(x.addr)};
      if(!r.theme&&r.kind)r.sub=r.sub||({daily:"일상",trip:"여행"}[r.kind]||"");
    });
    d.v=2;
  }
  d.records.forEach(r=>{
    r.theme=TH[r.theme]?r.theme:"";r.title=String(r.title||"");r.note=String(r.note||"");r.date=/^\d{4}-\d\d-\d\d$/.test(r.date||"")?r.date:"";
    r.time=/^\d\d:\d\d$/.test(r.time||"")?r.time:"";
    if(r.loc&&typeof r.loc!=="object")r.loc=null;
    r.people=Array.isArray(r.people)?r.people:[];r.cands=Array.isArray(r.cands)?r.cands:[];
    delete r.busy;
  });
  const lim=Date.now()-30*864e5,gone=d.records.filter(r=>r.del&&r.del<lim); // 휴지통은 30일 뒤 자동 정리
  d.records=d.records.filter(r=>!(r.del&&r.del<lim));
  if(gone.length)setTimeout(()=>gone.forEach(dropPhoto),3000);
  return d;
}
const live=()=>db.records.filter(r=>!r.del);
const sortRecs=a=>a.sort((x,y)=>((y.date||"")+(y.time||"")).localeCompare((x.date||"")+(x.time||""))||(y.ts||0)-(x.ts||0));
function seedDemo(){
  const t=new Date(),d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return iso(x)},now=Date.now();
  const R=(theme,date,time,title,note,o)=>({id:uid(),theme,date,time,title,note,ts:now,upd:now,people:[],cands:[],...o});
  return norm({v:2,records:[
    R("see",d(0),"21:30","오펜하이머","3시간이 순삭. 마지막 장면 소름",{sub:"영화",loc:{addr:"서울 마포구 연남동"},info:"오펜하이머(Oppenheimer) · 2023 · 영화 · 미국\n감독: 크리스토퍼 놀란 / 출연: 킬리언 머피 외\n원자폭탄 개발을 이끈 과학자의 삶을 그린 전기 영화.",link:"https://search.naver.com/search.naver?query=%EC%98%A4%ED%8E%9C%ED%95%98%EC%9D%B4%EB%A8%B8"}),
    R("eat",d(0),"19:05","연남동 손칼국수","바지락 국물이 진하고 김치가 좋음",{loc:{addr:"서울 마포구 연남동"},info:"연남동 손칼국수 · 마포구 연남동 · 칼국수\n바지락칼국수 / 9,000원대\n오래된 동네 칼국수집.",cands:[{name:"연남동 손칼국수",what:"칼국수",near:"약 20m"},{name:"연남 바지락집",what:"칼국수·수제비",near:"약 50m"},{name:"골목 선술집",what:"주점",near:"약 90m"}],pick:0,map:"https://map.naver.com/p/search/%EC%97%B0%EB%82%A8%EB%8F%99"}),
    R("work",d(0),"14:00","팀 미팅","신규 DB 배분 정리, 다음 주 교육. 최수진, 박상선 참석",{loc:{addr:"서울 영등포구"},people:["최수진","박상선"]}),
    R("hear",d(1),"08:40","비 오는 날 들은 노래","재즈 피아노, 퇴근길",{}),
    R("go",d(2),"11:20","남한산성","단풍 마지막 주말",{loc:{addr:"경기 광주시 남한산성면"}})
  ]});
}

/* ---------- 말만해요와 연결 (주소 # 뒤: #go=search&q=&kind= / #go=record&id= , embed 모드, 위치 알리기) ---------- */
let pendingGo=null;
function hashGo(){try{const u=new URLSearchParams(location.hash.replace(/^#/,""));return u.get("go")?{go:u.get("go"),q:u.get("q")||"",kind:u.get("kind")||"",id:u.get("id")||""}:null}catch(e){return null}}
pendingGo=hashGo();
function cleanHash(){try{if(location.hash)history.replaceState(history.state,"",location.pathname+location.search)}catch(e){}}
function themeFrom(v){ // 보고·듣고·먹고·가고·일 또는 예전 이름(영상·음악·책·맛집·여행) → 테마
  v=String(v||"").trim();if(!v)return"";
  if(TH[v])return v;
  const f=THEMES.find(t=>t[1]===v);if(f)return f[0];
  if(/영화|영상|드라마|책|공연|연극|보/.test(v))return"see";
  if(/음악|노래|듣/.test(v))return"hear";
  if(/맛집|식당|먹/.test(v))return"eat";
  if(/여행|장소|멋곳|가/.test(v))return"go";
  if(/일|업무|미팅/.test(v))return"work";
  return"";
}
window.blue10kpGo=function(o){
  o=o||{};
  if(!db){pendingGo={go:o.go,q:o.q||"",kind:o.kind||"",id:o.id||""};return}
  closeAll();
  if(o.go==="search"){F.q=String(o.q||"");F.th=themeFrom(o.kind);F.mode="all";render();openView(true)}
  else if(o.go==="record"){const r=db.records.find(x=>x.id===String(o.id||""));render();if(r)openDetail(r.id,true);else{toast("기록을 찾지 못했어요");if(EMBED)openView(true)}}
  else if(o.go==="settings"){render();openSettings(true)}
  else if(o.go==="shoot"||o.go==="camera"){render()}
  else{F.q="";F.th="";render();openView(true)}
  cleanHash();
};
function runPendingGo(){if(pendingGo&&db){const o=pendingGo;pendingGo=null;window.blue10kpGo(o)}}
let lastLift=-1;
function fabLift(){ // 아래쪽 버튼 줄의 위 끝을 말만해요에 알림 → 말만해요 버튼이 그만큼 올라감
  if(!EMBED||window.parent===window)return;
  let lift=0;const H=innerHeight;
  document.querySelectorAll(".layer .foot .btn").forEach(b=>{const r=b.getBoundingClientRect();if(r.height>0&&r.bottom>0&&r.top<H)lift=Math.max(lift,Math.round(H-r.top))});
  if(lift===lastLift)return;lastLift=lift;
  try{window.parent.postMessage({type:"blue10kp-fab",lift},location.origin)}catch(e){}
}
document.addEventListener("scroll",()=>fabLift(),true);
window.addEventListener("resize",()=>fabLift());
function reportWhere(){
  if(!EMBED||window.parent===window||!db)return;
  const top=LAYERS[LAYERS.length-1];let w={go:"shoot"};
  if(top&&top.kind==="detail")w={go:"record",id:top.id};

/* ---------- 구글 로그인 (차차차와 같은 방식: 공통 출입증 blue10kp.gauth) ---------- */
const GTK="goodday.gtoken",GAC="goodday.gaccount",FID_KEY="goodday.fid";
const GA="blue10kp.gauth";
const DRIVEFILE="https://www.googleapis.com/auth/drive.file";
const SUPER={"https://www.googleapis.com/auth/drive.file":["https://www.googleapis.com/auth/drive"]};
let gTok=null,pend=null,gaSeen=false;
const allowedEm=e=>ALLOWED.map(x=>x.toLowerCase()).includes(String(e||"").toLowerCase());
const hasScope=(sc,need)=>sc.includes(need)||(SUPER[need]||[]).some(x=>sc.includes(x));
function readGa(){try{const g=JSON.parse(lsGet(GA)||"null");return g&&g.v===1&&typeof g.token==="string"&&+g.exp&&Array.isArray(g.scopes)?g:null}catch(e){return null}}
function writeGa(token,exp,scopes,email){lsSet(GA,JSON.stringify({v:1,token,exp,scopes,email:email||""}));gaSeen=!!readGa()}
const gaFresh=g=>!!g&&g.exp>Date.now()+120000;
const gaScopeOk=g=>!!g&&hasScope(g.scopes,DRIVEFILE);
function storedTok(){const g=readGa();return gaFresh(g)&&gaScopeOk(g)?g.token:null}
function clearTok(t){const g=readGa();if(g&&(!t||g.token===t))lsDel(GA);gTok=null}
function migrateOld(){try{const o=JSON.parse(lsGet(GTK)||"null");if(o&&o.token&&o.exp>Date.now()+120000&&!readGa()&&gAcct())writeGa(o.token,o.exp,["openid","email",DRIVEFILE],gAcct())}catch(e){}lsDel(GTK)}
const gAcct=()=>{const g=readGa();return(g&&g.email)||lsGet(GAC)||""};
function requestTok(prompt,noHint,extra){
  return new Promise((res,rej)=>{
    const g=window.google&&google.accounts&&google.accounts.oauth2;
    if(!g)return rej(new Error("구글 로그인 모듈을 불러오지 못했습니다. 잠시 후 다시 시도하세요."));
    const c=g.initTokenClient({client_id:GCLIENT,scope:GSCOPE+(extra?" "+extra:""),include_granted_scopes:true,hint:noHint?undefined:(gAcct()||undefined),
      callback:r=>{
        if(r.error)return rej(new Error("구글 연결 실패: "+r.error));
        const sc=String(r.scope||"").split(/\s+/).filter(Boolean);
        if(!hasScope(sc,DRIVEFILE))return rej(new Error("Google Drive 권한을 허용해야 합니다. 다시 로그인하면서 모든 항목에 체크해 주세요."));
        pend={exp:Date.now()+(r.expires_in||3600)*1000,scopes:sc};
        gTok=r.access_token;res(r.access_token);
      },
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"구글 로그인 창이 닫혔습니다.":"구글 로그인 창을 열 수 없습니다. 팝업 차단을 확인하세요."))});
    c.requestAccessToken({prompt:prompt==null?"":prompt});
  });
}
async function gfetch(url,opt,as,retry){ // as: undefined=json, true=text, "blob"
  const t=gTok||storedTok();if(!t)throw new Error("GOOGLE_AUTH");
  const o=opt||{},r=await fetch(url,{...o,headers:{Authorization:"Bearer "+t,...(o.headers||{})},cache:"no-store"});
  if(r.status===401){
    const n=storedTok();
    if(n&&n!==t&&!retry){gTok=n;return gfetch(url,opt,as,true)}
    clearTok(t);throw new Error("GOOGLE_AUTH");
  }
  if(!r.ok)throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,160));
  if(r.status===204)return null;
  return as==="blob"?r.blob():as?r.text():r.json();
}
function gaSync(){
  if(DEMO||!db)return;
  const g=readGa();
  if(g){
    gaSeen=true;
    if(g.token!==gTok&&gaFresh(g)&&gaScopeOk(g)&&allowedEm(g.email)){
      if(me&&g.email.toLowerCase()!==me.toLowerCase()){
        if(dirty)return;
        lsSet(GAC,g.email.toLowerCase());lsDel(FID_KEY);resetData();me=g.email.toLowerCase();gTok=g.token;
        startApp().catch(e=>showLogin(e.message==="GOOGLE_AUTH"?"":"기록을 불러오지 못했어요. ("+String(e.message).slice(0,60)+")"));
        return;
      }
      gTok=g.token;
    }
    return;
  }
  if(gaSeen&&!dirty){gaSeen=false;gTok=null;resetData();showLogin("다른 앱에서 로그아웃했어요. 다시 로그인해 주세요.",false)}
}

/* ---------- 내 Google Drive 저장 (내 드라이브/goodday/goodday_기록.json, 사진은 goodday/사진) ---------- */
const DAPI="https://www.googleapis.com/drive/v3",DUP="https://www.googleapis.com/upload/drive/v3";
let fileId=null,folderId=null,photoDir=null,lastMod=null,saving=false,again=false,retryT=null,saveT=null;
function resetData(){db=null;dirty=false;fileId=null;folderId=null;photoDir=null;lastMod=null;me="";THUMBS.clear();appCfg={acct:"",tmdbKey:"",geminiKey:""};gcfg=null}
const qv=x=>String(x).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
async function dFind(parent,name,folder){
  const q="'"+qv(parent)+"' in parents and name='"+qv(name)+"' and trashed=false"+(folder?" and mimeType='application/vnd.google-apps.folder'":"");
  const d=await gfetch(DAPI+"/files?pageSize=10&fields="+encodeURIComponent("files(id,name,modifiedTime)")+"&q="+encodeURIComponent(q));
  return(d.files||[])[0]||null;
}
async function mkFolder(name,parent){return gfetch(DAPI+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,mimeType:"application/vnd.google-apps.folder",parents:[parent]})})}
async function dFolder(create){
  if(folderId)return folderId;
  let id="root";
  for(const n of DRIVE_PATH){let f=await dFind(id,n,true);if(!f){if(!create)return null;f=await mkFolder(n,id)}id=f.id}
  return folderId=id;
}
async function subDir(name){const fo=await dFolder(true);let d=await dFind(fo,name,true);if(!d)d=await mkFolder(name,fo);return d.id}
const cachedFid=()=>{try{return JSON.parse(lsGet(FID_KEY)||"null")}catch(e){return null}};
const cacheFid=()=>lsSet(FID_KEY,JSON.stringify({file:fileId,folder:folderId,acct:gAcct()}));
const parseDoc=t=>JSON.parse(t.replace(/^\uFEFF/,""));
async function loadDrive(){
  const c=cachedFid();
  if(c&&c.file&&c.acct===gAcct()){
    try{
      const [meta,txt]=await Promise.all([gfetch(DAPI+"/files/"+c.file+"?fields=modifiedTime,trashed"),gfetch(DAPI+"/files/"+c.file+"?alt=media",null,true)]);
      if(!meta.trashed){fileId=c.file;folderId=c.folder||null;lastMod=meta.modifiedTime;return parseDoc(txt)}
    }catch(e){if(e.message==="GOOGLE_AUTH")throw e}
  }
  const fo=await dFolder(false);if(!fo)return null;
  const f=await dFind(fo,DRIVE_FILE,false);if(!f)return null;
  fileId=f.id;lastMod=f.modifiedTime;cacheFid();
  return parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));
}
function setSync(st){
  const el=$("#sync");if(!el)return;
  el.className=st==="fail"?"fail":"";
  el.textContent=st==="saving"?"저장 중":st==="fail"?"저장 안 됨":"";
  el.title=st==="ok"?"저장됨 "+hm(new Date()):"";
}
function save(){if(DEMO){return}dirty=true;setSync("saving");clearTimeout(saveT);saveT=setTimeout(()=>driveSave(),600)}
async function driveSave(force){
  if(DEMO||!db||!dirty&&!force)return;
  if(saving){again=true;return}
  saving=true;clearTimeout(retryT);
  try{
    if(!fileId){const fo0=await dFolder(true),f=await dFind(fo0,DRIVE_FILE,false);if(f){fileId=f.id;lastMod=f.modifiedTime;cacheFid()}}
    const body=JSON.stringify(db);let meta;
    if(fileId){
      if(!force){
        const cur=await gfetch(DAPI+"/files/"+fileId+"?fields=modifiedTime");
        if(lastMod&&cur.modifiedTime!==lastMod&&!confirm("다른 기기에서 기록이 바뀌었어요.\n확인 = 지금 화면의 기록으로 덮어쓰기\n취소 = 드라이브에 있는 기록 불러오기")){

        }
      }
      meta=await gfetch(DUP+"/files/"+fileId+"?uploadType=media&fields=id,modifiedTime",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    }else{

      meta=await gfetch(DUP+"/files?uploadType=multipart&fields=id,modifiedTime",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});
      fileId=meta.id;cacheFid();

    else retryT=setTimeout(()=>driveSave(),15000);
  }finally{saving=false;if(again){again=false;driveSave()}}
}

/* ---------- 말만해요 해석용 색인 (goodday/설정/말만해요_색인.json): 제목·테마·날짜만, 메모·사진·주소는 넣지 않음 ---------- */

    const body=JSON.stringify({...idx,updated:new Date().toISOString()}),dir=await subDir(IDX_DIR);

    else{const bd="gi"+uid(),mp="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:IDX_FILE,parents:[dir],mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";

    lsSet(IDX_KEY,JSON.stringify({acct:gAcct(),id,sig}));
  }catch(e){}
  finally{idxBusy=false;if(idxAgain){idxAgain=false;idxSync()}}

const F={q:"",th:"",mode:"all",at:new Date()}; // 찾기: 글자, 테마, 기간(all·day·month·year)
function periodLabel(){
  const a=F.at;
  if(F.mode==="day")return(a.getMonth()+1)+"월 "+a.getDate()+"일 "+WD[a.getDay()];
  if(F.mode==="month")return a.getFullYear()+"년 "+(a.getMonth()+1)+"월";
  if(F.mode==="year")return a.getFullYear()+"년";
  return"항상일상";

function inPeriod(r){
  if(F.mode==="all")return true;
  const a=F.at,d=r.date||"";
  if(F.mode==="day")return d===iso(a);
  if(F.mode==="month")return d.slice(0,7)===iso(a).slice(0,7);

function hay(r){return[r.title,r.note,r.info,r.sub,thName(r.theme),r.loc&&r.loc.addr,(r.people||[]).join(" "),(r.cands||[]).map(c=>c.name).join(" ")].join(" ").toLowerCase()}

  return sortRecs(live().filter(r=>(!F.th||r.theme===F.th)&&inPeriod(r)&&ws.every(w=>hay(r).includes(w))));
}
function dayHead(d){
  const m=/^(\d{4})-(\d\d)-(\d\d)$/.exec(d||"");if(!m)return"날짜 없음";
  const dt=new Date(+m[1],+m[2]-1,+m[3]),y=new Date().getFullYear();
  return(+m[1]!==y?m[1]+"년 ":"")+(+m[2])+"월 "+(+m[3])+"일 "+WD[dt.getDay()];
}
const stampOf=r=>(r.date||"").slice(2).replace(/-/g," ");
function photoOf(r){ // 목록·상세에 쓸 그림: 내 사진 > 추천 사진
  if(PEND.has(r.id))return{kind:"mine",src:PEND.get(r.id).prev};
  if(r.photo&&r.photo.thumb)return{kind:"drive",id:r.photo.thumb,full:r.photo.full};
  if(r.rec&&imgOk(r.rec.url))return{kind:"rec",src:r.rec.url};
  return{kind:"text"};
}
function phHtml(r){
  const p=photoOf(r);
  const busy=BUSY.has(r.id)?`<span class="busy">${BUSY.get(r.id)}</span>`:"";
  if(p.kind==="text")return`<div class="ph"><div class="txt">${esc((r.note||r.title).slice(0,90))}</div>${busy}</div>`;
  const img=p.kind==="drive"?`<img alt="" data-dimg="${esc(p.id)}">`:`<img alt="" src="${esc(p.src)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`;
  return`<div class="ph">${p.kind==="rec"?`<div class="txt">${esc((r.note||r.title).slice(0,90))}</div>`:""}${img}${p.kind==="rec"?`<span class="rec">추천 사진</span>`:`<span class="stamp mono">${esc(stampOf(r))}</span>`}${busy}</div>`;
}
const capOf=r=>String(r.note||r.title||"").replace(/\s+/g," ").trim();
function polaInner(r){ // 폴라로이드: 위 사진, 아래 흰 칸에 손글씨처럼 적은 글 (사진과 글은 따로 저장, 보일 때만 합침)

let io=null;
function loadImgs(root,now){ // 드라이브 사진은 화면에 보일 때 불러옴 (작은 사진 먼저, 큰 사진은 상세에서)
  const els=root.querySelectorAll("img[data-dimg]");if(!els.length)return;
  const go=el=>{const id=el.dataset.dimg;el.removeAttribute("data-dimg");photoUrl(id).then(u=>{if(u)el.src=u})};
  if(now||!("IntersectionObserver" in window)){els.forEach(go);return}
  if(!io)io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);go(e.target)}}),{rootMargin:"300px"});
  els.forEach(el=>io.observe(el));
}

/* ---------- 보기 페이지: 아이튠즈 앨범 넘기기처럼 가로로 늘어선 폴라로이드, 좌우로 밀어 넘김 ---------- */
const CF={pos:0,list:[],els:new Map(),W:220,drag:null,raf:0,snapT:0};
function openView(root){
  openLayer("view",`<div class="vtop" id="vtop"></div><div id="vbody"></div>`,null,root);
  CF.pos=0;drawView(true);
}
const viewLayer=()=>LAYERS.find(l=>l.kind==="view");
function viewRefresh(head){
  const L=viewLayer();if(!L)return;
  const cur=CF.list[Math.round(CF.pos)];drawView(head,cur&&cur.id);
}
function drawView(head,keepId){
  const L=viewLayer();if(!L)return;
  if(head){
    const q=$("#q"),focus=q&&document.activeElement===q,pos=focus?q.selectionStart:0;
    L.el.querySelector("#vtop").innerHTML=header();
    if(focus){const n=$("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}
  }else{const c=L.el.querySelector(".cnt");if(c)c.textContent=shown().length}
  CF.list=shown();CF.els.forEach(el=>el.remove());CF.els.clear();
  const n=CF.list.length,box=L.el.querySelector("#vbody");
  if(keepId){const i=CF.list.findIndex(r=>r.id===keepId);CF.pos=i>=0?i:Math.min(Math.round(CF.pos),Math.max(0,n-1))}else CF.pos=Math.min(CF.pos,Math.max(0,n-1));
  if(!n){box.innerHTML=`<div class="empty">${live().length?"맞는 기록이 없어요":"아직 기록이 없어요<br>촬영 화면에서 찍거나 글을 남겨 보세요"}</div>`;return}
  box.innerHTML=`<div class="cf" id="cf"></div><div class="cfm" id="cfm"></div>${n>1?`<input type="range" class="scrub" id="cfs" min="0" max="${n-1}" step="1" value="${Math.round(CF.pos)}" aria-label="넘기기">`:""}`;
  const cf=box.querySelector("#cf");
  CF.W=Math.round(Math.min(cf.clientWidth*.68,320));
  cf.style.setProperty("--w",CF.W+"px");
  cfBind(cf);cfSync();
}
function cfCard(r,i){
  const b=document.createElement("div");b.className="cfc";b.dataset.id=r.id;
  b.innerHTML=`<div class="pola ${thCls(r.theme)}">${polaInner(r)}</div><div class="refl"></div>`;
  loadImgs(b,true);return b;
}
function cfSync(){
  const cf=$("#cf");if(!cf)return;
  const n=CF.list.length,c=Math.round(CF.pos),keep=new Set();
  for(let i=Math.max(0,c-5);i<=Math.min(n-1,c+5);i++){
    const r=CF.list[i];keep.add(r.id);
    let el=CF.els.get(r.id);if(!el){el=cfCard(r,i);CF.els.set(r.id,el);cf.appendChild(el)}
    el.dataset.i=i;
  }
  for(const [id,el] of CF.els)if(!keep.has(id)){el.remove();CF.els.delete(id)}
  const W=CF.W,step=W*.62;
  for(const el of CF.els.values()){
    const d=+el.dataset.i-CF.pos,ad=Math.abs(d),s=Math.sign(d);
    const x=ad<=1?d*step:s*(step+(ad-1)*W*.22),rot=-Math.max(-1,Math.min(1,d))*58,z=-Math.min(ad,1)*150-Math.max(0,ad-1)*24;
    el.style.transform=`translateX(${x.toFixed(1)}px) translateZ(${z.toFixed(1)}px) rotateY(${rot.toFixed(1)}deg)`;
    el.style.zIndex=String(1000-Math.round(ad*10));
    el.style.opacity=ad>4.6?"0":"1";
  }
  cfMeta();
}
function cfMeta(){
  const i=Math.max(0,Math.min(CF.list.length-1,Math.round(CF.pos))),r=CF.list[i],m=$("#cfm");
  if(m&&r&&(m.dataset.id!==r.id||m.dataset.busy!==String(BUSY.has(r.id)))){
    m.dataset.id=r.id;m.dataset.busy=String(BUSY.has(r.id));
    m.innerHTML=`<div class="ct">${esc(r.title||"기록")}</div><div class="cm ${thCls(r.theme)}"><i class="dot"></i>${esc(r.theme?thName(r.theme):(r.sub||"기타"))}<span>· ${esc(dayHead(r.date))}${r.time?" "+esc(r.time):""}</span>${r.loc&&r.loc.addr?`<span>· ${esc(shortAddr(r.loc.addr))}</span>`:""}</div><div class="cn mono">${i+1} / ${CF.list.length}${BUSY.has(r.id)?" · "+esc(BUSY.get(r.id)):""}</div>`;
  }
  const s=$("#cfs");if(s&&document.activeElement!==s)s.value=i;
}
function cfGo(t){
  cancelAnimationFrame(CF.raf);
  t=Math.max(0,Math.min(CF.list.length-1,t));
  const p0=CF.pos,t0=performance.now(),dur=Math.min(520,220+Math.abs(t-p0)*60);
  const step=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);CF.pos=p0+(t-p0)*e;cfSync();if(k<1)CF.raf=requestAnimationFrame(step)};
  CF.raf=requestAnimationFrame(step);
}
function cfBind(cf){
  cf.addEventListener("pointerdown",e=>{
    if(e.button>0)return;cancelAnimationFrame(CF.raf);
    CF.drag={x:e.clientX,y:e.clientY,p:CF.pos,moved:false,lx:e.clientX,lt:performance.now(),v:0};
    try{cf.setPointerCapture(e.pointerId)}catch(_){}
  });
  cf.addEventListener("pointermove",e=>{
    const D=CF.drag;if(!D)return;
    const dx=e.clientX-D.x;if(!D.moved&&Math.abs(dx)<6)return;D.moved=true;
    const now=performance.now(),dt=Math.max(1,now-D.lt);D.v=.8*((e.clientX-D.lx)/dt)+.2*D.v;D.lx=e.clientX;D.lt=now;
    CF.pos=Math.max(-.45,Math.min(CF.list.length-.55,D.p-dx/(CF.W*.62)));cfSync();
  });
  const end=e=>{
    const D=CF.drag;CF.drag=null;if(!D)return;
    if(!D.moved){
      const el=document.elementFromPoint(e.clientX,e.clientY),c=el&&el.closest(".cfc");
      if(c){const i=+c.dataset.i;if(i===Math.round(CF.pos))openDetail(c.dataset.id);else cfGo(i)}
      return;
    }
    cfGo(Math.round(CF.pos-D.v*160/(CF.W*.62)));
  };
  cf.addEventListener("pointerup",end);
  cf.addEventListener("pointercancel",()=>{CF.drag=null;cfGo(Math.round(CF.pos))});
  cf.addEventListener("wheel",e=>{
    const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:(e.shiftKey?e.deltaY:0);if(!d)return;
    e.preventDefault();cancelAnimationFrame(CF.raf);
    CF.pos=Math.max(0,Math.min(CF.list.length-1,CF.pos+d/(CF.W*.9)));cfSync();
    clearTimeout(CF.snapT);CF.snapT=setTimeout(()=>cfGo(Math.round(CF.pos)),140);
  },{passive:false});
}

/* ---------- 사진 읽기: 찍은 시간·위치(EXIF), 줄이기 ---------- */
function exifRead(buf){
  try{
    const v=new DataView(buf);if(v.getUint16(0)!==0xFFD8)return{};
    let o=2;
    while(o<v.byteLength-4){
      const m=v.getUint16(o);
      if(m===0xFFE1&&v.getUint32(o+4)===0x45786966)return tiffRead(v,o+10);
      if((m&0xFF00)!==0xFF00||m===0xFFDA)break;
      o+=2+v.getUint16(o+2);
    }
  }catch(e){}
  return{};
}
function tiffRead(v,t){
  const le=v.getUint16(t)===0x4949,g16=p=>v.getUint16(p,le),g32=p=>v.getUint32(p,le);
  const ifd=p=>{const n=g16(p),e={};for(let i=0;i<n;i++){const q=p+2+i*12;e[g16(q)]={type:g16(q+2),cnt:g32(q+4),vo:q+8}}return e};
  const val=en=>{
    if(!en)return null;const{type,cnt,vo}=en,size=({1:1,2:1,3:2,4:4,5:8,7:1,9:4,10:8})[type]||1,off=size*cnt>4?t+g32(vo):vo;
    if(type===2){let s="";for(let i=0;i<cnt-1;i++)s+=String.fromCharCode(v.getUint8(off+i));return s}
    if(type===5){const a=[];for(let i=0;i<cnt;i++)a.push(g32(off+i*8)/(g32(off+i*8+4)||1));return a}
    if(type===3)return g16(off);if(type===4)return g32(off);return null;
  };
  const i0=ifd(t+g32(t+4)),out={};
  try{if(i0[0x8769]){const ex=ifd(t+val(i0[0x8769]));out.dt=val(ex[0x9003])||val(ex[0x9004])}}catch(e){}
  if(!out.dt&&i0[0x0132])out.dt=val(i0[0x0132]);
  try{if(i0[0x8825]){const gp=ifd(t+val(i0[0x8825])),la=val(gp[2]),lo=val(gp[4]);
    if(la&&lo){const dms=a=>a[0]+a[1]/60+a[2]/3600;let lat=dms(la),lng=dms(lo);if(val(gp[1])==="S")lat=-lat;if(val(gp[3])==="W")lng=-lng;
      if(isFinite(lat)&&isFinite(lng)&&(lat||lng))out.gps={lat:+lat.toFixed(6),lng:+lng.toFixed(6)}}}}catch(e){}
  const m=/^(\d{4}):(\d\d):(\d\d)[ T](\d\d):(\d\d)/.exec(out.dt||"");
  out.date=m?m[1]+"-"+m[2]+"-"+m[3]:"";out.time=m?m[4]+":"+m[5]:"";
  return out;
}
async function bitmapOf(blob){
  try{return await createImageBitmap(blob,{imageOrientation:"from-image"})}catch(e){}
  return new Promise((res,rej)=>{const u=URL.createObjectURL(blob),im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error("사진을 읽지 못했어요"));im.src=u});
}
function shrink(bm,max,q,sq){ // sq: 가운데를 정사각형으로 잘라냄 (카메라로 찍은 사진)
  let w=bm.width,h=bm.height,sx=0,sy=0;
  if(sq){const m=Math.min(w,h);sx=(w-m)/2;sy=(h-m)/2;w=h=m}
  const s=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");
  c.width=Math.round(w*s);c.height=Math.round(h*s);c.getContext("2d").drawImage(bm,sx,sy,w,h,0,0,c.width,c.height);
  return new Promise(res=>c.toBlob(b=>res(b),"image/jpeg",q));
}
const b64=blob=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(",")[1]);fr.onerror=rej;fr.readAsDataURL(blob)});
function here(){ // 지금 위치 (사진에 위치가 없을 때만)
  return new Promise(res=>{
    if(!navigator.geolocation)return res(null);
    navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6)}),()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:120000});
  });

/* 위치 → 주소: 오픈스트리트맵 Nominatim(키 없음). 보내는 것: 위도·경도뿐. 사진 한 장에 한 번, 1초에 1건 이하. 동 단위 결과를 기록에 저장해 다시 부르지 않음 */
let nomAt=0;
async function addrOf(lat,lng){
  try{
    const wait=nomAt+1100-Date.now();nomAt=Math.max(Date.now(),nomAt+1100);if(wait>0)await new Promise(r=>setTimeout(r,wait));
    const r=await fetch("https://nominatim.openstreetmap.org/reverse?"+new URLSearchParams({format:"jsonv2",lat,lon:lng,zoom:"17","accept-language":"ko"}));
    if(!r.ok)return"";
    const j=await r.json(),a=j.address||{};
    const top=a.province||a.state||a.city||"",mid=a.city&&a.city!==top?a.city:"",gu=a.borough||a.county||a.city_district||a.district||"",dong=a.quarter||a.suburb||a.neighbourhood||a.village||a.town||"";
    const s=[top.replace(/특별시|광역시|특별자치시|특별자치도/,"").replace(/도$/,"")||top,mid,gu,dong].filter(Boolean);
    const out=[...new Set(s)].join(" ");
    return(out||String(j.display_name||"").split(",").slice(0,3).reverse().join(" ")).trim().slice(0,60);
  }catch(e){return""}
}

/* ---------- 카메라 (촬영 페이지가 보일 때만 켬, 정사각형으로만 찍음) ---------- */
const cam={stream:null,facing:lsGet("goodday.facing")==="user"?"user":"environment",err:"",busy:false,want:false};
function camSync(){
  const want=!!db&&!$("#shoot").hidden&&!LAYERS.length&&!document.hidden;
  cam.want=want;
  if(want&&!cam.stream&&!cam.busy)camStart();
  else if(!want&&cam.stream)camStop();
}
async function camStart(){
  const v=$("#vid"),m=$("#vmsg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){cam.err="이 브라우저는 화면 안 카메라를 못 써요.\n가운데 버튼을 누르면 휴대폰 카메라가 열려요.";m.textContent=cam.err;return}
  cam.busy=true;m.textContent="";
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:cam.facing},width:{ideal:1920},height:{ideal:1920}},audio:false});
    if(!cam.want){s.getTracks().forEach(t=>t.stop());return}
    cam.stream=s;cam.err="";v.srcObject=s;v.classList.toggle("mir",cam.facing==="user");
    try{await v.play()}catch(e){}
  }catch(e){
    cam.err=e&&e.name==="NotAllowedError"?"카메라 권한이 꺼져 있어요.\n가운데 버튼을 누르면 휴대폰 카메라가 열려요.":"카메라를 켜지 못했어요.\n가운데 버튼을 누르면 휴대폰 카메라가 열려요.";
    m.textContent=cam.err;
  }finally{cam.busy=false}
}
function camStop(){if(cam.stream){cam.stream.getTracks().forEach(t=>t.stop());cam.stream=null}const v=$("#vid");if(v)v.srcObject=null}
document.addEventListener("visibilitychange",camSync);
async function shutter(){
  const v=$("#vid");
  if(!cam.stream||!v.videoWidth){$("#fCam").dataset.sq="1";$("#fCam").click();return}
  const w=v.videoWidth,h=v.videoHeight,s=Math.min(w,h),o=Math.min(s,2048),c=document.createElement("canvas");
  c.width=c.height=o;const g=c.getContext("2d");
  if(cam.facing==="user"){g.translate(o,0);g.scale(-1,1)}
  g.drawImage(v,(w-s)/2,(h-s)/2,s,s,0,0,o,o);
  const f=$("#flash");f.classList.add("on");setTimeout(()=>f.classList.remove("on"),60);
  const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.92));
  if(b)startEntry("shot",new File([b],"shot.jpg",{type:"image/jpeg",lastModified:Date.now()}));
}
function flipCam(){cam.facing=cam.facing==="user"?"environment":"user";lsSet("goodday.facing",cam.facing);camStop();camSync()}

/* ---------- 새 기록 · 고치기 ---------- */
let E=null; // 입력 중인 기록
const PEND=new Map(); // 아직 드라이브에 못 올린 사진 {full,thumb,ai,prev}
const BUSY=new Map(); // 기록별 진행 표시
async function startEntry(src,file){
  const now=new Date();
  E={id:null,src,file:null,prev:"",date:today(),time:hm(now),loc:null,locNote:"",note:"",theme:"",exifTime:false};
  openEntry();
  if(file)await takeFile(file,src);
  else{E.locNote="위치 찾는 중";drawEntry();const g=await here();if(!E)return;if(g){E.loc={...g,addr:""};E.locNote="";drawEntry();const a=await addrOf(g.lat,g.lng);if(E&&E.loc&&E.loc.lat===g.lat){E.loc.addr=a;drawEntry()}}else{E.locNote="";drawEntry()}}
}
async function takeFile(file,src){
  if(!E)return;
  E.file=file;if(E.prev)URL.revokeObjectURL(E.prev);E.prev=URL.createObjectURL(file);E.locNote="사진 읽는 중";drawEntry();
  let ex={};try{ex=exifRead(await file.slice(0,262144).arrayBuffer())}catch(e){}
  if(!E||E.file!==file)return;
  if(ex.date){E.date=ex.date;E.time=ex.time;E.exifTime=true}
  else if((src==="album"||src==="shot")&&file.lastModified){const d=new Date(file.lastModified);E.date=iso(d);E.time=hm(d)}
  let g=ex.gps||null,fromPhoto=!!g;
  if(!g&&(src==="camera"||src==="shot")){E.locNote="위치 찾는 중";drawEntry();g=await here()}
  if(!E||E.file!==file)return;
  E.loc=g?{...g,addr:""}:null;E.locSrc=fromPhoto?"사진에서 읽음":g?"지금 위치":"";E.locNote="";drawEntry();
  if(g){const a=await addrOf(g.lat,g.lng);if(E&&E.loc&&E.loc.lat===g.lat){E.loc.addr=a;drawEntry()}}
}
function openEntry(){
  const el=openLayer("entry",`<div class="lh"><button class="ib" data-act="close" aria-label="닫기">${ico("back")}</button><h2>${E.id?"기록 고치기":"새 기록"}</h2><button class="btn p" data-act="saveEntry">저장</button></div><div class="lb" id="entry"></div>`);
  LAYERS[LAYERS.length-1].onClose=()=>{if(E&&E.prev&&!E.kept)URL.revokeObjectURL(E.prev);E=null};
  drawEntry();
  setTimeout(()=>{const n=$("#enote");if(n&&!E.file&&!E.id&&!E.photo)n.focus()},250);
}
/* 입력 페이지: 위에 폴라로이드(사진 + 적는 글이 바로 손글씨로 보임), 아래에 글 칸, 그 밑에 테마 5개 */
function drawEntry(){
  const box=$("#entry");if(!box||!E)return;
  const keepNote=$("#enote")?$("#enote").value:E.note;E.note=keepNote;
  const hasImg=E.prev||(E.photo&&E.photo.full);
  box.innerHTML=`
   <div class="epola"><div class="pola ${thCls(E.theme)}"><div class="ph">${hasImg?`<img alt="" ${E.prev?`src="${esc(E.prev)}"`:`data-dimg="${esc(E.photo.full)}"`}><span class="stamp mono">${esc(E.date.slice(2).replace(/-/g," "))}</span>`:`<div class="emp"><span>사진 없이 쓰면<br>글에 맞는 사진을 찾아 붙여요</span><div class="btnrow"><button class="btn" data-act="eCam">${ico("cam")}찍기</button><button class="btn" data-act="eAlb">${ico("img")}앨범</button></div></div>`}</div><div class="pen" id="epen">${esc(capOf({note:E.note}).slice(0,48))}</div></div></div>
   ${hasImg?`<div class="eacts"><button class="btn" data-act="${E.id?"eCam":"retake"}">${ico("cam")}다시 찍기</button><button class="btn" data-act="eAlb">${ico("img")}앨범</button><button class="btn" data-act="noPhoto">${ico("x")}사진 빼기</button></div>`:""}
   <div class="auto">
     ${ico("clock")}<div class="two"><input type="date" id="edate" value="${esc(E.date)}"><input type="time" id="etime" value="${esc(E.time)}"></div><span class="s">${E.exifTime?"사진에서 읽음":""}</span>
     ${ico("pin")}<span class="lv">${E.locNote?esc(E.locNote)+"…":E.loc?esc(E.loc.addr||"위치 확인 중"):"위치 없음"}</span>${E.loc?`<button class="btn" style="height:26px;padding:0 8px;font-size:12px" data-act="noLoc">빼기</button>`:`<span class="s">${E.locSrc||""}</span>`}
   </div>
   <textarea class="note" id="enote" rows="2" placeholder="한 줄 남기기 (예: 오펜하이머 봤다, 연남동 칼국수)">${esc(E.note)}</textarea>
   <div class="themes5">${THEMES.map(t=>`<button class="chip pick ${t[0]}${E.theme===t[0]?" on":""}" data-eth="${t[0]}" aria-pressed="${E.theme===t[0]}"><i class="dot"></i>${t[1]}</button>`).join("")}</div>
   <div class="hint">${E.theme?thName(E.theme)+" 테마로 저장해요. 한 번 더 누르면 자동으로 돌아가요":"테마를 안 고르면 제미나이가 글과 사진을 보고 정해요"}</div>`;
  loadImgs(box,true);
}
async function saveEntry(){
  if(!E)return;
  const note=($("#enote").value||"").trim();
  const date=$("#edate").value||today(),time=$("#etime").value||"";
  if(!note&&!E.file&&!(E.photo&&E.photo.full)){toast("사진이나 글을 남겨 주세요");return}
  const now=Date.now(),old=E.id?db.records.find(r=>r.id===E.id):null;
  let r=old;
  if(!r){r={id:uid(),theme:"",ts:now,people:[],cands:[]};db.records.push(r)}
  const changed=!old||old.note!==note||(E.theme&&old.theme!==E.theme)||!!E.file;
  if(!old||(E.theme&&E.theme!==old.theme))r.theme=E.theme||"";
  r.note=note;r.date=date;r.time=time;r.loc=E.loc?{...E.loc}:null;r.upd=now;
  if(!r.title||changed&&!old)r.title=note.split("\n")[0].slice(0,40)||"사진 기록";
  if(E.dropPhoto&&old&&old.photo){dropPhoto(old);delete r.photo}
  if(changed){delete r.why;if(!E.theme&&!old)r.theme=""}
  const file=E.file,id=r.id,themeFixed=!!E.theme,sq=!!E.square;
  if(file){E.kept=true;PEND.set(id,{prev:E.prev})}
  save();closeTop();render();
  if(LAYERS.length&&LAYERS[LAYERS.length-1].kind==="detail")drawDetail();
  toast(old?"고쳤어요":"저장했어요");
  if(file)processPhoto(id,file,sq);
  if(changed)enrich(id,{file,themeFixed,fresh:!old||!!file||old.note!==note||(E&&E.theme)});
}
async function processPhoto(id,file,sq){ // 작은 사진(480, 목록용)과 큰 사진(1600, 상세에서만 받음) 두 장을 만들어 올림
  BUSY.set(id,"사진 올리는 중");refresh(id);
  try{
    const bm=await bitmapOf(file),full=await shrink(bm,1600,.86,sq),thumb=await shrink(bm,480,.8,sq),ai=await shrink(bm,768,.8,sq);
    const pd=PEND.get(id)||{};pd.ai=ai;pd.full=full;pd.thumb=thumb;PEND.set(id,pd);
    if(DEMO){BUSY.delete(id);refresh(id);return}
    const r0=db.records.find(r=>r.id===id),base=(r0&&r0.date||today())+"_"+id;
    const [fid,tid]=await Promise.all([upPhoto(full,base+".jpg"),upPhoto(thumb,base+"_s.jpg")]);
    const r=db&&db.records.find(x=>x.id===id);if(!r){return}
    if(r.photo)dropPhoto(r);
    r.photo={full:fid,thumb:tid};r.upd=Date.now();
    THUMBS.set(tid,URL.createObjectURL(thumb));THUMBS.set(fid,URL.createObjectURL(full));
    if(pd.prev)setTimeout(()=>URL.revokeObjectURL(pd.prev),5000);
    PEND.delete(id);save();
  }catch(e){
    const r=db&&db.records.find(x=>x.id===id);if(r){r.why="사진을 드라이브에 올리지 못했어요 ("+String(e.message||e).slice(0,40)+")";}
    toast("사진을 올리지 못했어요. 상세 화면에서 다시 올릴 수 있어요");
  }finally{if(BUSY.get(id)==="사진 올리는 중")BUSY.delete(id);refresh(id)}
}
async function retryUpload(id){const pd=PEND.get(id);if(!pd||!pd.full){toast("다시 올릴 사진이 없어요. 사진을 다시 골라 주세요");return}
  BUSY.set(id,"사진 올리는 중");refresh(id);
  try{const r0=db.records.find(r=>r.id===id),base=(r0.date||today())+"_"+id;const [fid,tid]=await Promise.all([upPhoto(pd.full,base+".jpg"),upPhoto(pd.thumb,base+"_s.jpg")]);
    r0.photo={full:fid,thumb:tid};delete r0.why;PEND.delete(id);save();toast("사진을 올렸어요")}catch(e){toast("이번에도 못 올렸어요. 인터넷을 확인해 주세요")}
  finally{BUSY.delete(id);refresh(id)}}
function refresh(id){ // 촬영 화면 앨범 버튼·보기 카드·상세를 조용히 다시 그림
  if(!db)return;
  renderShoot();
  const top=LAYERS[LAYERS.length-1];
  if(top&&top.kind==="detail"&&top.id===id)drawDetail();
  const el=CF.els.get(id),r=db.records.find(x=>x.id===id);
  if(el&&r){el.querySelector(".pola").className="pola "+thCls(r.theme);el.querySelector(".pola").innerHTML=polaInner(r);loadImgs(el,true);const m=$("#cfm");if(m)m.dataset.id="";cfMeta()}
  else if(viewLayer()&&r&&!CF.list.includes(r))viewRefresh(false);
}

/* ---------- 제미나이로 찾기 ----------
   키는 말만해요 설정(말만해요_설정.json, 파일 이름으로 찾음)의 것을 먼저 씀. 메모리에만 두고 복사하지 않음(app\_공통\제미나이연결.md).
   그 파일을 못 읽을 때만 사용자가 이 앱 설정에 직접 넣은 키(내 드라이브 goodday/설정/goodday_설정.json)를 씀. localStorage·GitHub에는 두지 않음.
   보내는 것: 사진(긴 변 768로 다시 그린 것이라 EXIF·위치값 없음), 사용자가 적은 글(이메일·긴 숫자는 가림), 찍은 곳의 동 단위 주소 글, 날짜·시간, 테마. 좌표·다른 기록은 보내지 않음. */
const GEMINI_MODEL_DEFAULT="gemini-2.5-flash";
let gcfg=null,gcfgAt=0;
async function loadGemini(){
  const acct=gAcct();
  if(gcfg&&gcfg.acct===acct&&gcfg.geminiKey)return gcfg;
  if(gcfg&&gcfg.acct===acct&&Date.now()-gcfgAt<300000)return gcfg;
  gcfgAt=Date.now();gcfg={acct,geminiKey:"",model:GEMINI_MODEL_DEFAULT};
  try{
    const q="name='말만해요_설정.json' and trashed=false";
    const d=await gfetch(DAPI+"/files?pageSize=5&orderBy=modifiedTime desc&fields="+encodeURIComponent("files(id)")+"&q="+encodeURIComponent(q));
    gcfg.why=(d.files||[]).length?"말만해요 설정 파일에 제미나이 키가 비어 있어요":"이 앱이 말만해요 설정 파일을 못 찾았어요(드라이브 권한)";
    for(const f of d.files||[]){
      try{const c=parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));
        if(c&&typeof c.geminiKey==="string"&&c.geminiKey.trim()){gcfg.geminiKey=c.geminiKey.trim();gcfg.why="";if(c.model)gcfg.model=String(c.model);break}}catch(e){if(e.message==="GOOGLE_AUTH")throw e}
    }
  }catch(e){gcfg.why="드라이브에서 설정을 읽다 오류가 났어요"}
  if(gcfg.geminiKey)gcfg.src="말만해요 설정의 키";
  else{ // 말만해요 키를 못 읽을 때만: 이 앱 설정(내 드라이브 goodday/설정)에 사용자가 직접 넣은 키
    await appCfgLoad();
    if(appCfg.geminiKey&&appCfg.acct===acct){gcfg.geminiKey=appCfg.geminiKey;gcfg.src="이 앱 설정의 키";gcfg.why=""}
  }
  return gcfg;
}
const gWhy=()=>(gcfg&&gcfg.why)||"제미나이 키를 못 읽었어요";
const maskText=t=>String(t).replace(/[\w.+-]+@[\w-]+(\.[\w-]+)+/g,"[이메일]").replace(/\d[\d\s-]{6,}\d/g,"[번호]");
function ruleTheme(t){ // 키가 없을 때 낱말로 짐작
  t=String(t||"");
  if(/미팅|회의|상담|고객|업무|출장|계약|교육|세미나|일정/.test(t))return"work";
  if(/노래|음악|앨범|들었|듣고|플레이리스트|가수|콘서트/.test(t))return"hear";
  if(/맛집|식당|카페|커피|먹었|맛있|점심|저녁|아침|브런치|술집|국수|칼국수|국밥|고기|파스타|피자|치킨|빵|디저트|맥주|소주|와인/.test(t))return"eat";
  if(/영화|드라마|넷플릭스|극장|봤|시청|연극|뮤지컬|공연|전시|책|소설|읽었/.test(t))return"see";
  if(/여행|산책|공원|바다|산|명소|숙소|호텔|구경|핫플|다녀/.test(t))return"go";
  return"";
}
async function gemini(cfg,parts,search){
  const res=await fetch("https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(cfg.model||GEMINI_MODEL_DEFAULT)+":generateContent",{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":cfg.geminiKey},
    body:JSON.stringify({contents:[{parts}],...(search?{tools:[{google_search:{}}]}:{}),generationConfig:{temperature:0}})});
  if(!res.ok)throw new Error("제미나이 "+res.status);
  const j=await res.json();
  return String((j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[]).map(p=>p.text||"").join(""));
}
function askPrompt(r,theme){
  return"너는 사진 일기 앱의 도우미다. 사용자가 남긴 사진(있으면)과 글, 찍은 곳, 날짜를 보고 구글 검색으로 확인해 기록을 채운다.\n"+
  "테마: see=보고(영화·드라마·연극·공연·전시·책), hear=듣고(노래·앨범·음악 공연), eat=먹고(식당·카페·술집), go=가고(여행지·명소·핫플레이스), work=일(업무·미팅·사람 만남).\n"+
  (theme?"테마는 "+theme+"로 정해져 있다.\n":"먼저 글과 사진에 가장 알맞은 테마 하나를 골라라.\n")+
  "사용자 글: \""+maskText(r.note||"").replace(/"/g,"'")+"\"\n찍은 곳(동 단위): "+(r.loc&&r.loc.addr?r.loc.addr:"모름")+"\n날짜: "+(r.date||today())+" "+(r.time||"")+"\n"+
  "테마별로 할 일:\n"+
  "- see: 어떤 작품인지 찾아라. sub는 영화|드라마|연극|공연|전시|책 중 하나. info 첫 줄: 제목(원제) · 연도 · 구분 · 국가 (책이면 제목 · 저자 · 출판연도 · 출판사). 둘째 줄: 감독: … / 출연: … (책이면 생략). 셋째 줄부터 줄거리·소개 2~3문장(결말 스포일러 금지). 책이고 확실하면 isbn에 13자리.\n"+
  "- hear: 곡·앨범을 찾아라. info 첫 줄: 곡명(원어 제목) · 아티스트(원어 이름) · 발매연도 · 장르. 둘째 줄: 앨범: …. 셋째 줄부터 소개 1~2문장.\n"+
  "- eat: 찍은 동네 안에서 글·사진에 맞는 식당·카페·술집 후보를 가까운 순으로 최대 3곳 cands에 넣어라(name=가게 이름, what=음식 종류, near=찍은 곳에서 대략 거리나 위치). 가장 맞는 곳을 title로. info 첫 줄: 이름 · 지역(구·동) · 음식 종류. 둘째 줄: 대표 메뉴 / 가격대 / 영업시간 중 확실한 것. 셋째 줄: 소개 1문장.\n"+
  "- go: 여행지·명소·핫플레이스를 찾아라. info 첫 줄: 이름 · 지역 · 분류. 둘째 줄: 볼거리 / 이용 시간·요금 중 확실한 것. 셋째 줄부터 소개 1~2문장.\n"+
  "- work: 검색하지 말고 글에서 일의 이름(title, 짧게)과 만난 사람 이름(people)만 뽑아라. info는 빈 글자.\n"+
  "title은 찾은 정식 이름(못 찾으면 글을 15자 안으로 요약). photo_query는 이 기록에 어울리는 사진을 위키미디어 공용에서 찾을 짧은 영어 검색어(예: kalguksu, Namhansanseong, jazz piano).\n"+
  "확실하지 않은 것은 쓰지 말고 *, # 같은 기호는 쓰지 마라.\n"+
  "JSON 하나로만 답해라: {\"theme\":\"\",\"sub\":\"\",\"title\":\"\",\"info\":\"\",\"isbn\":\"\",\"cands\":[{\"name\":\"\",\"what\":\"\",\"near\":\"\"}],\"people\":[],\"photo_query\":\"\"}";
}
function parseAsk(t){
  const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)return null;
  const s=t.slice(a,b+1);
  try{return JSON.parse(s)}catch(e){}
  let o="",q=false,bs=false; // 글자 안에 그냥 줄바꿈이 들어온 답도 읽음
  for(const ch of s){if(q){if(bs){bs=false}else if(ch==="\\")bs=true;else if(ch==='"')q=false;else if(ch==="\n"){o+="\\n";continue}else if(ch==="\r"||ch==="\t"){o+=" ";continue}}else if(ch==='"')q=true;o+=ch}
  try{return JSON.parse(o)}catch(e){return null}
}
const s0=(v,n)=>typeof v==="string"?v.replace(/[*#`]/g,"").trim().slice(0,n):"";
async function enrich(id,o){
  o=o||{};
  const r=db&&db.records.find(x=>x.id===id);if(!r)return;
  BUSY.set(id,"정보 찾는 중");refresh(id);
  const why=[];
  try{
    const cfg=DEMO?null:await loadGemini();
    let a=null;
    if(cfg&&cfg.geminiKey){
      const parts=[];
      let img=PEND.get(id)&&PEND.get(id).ai;
      if(!img&&o.file){try{img=await shrink(await bitmapOf(o.file),768,.8)}catch(e){}}
      if(!img&&r.photo&&r.photo.thumb){try{img=await gfetch(DAPI+"/files/"+r.photo.thumb+"?alt=media",null,"blob")}catch(e){}}
      if(img)parts.push({inline_data:{mime_type:"image/jpeg",data:await b64(img)}});
      parts.push({text:askPrompt(r,o.themeFixed?r.theme:"")});
      try{a=parseAsk(await gemini(cfg,parts,true))}catch(e){why.push(String(e.message||e).slice(0,40))}
      if(!a&&!why.length)why.push("제미나이 답을 읽지 못했어요");
    }else why.push(DEMO?"체험 모드":gWhy());
    const r2=db&&db.records.find(x=>x.id===id);if(!r2)return;
    if(a){
      if(!o.themeFixed&&TH[a.theme])r2.theme=a.theme;
      const th=r2.theme;
      const t=s0(a.title,60);if(t)r2.title=t;
      r2.sub=s0(a.sub,10);

function q1(r){return(String(r.info||"").split("\n")[0].split("·")[0]||r.title).replace(/\s*\([^)]*\)/g,"").trim()||r.title}
function linkOf(r){

/* 그림 찾기: 보고=포스터(TMDB 키가 있으면)·책 표지·위키백과, 듣고=앨범 표지(iTunes), 가고=위키백과, 그 밖=위키미디어 공용, 마지막=지도 조각 */
async function findImages(r,why){
  let art="",link="";
  try{
    if(r.theme==="see"){
      if(r.isbn)art="https://contents.kyobobook.co.kr/sih/fit-in/458x0/pdt/"+r.isbn+".jpg";
      else if((r.sub==="영화"||r.sub==="드라마")&&hasTmdb()){const t=await tmdbFind(r);art=t.p;link=t.link}
      if(!art){const w=await findWiki(q1(r));art=w.p}
      if(!art&&(r.sub==="영화"||r.sub==="드라마")&&!hasTmdb())why.push("포스터는 설정의 TMDB 키가 있어야 가져와요");
    }else if(r.theme==="hear"){const t=await findArt(r);art=t.p;link=t.link}
    else if(r.theme==="go"){const w=await findWiki(q1(r));art=w.p;link=w.link}
  }catch(e){}
  if(art&&imgOk(art))r.art=art;else delete r.art;
  if(link&&LINK_RE.test(link))r.link=link;
  if(r.photo&&r.photo.full||PEND.has(r.id)){delete r.rec;return}
  let rec=r.art?{url:r.art,src:"작품 정보"}:null;
  if(!rec&&r.q){try{const c=await findCommons(r.q);if(c)rec={url:c,src:"위키미디어 공용"}}catch(e){}}
  if(!rec&&r.loc&&r.loc.lat){rec={url:osmTile(r.loc.lat,r.loc.lng,16),src:"지도"}}
  if(rec&&imgOk(rec.url))r.rec=rec;else{delete r.rec;why.push("어울리는 사진을 못 찾았어요")}
}
function osmTile(lat,lng,z){const n=2**z,x=Math.floor((lng+180)/360*n),la=lat*Math.PI/180,y=Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n);return"https://tile.openstreetmap.org/"+z+"/"+x+"/"+y+".png"}
async function findCommons(q){
  const res=await fetch("https://commons.wikimedia.org/w/api.php?"+new URLSearchParams({action:"query",format:"json",origin:"*",generator:"search",gsrsearch:"filetype:bitmap "+q.slice(0,60),gsrnamespace:"6",gsrlimit:"5",prop:"imageinfo",iiprop:"url",iiurlwidth:"640"}));
  if(!res.ok)return"";
  const pages=Object.values(((await res.json()).query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  for(const p of pages){const u=p.imageinfo&&p.imageinfo[0]&&(p.imageinfo[0].thumburl||p.imageinfo[0].url);if(u&&WIKI_RE.test(u)&&/\.(jpe?g|png)(\/|$)/i.test(u))return u}
  return"";
}
const WIKIPAGE_RE=/^https:\/\/ko\.wikipedia\.org\/wiki\/[^\s"<>]+$/;
async function findWiki(nm){
  const key=s=>String(s).replace(/\s+/g,"").toLowerCase();
  const res=await fetch("https://ko.wikipedia.org/w/api.php?"+new URLSearchParams({action:"query",format:"json",origin:"*",generator:"search",gsrsearch:nm.slice(0,80),gsrlimit:"3",prop:"pageimages|info",piprop:"thumbnail",pithumbsize:"600",inprop:"url"}));
  if(!res.ok)return{p:"",link:""};
  const pages=Object.values(((await res.json()).query||{}).pages||{}).sort((a,b)=>a.index-b.index);
  const pg=pages.find(x=>{const a=key(x.title),b=key(nm);return a.includes(b)||b.includes(a)});
  if(!pg)return{p:"",link:""};
  const th=pg.thumbnail&&pg.thumbnail.source;
  return{p:WIKI_RE.test(th||"")?th:"",link:WIKIPAGE_RE.test(pg.fullurl||"")?pg.fullurl:""};
}
async function findArt(r){ // 음악 앨범 그림: 애플 iTunes 검색(키 필요 없음)
  const first=String(r.info||"").split("\n")[0].split("·").map(s=>s.trim()),yr=(String(r.info||"").split("\n")[0].match(/\b(19|20)\d{2}\b/)||[""])[0];
  const orig=s=>{const m=/\(([^)]+)\)/.exec(s||"");return m?m[1]:(s||"")},strip=s=>(s||"").replace(/\s*\([^)]*\)/g,"").trim();
  const t0=first[0]||r.title,a0=first[1]&&!/^(19|20)\d{2}$/.test(first[1])?first[1]:"";
  const terms=[...new Set([(orig(t0)+" "+orig(a0)).trim(),(strip(t0)+" "+strip(a0)).trim(),a0?"":r.title])].filter(Boolean);
  const names=a0?[orig(a0),strip(a0)].filter(Boolean).map(s=>s.toLowerCase()):[];
  for(const term of terms){
    const res=await fetch("https://itunes.apple.com/search?"+new URLSearchParams({term:term.slice(0,100),media:"music",entity:"song",limit:"10"}));
    if(!res.ok)break;
    const list=((await res.json()).results||[]).filter(x=>ART_RE.test(x.artworkUrl100||""));
    let best=null,bs=0;
    list.forEach(x=>{const an=String(x.artistName||"").toLowerCase(),am=names.some(n=>an.includes(n)||n.includes(an));const s=(am?2:0)+(yr&&String(x.releaseDate||"").startsWith(yr)?1:0);if(s>bs){bs=s;best=x}});
    if(!best&&!names.length&&list[0])best=list[0];
    if(best)return{p:best.artworkUrl100.replace(/\d+x\d+bb\.jpg$/,"600x600bb.jpg"),link:/^https:\/\/music\.apple\.com\//.test(best.trackViewUrl||"")?best.trackViewUrl:""};
  }
  return{p:"",link:""};
}

async function calAttach(id,manual){
  const r=db&&db.records.find(x=>x.id===id);if(!r||!calOn())return false;
  const d=/^(\d{4})-(\d\d)-(\d\d)$/.exec(r.date||"");if(!d)return false;
  const tm=/^(\d\d):(\d\d)$/.exec(r.time||""),at=tm?new Date(+d[1],+d[2]-1,+d[3],+tm[1],+tm[2]):null;
  const min=at?new Date(at-3*36e5):new Date(+d[1],+d[2]-1,+d[3]),max=at?new Date(+at+3*36e5):new Date(+d[1],+d[2]-1,+d[3]+1);
  if(manual){BUSY.set(id,"일정 찾는 중");refresh(id)}

    const j=DEMO?{items:[{summary:"1팀 정기 미팅",location:"영등포 본사 4층",start:{dateTime:new Date(+d[1],+d[2]-1,+d[3],14,0).toISOString()},end:{dateTime:new Date(+d[1],+d[2]-1,+d[3],15,30).toISOString()},attendees:[{displayName:"최수진"},{displayName:"박상선"},{self:true,displayName:"나"}]}]}
      :await gfetch("https://www.googleapis.com/calendar/v3/calendars/primary/events?"+new URLSearchParams({singleEvents:"true",orderBy:"startTime",maxResults:"20",timeMin:min.toISOString(),timeMax:max.toISOString(),fields:"items(summary,location,start,end,attendees(displayName,self,resource))"}));
    const ev=(j.items||[]).filter(e=>e.start&&e.start.dateTime);
    const t0=at?+at:+min+12*36e5,score=e=>{const s=+new Date(e.start.dateTime),en=+new Date(e.end&&e.end.dateTime||s);return s<=t0&&t0<=en?0:Math.min(Math.abs(s-t0),Math.abs(en-t0))};
    const e=ev.sort((a,b)=>score(a)-score(b))[0];
    const r2=db.records.find(x=>x.id===id);if(!r2)return false;
    if(!e){if(manual)toast("그 시간 앞뒤 3시간에 일정이 없어요");return false}
    const h=x=>hm(new Date(x));
    r2.ev={title:s0(e.summary,60),where:s0(e.location,80),start:h(e.start.dateTime),end:e.end&&e.end.dateTime?h(e.end.dateTime):""};
    const names=(e.attendees||[]).filter(a=>!a.self&&!a.resource&&a.displayName).map(a=>s0(a.displayName,20));
    r2.people=[...new Set([...(r2.people||[]),...names])].slice(0,12);
    if(r2.ev.title)r2.title=r2.ev.title;
    r2.upd=Date.now();save();if(manual)toast("일정을 붙였어요");return true;
  }catch(err){
    const r2=db.records.find(x=>x.id===id);
    if(/ 403/.test(String(err.message))){if(r2)r2.why="캘린더 권한이 없어요. 설정에서 캘린더 연결을 다시 켜 주세요";db.settings.cal=false;save()}
    else if(manual)toast("일정을 불러오지 못했어요");
    return false;
  }finally{if(manual){BUSY.delete(id);refresh(id)}}
}

function openHelp(){
  openLayer("sub",`<div class="lh"><button class="ib" data-act="close" aria-label="뒤로">${ico("back")}</button><h2>사용 설명</h2></div><div class="lb help">
   <p><b>테마 5개</b> · 보고(영화·드라마·연극·공연·책), 듣고(음악), 먹고(식당·카페·술집), 가고(여행지·핫플레이스), 일(미팅·만난 사람).</p>
   <p><b>페이지 4개</b> · 촬영(첫 화면) → 입력 → 보기 → 설정.</p>
   <p><b>촬영</b> · 앱을 열면 카메라 화면이에요. 가운데 버튼을 누르면 정사각형으로 찍혀요. 위 왼쪽 앨범은 휴대폰 사진첩에서 고르기, 글은 사진 없이 글만 쓰기, 오른쪽 위는 앞뒤 카메라 바꾸기와 설정이에요. 아래 왼쪽 작은 사진을 누르면 보기로 가요.</p>
   <p><b>입력</b> · 찍거나 고른 사진이 폴라로이드로 올라오고, 아래 칸에 글을 쓰면 폴라로이드 흰 칸에 손글씨처럼 바로 보여요. 그 밑에서 테마 5개 중 하나를 고르고(안 고르면 자동) 저장해요. 사진 속 날짜·시간과 위치를 자동으로 읽고, 위치가 없으면 지금 위치를 써요. 사진과 글은 따로 저장되고 보일 때만 합쳐져요.</p>
   <p><b>보기</b> · 폴라로이드가 가로로 늘어서요. 좌우로 밀어 넘기고, 가운데 사진을 누르면 상세가 열려요. 아래 막대로 빨리 넘길 수 있어요. 목록에는 작은 사진을 먼저 받아 빠르게 보이고, 상세에서 큰 사진을 받아요.</p>
   <p><b>AI가 채우는 것</b> · 테마를 고르지 않으면(자동) 제미나이가 글과 사진을 보고 테마를 정해요. 보고는 작품 정보(연도·감독·출연·줄거리), 듣고는 곡 정보, 먹고는 사진 위치 근처 식당·술집 후보 3곳, 가고는 장소 소개, 일은 만난 사람을 남겨요(설정에서 캘린더를 연결하면 그 시간 앞뒤 3시간의 일정 이름·장소·참석자를 붙여요. 캘린더는 읽기만 해요). 먹고 후보는 상세 화면에서 눌러서 맞는 곳으로 바꿀 수 있어요.</p>
   <p><b>추천 사진</b> · 글만 남기면 글에 맞는 사진(포스터·앨범 표지·장소 사진, 없으면 지도)을 찾아 붙이고 왼쪽 위에 "추천 사진"이라고 표시해요. 고치기에서 내 사진으로 바꿀 수 있어요.</p>
   <p><b>찾기</b> · 보기 위 검색 칸에 낱말을 넣고, 일·월·년으로 기간을 바꾼 뒤 ‹ › 로 넘겨요. 테마 칩으로 한 가지 테마만 볼 수 있어요.</p>
   <p><b>상세</b> · 위에 폴라로이드(사진과 적은 글), 아래에 찾은 정보와 링크가 나와요. 사진을 누르면 크게 보여요. 다시 찾기는 AI 검색을 한 번 더 해요.</p>
   <p><b>저장 위치</b> · 기록은 내 구글 드라이브 goodday/goodday_기록.json, 사진은 goodday/사진 폴더에 저장돼요. 이 앱은 자기가 만든 파일만 볼 수 있어요.</p>
   <p><b>설정</b> · 촬영·보기 화면 오른쪽 위 작은 톱니바퀴. 다크 모드(기본 켬), 제미나이 상태, 캘린더 연결, 영화 포스터 키, 휴지통, 백업이 있어요.</p>
   <p><b>AI로 보내는 것</b> · 사진과 글이 구글 Gemini로 전송돼요. 사진은 작게 다시 그려 위치값을 뺀 것이고, 위치는 동 단위 주소 글만 보내요. 제미나이 키는 말만해요 설정의 키를 먼저 쓰고, 그걸 못 읽을 때만 설정에 직접 넣은 키를 써요. 키가 없거나 실패해도 기록은 저장돼요.</p></div>`);
}

document.addEventListener("click",e=>{
  const t=e.target.closest("[data-act],[data-open],[data-th],[data-mode],[data-eth],[data-pick],[data-restore],[data-purge],.dpola img");
  if(!t||!db)return;
  if(t.matches(".dpola img")){if(!t.src)return;const el=document.createElement("div");el.className="full";el.innerHTML=`<img alt="" src="${esc(t.src)}">`;el.onclick=()=>el.remove();document.body.appendChild(el);return}
  if(t.dataset.open){openDetail(t.dataset.open);return}
  if(t.dataset.th!==undefined){F.th=t.dataset.th;render();return}
  if(t.dataset.mode){const m=t.dataset.mode;if(m!==F.mode){F.mode=m;if(m!=="all"&&!live().some(inPeriod))F.at=new Date()}render();return}
  if(t.dataset.eth!==undefined){if(E){E.note=$("#enote").value;E.theme=E.theme===t.dataset.eth?"":t.dataset.eth;drawEntry()}return}
  if(t.dataset.pick!==undefined){const top=LAYERS[LAYERS.length-1],r=db.records.find(x=>x.id===top.id),i=+t.dataset.pick,c=r&&r.cands[i];
    if(c){const was=r.pick;r.pick=i;r.title=c.name;if(was!==i){r.info=[c.name,r.loc&&r.loc.addr?shortAddr(r.loc.addr):"",c.what].filter(Boolean).join(" · ")}r.map=mapOf(r);r.link=linkOf(r);r.upd=Date.now();save();drawDetail();renderList()}return}
  if(t.dataset.restore){const r=db.records.find(x=>x.id===t.dataset.restore);if(r){delete r.del;save();drawTrash();renderList();drawSettings()}return}
  if(t.dataset.purge){const r=db.records.find(x=>x.id===t.dataset.purge);if(r&&confirm("완전히 지울까요? 사진 파일도 함께 지워지고 되살릴 수 없어요.")){dropPhoto(r);db.records=db.records.filter(x=>x!==r);save();drawTrash();drawSettings()}return}
  const a=t.dataset.act,top=LAYERS[LAYERS.length-1];
  if(a==="shutter")shutter();
  else if(a==="flip")flipCam();
  else if(a==="view")openView();
  else if(a==="retake")closeTop();
  else if(a==="album")$("#fAlb").click();
  else if(a==="write")startEntry("write");
  else if(a==="eCam"){$("#fCam").dataset.into="1";$("#fCam").dataset.sq="1";$("#fCam").click()}
  else if(a==="eAlb"){$("#fAlb").dataset.into="1";$("#fAlb").click()}
  else if(a==="noPhoto"){if(E){if(E.prev)URL.revokeObjectURL(E.prev);E.prev="";E.file=null;if(E.photo){E.photo=null;E.dropPhoto=true}E.exifTime=false;drawEntry()}}
  else if(a==="noLoc"){if(E){E.loc=null;E.locSrc="";drawEntry()}}
  else if(a==="saveEntry")saveEntry();
  else if(a==="close")closeTop();
  else if(a==="settings")openSettings();
  else if(a==="prev"||a==="next"){const d=a==="next"?1:-1,x=new Date(F.at);if(F.mode==="day")x.setDate(x.getDate()+d);else if(F.mode==="month")x.setMonth(x.getMonth()+d,1);else x.setFullYear(x.getFullYear()+d);F.at=x;render()}
  else if(a==="edit")editRec(top.id);
  else if(a==="refind"){const r=db.records.find(x=>x.id===top.id);if(r){r.info="";r.cands=[];enrich(r.id,{themeFixed:!!r.theme})}}
  else if(a==="reup")retryUpload(top.id);
  else if(a==="del")delRec(top.id);
  else if(a==="dark"){db.settings.dark=db.settings.dark===false;applyTheme();save();drawSettings()}
  else if(a==="gemInfo")openGem();
  else if(a==="gemSave")gemSave();
  else if(a==="gemOff")gemOff();
  else if(a==="cal")calToggle();
  else if(a==="calFind"){const r=db.records.find(x=>x.id===top.id);if(r)calAttach(r.id,true)}
  else if(a==="gemRetry"){gcfg=null;loadGemini().then(()=>{closeTop();openGem();drawSettings()})}
  else if(a==="tmdb")openTmdb();
  else if(a==="tmdbSave")tmdbSave();
  else if(a==="tmdbOff")tmdbOff();
  else if(a==="trash")openTrash();
  else if(a==="backup")backup();
  else if(a==="install")doInstall();
  else if(a==="help")openHelp();
  else if(a==="logout")logout();
});
["fCam","fAlb"].forEach(id=>$("#"+id).addEventListener("change",e=>{
  const inp=e.target,f=inp.files&&inp.files[0],into=inp.dataset.into==="1",sq=inp.dataset.sq==="1";inp.dataset.into="";inp.dataset.sq="";
  inp.value="";if(!f||!db)return;
  const src=id==="fCam"?"camera":"album";
  if(into&&E){E.square=sq;takeFile(f,src)}else{startEntry(src,f);if(E)E.square=sq}
}));
let qT=null;
document.addEventListener("input",e=>{
  if(e.target.id==="enote"){const p=$("#epen");if(p)p.textContent=capOf({note:e.target.value}).slice(0,48);return}
  if(e.target.id==="cfs"){cancelAnimationFrame(CF.raf);CF.pos=+e.target.value;cfSync();return}
  if(e.target.id==="q"){F.q=e.target.value;clearTimeout(qT);qT=setTimeout(()=>{renderList();reportWhere()},120)}});
document.addEventListener("keydown",e=>{
  const top=LAYERS[LAYERS.length-1];
  if(top&&top.kind==="view"&&(e.key==="ArrowLeft"||e.key==="ArrowRight")&&e.target.tagName!=="INPUT"){e.preventDefault();cfGo(Math.round(CF.pos)+(e.key==="ArrowRight"?1:-1));return}
  if(top&&top.kind==="view"&&e.key==="Enter"&&e.target.tagName!=="INPUT"){const r=CF.list[Math.round(CF.pos)];if(r)openDetail(r.id);return}
  if(!top&&db&&!$("#shoot").hidden&&(e.key===" "||e.key==="Enter")&&e.target===document.body){e.preventDefault();shutter();return}
  if(e.key==="Escape"){const f=document.querySelector(".full");if(f){f.remove();return}if(LAYERS.length)closeTop()}});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
