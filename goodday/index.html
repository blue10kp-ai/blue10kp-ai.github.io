<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>항상일상</title>
<style>
/* 차차차·신한FC m과 같은 디자인 기준(색·글자·버튼·하단 메뉴)을 이 파일 안에 옮겨 둔 것 */
:root{
  --bg:#F4F5F7;--surface:#FFFFFF;--raised:#F0F2F5;--line:rgba(20,30,50,.10);
  --t1:#151A22;--t2:#4B5361;--t3:#6B7382;
  --accent:#1F4E8C;--accent-ink:#FFFFFF;--accent-weak:rgba(31,78,140,.08);
  --ok:#1D7A46;--warn:#A8620B;--bad:#C0392B;--star:#C77F0A;
  --k-video:#4F74A8;--k-place:#B4603A;--k-trip:#3B8A80;--k-daily:#9A8230;--k-other:#6B7382;
  --font:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  --r-ctl:8px;--r-card:12px;--r-panel:16px;
  --ease:cubic-bezier(.2,.8,.2,1);--t-fast:120ms;--t-in:200ms;--navh:60px
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#747C8A;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --ok:#4CC282;--warn:#E0A04A;--bad:#EF7A6C;--star:#E8B04A;
  --k-video:#7FA3D6;--k-place:#E08E66;--k-trip:#6CC0B4;--k-daily:#D2BA5E;--k-other:#A5ADBA}}
:root[data-theme="dark"]{
  --bg:#0F1217;--surface:#171B22;--raised:#1E232B;--line:rgba(255,255,255,.09);
  --t1:#E8EBF0;--t2:#A5ADBA;--t3:#747C8A;
  --accent:#7FAEF0;--accent-ink:#0F1217;--accent-weak:rgba(127,174,240,.12);
  --ok:#4CC282;--warn:#E0A04A;--bad:#EF7A6C;--star:#E8B04A;
  --k-video:#7FA3D6;--k-place:#E08E66;--k-trip:#6CC0B4;--k-daily:#D2BA5E;--k-other:#A5ADBA}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html.lock{overflow:hidden}
html,body{font-family:var(--font);font-size:15px;line-height:1.5;background:var(--bg);color:var(--t1)}
body{margin:0;padding-bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom))}
button,input,select,textarea{font-family:var(--font)}
button{color:inherit;cursor:pointer}
.btn,.rec,.chips button,.seg button,.rowbtn,nav button{transition:background-color var(--t-fast) var(--ease),border-color var(--t-fast) var(--ease),color var(--t-fast) var(--ease),transform var(--t-fast) var(--ease)}
.btn:active,.rec:active{transform:scale(.98)}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
header{position:sticky;top:0;z-index:5;background:var(--surface);color:var(--t1);border-bottom:1px solid var(--line);padding:calc(8px + env(safe-area-inset-top)) 16px 8px;min-height:56px;display:flex;align-items:center;font-size:17px;font-weight:600}
header small{margin-left:auto;font-size:11px;font-weight:500;color:var(--t3)}
header small.fail{color:var(--bad)}
.wrap{padding:16px 16px 0;max-width:640px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:16px;margin-bottom:8px}
.card h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--t3)}
.sub{color:var(--t2);font-size:13px;line-height:1.45}
.k{color:var(--t3);font-size:12px}
.empty{color:var(--t3);text-align:center;padding:28px 0;font-size:14px;line-height:1.6}
.note{font-size:13px;color:var(--t3);margin-top:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 16px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t2);font-size:14px;font-weight:600;line-height:1;white-space:nowrap}
.btn:active{background:var(--raised)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.btn.dng{color:var(--bad)}
.btn.sm{height:28px;padding:0 12px;font-size:12px}
.btn:disabled{opacity:.4}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
label{display:block;font-size:13px;color:var(--t3);margin:16px 0 4px}
input,select,textarea{width:100%;height:44px;padding:0 12px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:var(--r-ctl);background:var(--surface);color:var(--t1)}
textarea{height:auto;padding:8px 12px;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.inl{display:flex;gap:8px}.inl>*{flex:1;min-width:0}
.seg{display:flex;gap:2px;background:var(--raised);border-radius:var(--r-ctl);padding:2px}
.seg button{flex:1;min-height:34px;padding:0 8px;border:0;border-radius:6px;background:none;color:var(--t2);font-size:13px;font-weight:500}
.seg button.on{background:var(--surface);color:var(--t1);box-shadow:0 0 0 1px var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:34px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 12px;font-size:13px;color:var(--t2)}
.chips button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-weak);font-weight:600}
/* 기록 카드 */
.dh{font-size:13px;font-weight:500;color:var(--t2);margin:20px 4px 8px}
.dh:first-child{margin-top:0}
.rec{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);padding:12px 16px;margin-bottom:8px}
.rec:active{background:var(--raised)}
.rec .top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t3)}
.rec .top .kd{font-weight:500;color:var(--t2);display:inline-flex;align-items:center;gap:8px}
.kdot{display:inline-block;vertical-align:middle;margin-right:4px;width:8px;height:8px;border-radius:50%;background:var(--kc,var(--k-other));flex:none}
.kdot.video{--kc:var(--k-video)}.kdot.place{--kc:var(--k-place)}.kdot.trip{--kc:var(--k-trip)}.kdot.daily{--kc:var(--k-daily)}
.rec .top .st{margin-left:auto}
.rec .tt{font-size:16px;font-weight:600;margin:4px 0 0;word-break:break-word}
.rec .nt{font-size:13px;color:var(--t2);margin-top:4px;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rec .tg{margin-top:8px;font-size:12px;color:var(--accent)}
.st{color:var(--star);letter-spacing:1px;font-size:13px;white-space:nowrap}
.trash{opacity:.9}
/* 오늘 한 줄 */
.today{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.today .d{font-size:32px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.today .m{font-size:13px;color:var(--t3)}
.quick form{display:flex;gap:8px}.quick input{flex:1}
.quick .btn{height:44px}
/* 하단 메뉴 */
nav{position:fixed;left:0;right:0;bottom:0;z-index:12;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:0 8px max(0px,calc(env(safe-area-inset-bottom) - 10px))}
nav button{flex:1;min-height:var(--navh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:0;background:none;position:relative;font-size:11px;font-weight:500;color:var(--t3)}
nav .ni{display:block;line-height:0}
nav .ni svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--accent)}
nav button.on::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
nav .plus .pc{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;margin-top:-12px;box-shadow:0 0 0 4px var(--surface)}
nav .plus .pc svg{width:24px;height:24px;stroke:currentColor;stroke-width:2}
nav .plus{color:var(--accent)}
nav .plus span.l{margin-top:-2px}
/* 입력 창(시트) */
.modal{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--t1);border-radius:20px 20px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.18);width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;padding:8px 16px calc(16px + env(safe-area-inset-bottom));animation:up var(--t-in) var(--ease)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:3px;background:var(--t3);opacity:.5;margin:2px auto 12px}
.sheet h3{margin:0 0 4px;font-size:18px;font-weight:600;word-break:break-word}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet .acts.stk{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--surface);padding:12px 0 calc(16px + env(safe-area-inset-bottom));margin-bottom:calc(-16px - env(safe-area-inset-bottom))}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1;color:var(--t3)}
.stars button.on{color:var(--star)}
.kv{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.kv .a{flex:0 0 84px;color:var(--t3);font-size:13px}.kv .b{flex:1;word-break:break-word}
.kv a{color:var(--accent)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .t{font-weight:500}.row .r{text-align:right;color:var(--t3);font-size:13px}
.rowbtn{display:flex;width:100%;justify-content:space-between;align-items:center;padding:12px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;font-size:15px;font-weight:500}
.rowbtn:first-child{border-top:0}
.rowbtn .r{color:var(--t3);font-size:13px;font-weight:400}
.sec{font-size:13px;font-weight:500;color:var(--t2);margin:20px 4px 8px}
.toast{position:fixed;left:16px;right:16px;bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom));z-index:30;max-width:420px;margin:0 auto;background:var(--t1);color:var(--bg);border-radius:var(--r-ctl);padding:12px 16px;font-size:14px;display:flex;align-items:center;gap:12px;animation:up var(--t-in) var(--ease)}
.toast button{margin-left:auto;border:0;background:none;color:var(--bg);font-weight:700;font-size:14px;text-decoration:underline}
.back{border:0;background:none;color:var(--accent);font-size:14px;font-weight:600;padding:4px 0;margin-bottom:8px}
.demo{font-size:11px;color:var(--warn);margin-left:8px;font-weight:500}
[hidden]{display:none!important}
/* 말만해요 안(embed): 위·아래 메뉴 없이 그 페이지만, 위쪽은 말만해요 플로팅 버튼 자리 56px */
html.embed header,html.embed nav{display:none!important}
html.embed body{padding-top:56px;padding-bottom:calc(104px + env(safe-area-inset-bottom))} /* 오른쪽 아래 88px는 말만해요 버튼 자리 */
html.embed .toast{bottom:calc(88px + env(safe-area-inset-bottom))} /* 오른쪽 아래 말만해요 버튼(56px) 위로 */
/* 로그인 화면: 차차차와 같은 모양 */
.login{max-width:360px;margin:16vh auto 0;padding:0 24px;text-align:center}
.login h1{font-size:28px;font-weight:700;margin:0 0 4px;letter-spacing:-.5px}
.login p{margin:0 0 24px;color:var(--t2);font-size:14px}
.login .btn{width:100%;height:44px;font-size:15px;margin-top:8px}
.login .lm{min-height:22px;margin:0 0 12px;font-size:13px;color:var(--t3)}
.login .lm.err{color:var(--bad)}
.login .hint{margin-top:20px;font-size:12px;color:var(--t3)}
</style>
</head>
<body>
<section id="login" class="login">
  <h1>항상일상</h1>
  <p>나의 일상 기록장</p>
  <div class="lm" id="lmsg">확인 중…</div>
  <button class="btn pri" id="loginBtn" hidden>Google 계정으로 로그인</button>
  <button class="btn" id="loginOtherBtn" hidden>다른 계정으로 로그인</button>
</section>
<header id="title" hidden><span>항상일상</span><span class="demo" id="demoTag" hidden>체험 모드</span><small id="sync"></small></header>
<div class="wrap" id="main" hidden></div>
<nav id="nav" hidden></nav>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ===== 설정 (여기만 고치면 됩니다) ===== */
const ALLOWED=["blue10kp@gmail.com"]; // 로그인을 허용할 구글 계정 (소문자로, 여러 명이면 쉼표로 추가). 화면 보호용이며, 실제 보호는 각자의 Google Drive 권한입니다.
const GCLIENT="482206908404-5sdbvetcrc8j7ctrhe6aa23ccmd3d05d.apps.googleusercontent.com"; // 구글 로그인 클라이언트 ID (차차차와 같은 값, 공개되어도 되는 값)
const GSCOPE="openid email https://www.googleapis.com/auth/drive.file"; // 이 앱이 만든 파일만 접근 (Drive 전체 권한 아님)
const GPICKER_KEY=""; // 파일 선택 창(Google Picker)용 브라우저 API 키. 사용자가 구글 클라우드에서 발급해 여기에 붙여 넣음(출처 제한 키는 공개되어도 됨). 비어 있으면 받은편지함 연결은 "준비 중"으로 보임
const GPROJECT="482206908404"; // 구글 클라우드 프로젝트 번호(클라이언트 ID 앞 숫자)
const DRIVE_PATH=["goodday"],DRIVE_FILE="goodday_기록.json"; // 각자의 내 드라이브 안 저장 위치
const VER="1단계 (2026-11-14)";
/* ===== 끝 ===== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>iso(new Date());
const WD="일월화수목금토";
const EMBED=/[?&]embed=1(&|$)/.test(location.search); // 말만해요 안에 끼워 보일 때(로그아웃 숨김, 로그인 화면 대신 안내)
if(EMBED)document.documentElement.classList.add("embed");
const DEMO=/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&/[?&]demo=1/.test(location.search); // 내 컴퓨터에서 화면 확인용(구글 로그인·Drive 저장 없음)
/* localStorage는 막힐 수 있어 항상 감쌈 (화면 모드·파일 번호 같은 기기 편의 값만 둠. 기록은 두지 않음) */
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};

/* ---------- 기본 종류 ---------- */
const BASE=[
 {id:"video",name:"영상·음악",noteLabel:"한 줄 감상",fields:[
  {k:"type",l:"구분",t:"sel",o:["영화","드라마","공연","음악","기타"]},
  {k:"where",l:"본 곳·들은 곳",t:"text",ph:"극장, 넷플릭스…"},
  {k:"with",l:"함께한 사람",t:"text"}]},
 {id:"place",name:"맛집·장소",noteLabel:"한 줄 메모",fields:[
  {k:"addr",l:"주소",t:"text"},
  {k:"map",l:"지도 링크",t:"url",ph:"지도 앱에서 공유한 링크를 붙여 넣기"},
  {k:"menu",l:"먹은 메뉴",t:"text"},
  {k:"price",l:"가격(원)",t:"num"},
  {k:"again",l:"또 갈까요",t:"sel",o:["또 갈래요","글쎄요","다시는 안 가요"]}]},
 {id:"trip",name:"여행",noteLabel:"한 줄 메모",fields:[
  {k:"region",l:"지역",t:"text"},
  {k:"start",l:"시작일",t:"date"},
  {k:"end",l:"끝난 날",t:"date"}]},
 {id:"daily",name:"일상",noteLabel:"오늘의 한 줄",fields:[
  {k:"mood",l:"기분",t:"sel",o:["좋음","괜찮음","그저 그럼","별로"]}]}
];
const CUSTOM_FIELDS=[{k:"detail",l:"자세히",t:"area"}];

/* ---------- 자료 모양 ---------- */
let db=null,dirty=false,me="";
function norm(d){
  d=d&&typeof d==="object"?d:{};d.v=1;
  d.records=Array.isArray(d.records)?d.records:[];
  const s=d.settings=d.settings&&typeof d.settings==="object"?d.settings:{};
  s.stars=s.stars==="num"?"num":"star";
  s.theme=["auto","light","dark"].includes(s.theme)?s.theme:"auto";
  s.hidden=Array.isArray(s.hidden)?s.hidden:[];
  s.custom=Array.isArray(s.custom)?s.custom:[];
  s.lastKind??="";
  s.inboxFile=s.inboxFile&&typeof s.inboxFile.id==="string"?{id:s.inboxFile.id,name:String(s.inboxFile.name||"")}:null;
  d.records.forEach(r=>{r.tags=Array.isArray(r.tags)?r.tags:[];r.x=r.x&&typeof r.x==="object"?r.x:{};r.rating=+r.rating||0;r.note??="";r.date??=""});
  const lim=Date.now()-30*864e5; // 휴지통은 30일 뒤 자동 정리
  d.records=d.records.filter(r=>!(r.del&&r.del<lim));
  return d;
}
const allKinds=()=>[...BASE,...db.settings.custom.map(c=>({id:c.id,name:c.name,noteLabel:"한 줄 메모",fields:CUSTOM_FIELDS,custom:true}))];
const kindOf=id=>allKinds().find(k=>k.id===id)||{id,name:"(없어진 종류)",noteLabel:"한 줄 메모",fields:[]};
const visKinds=()=>allKinds().filter(k=>!db.settings.hidden.includes(k.id));
const live=()=>db.records.filter(r=>!r.del);
const sortRecs=a=>a.sort((x,y)=>(y.date||"").localeCompare(x.date||"")||(y.upd||0)-(x.upd||0));
function seedDemo(){
  const t=new Date(),d=n=>{const x=new Date(t);x.setDate(x.getDate()-n);return iso(x)},now=Date.now();

/* ---------- 구글 로그인 (차차차와 같은 방식: Google Identity Services 토큰) ---------- */
const GTK="goodday.gtoken",GAC="goodday.gaccount",FID_KEY="goodday.fid"; // GTK = 예전 전용 토큰(한 번 공통 출입증으로 옮김)
const GA="blue10kp.gauth"; // 공통 출입증: 모든 앱이 같이 쓰는 이름 (app\_공통\공통로그인.md)
const DRIVEFILE="https://www.googleapis.com/auth/drive.file";
const SUPER={"https://www.googleapis.com/auth/drive.file":["https://www.googleapis.com/auth/drive"]};
let gTok=null,pend=null,gaSeen=false;
const allowedEm=e=>ALLOWED.map(x=>x.toLowerCase()).includes(String(e||"").toLowerCase());
const hasScope=(sc,need)=>sc.includes(need)||(SUPER[need]||[]).some(x=>sc.includes(x));
function readGa(){try{const g=JSON.parse(lsGet(GA)||"null");return g&&g.v===1&&typeof g.token==="string"&&+g.exp&&Array.isArray(g.scopes)?g:null}catch(e){return null}}
function writeGa(token,exp,scopes,email){lsSet(GA,JSON.stringify({v:1,token,exp,scopes,email:email||""}));gaSeen=!!readGa()}
const gaFresh=g=>!!g&&g.exp>Date.now()+120000; // 만료까지 2분 이상
const gaScopeOk=g=>!!g&&hasScope(g.scopes,DRIVEFILE);
function storedTok(){const g=readGa();return gaFresh(g)&&gaScopeOk(g)?g.token:null}
function clearTok(t){const g=readGa();if(g&&(!t||g.token===t))lsDel(GA);gTok=null}
function migrateOld(){ // 예전 전용 토큰을 공통 출입증으로 한 번 옮김
  try{
    const o=JSON.parse(lsGet(GTK)||"null");
    if(o&&o.token&&o.exp>Date.now()+120000&&!readGa()&&gAcct())writeGa(o.token,o.exp,["openid","email",DRIVEFILE],gAcct());
  }catch(e){}
  lsDel(GTK);
}
const gAcct=()=>{const g=readGa();return(g&&g.email)||lsGet(GAC)||""};
function requestTok(prompt,noHint){
  return new Promise((res,rej)=>{
    const g=window.google&&google.accounts&&google.accounts.oauth2;
    if(!g)return rej(new Error("구글 로그인 모듈을 불러오지 못했습니다. 잠시 후 다시 시도하세요."));
    const c=g.initTokenClient({client_id:GCLIENT,scope:GSCOPE,include_granted_scopes:true,hint:noHint?undefined:(gAcct()||undefined),
      callback:r=>{
        if(r.error)return rej(new Error("구글 연결 실패: "+r.error));
        const sc=String(r.scope||"").split(/\s+/).filter(Boolean);
        if(!hasScope(sc,DRIVEFILE))return rej(new Error("Google Drive 권한을 허용해야 합니다. 다시 로그인하면서 모든 항목에 체크해 주세요."));
        pend={exp:Date.now()+(r.expires_in||3600)*1000,scopes:sc};
        gTok=r.access_token;res(r.access_token);
      },
      error_callback:e=>rej(new Error(e&&e.type==="popup_closed"?"구글 로그인 창이 닫혔습니다.":"구글 로그인 창을 열 수 없습니다. 팝업 차단을 확인하세요."))});
    c.requestAccessToken({prompt:prompt==null?"":prompt});
  });

async function gfetch(url,opt,asText,retry){
  const t=gTok||storedTok();if(!t)throw new Error("GOOGLE_AUTH");
  const o=opt||{},r=await fetch(url,{...o,headers:{Authorization:"Bearer "+t,...(o.headers||{})},cache:"no-store"});
  if(r.status===401){
    const n=storedTok();
    if(n&&n!==t&&!retry){gTok=n;return gfetch(url,opt,asText,true)} // 다른 앱에서 새로 로그인했으면 그 토큰으로 이어서
    clearTok(t);throw new Error("GOOGLE_AUTH");
  }
  if(!r.ok)throw new Error("Drive "+r.status+": "+(await r.text()).slice(0,160));
  return asText?r.text():r.json();
}
/* 화면이 다시 보일 때 공통 출입증을 다시 읽음: 다른 앱에서 로그인했으면 이어 쓰고, 로그아웃했으면 함께 로그아웃 */

      if(me&&g.email.toLowerCase()!==me.toLowerCase()){ // 다른 앱에서 다른 계정으로 바꿈
        if(dirty)return;
        lsSet(GAC,g.email.toLowerCase());lsDel(FID_KEY);db=null;fileId=null;folderId=null;lastMod=null;me=g.email.toLowerCase();gTok=g.token;inbox=[];
        startApp().catch(e=>showLogin(e.message==="GOOGLE_AUTH"?"":"기록을 불러오지 못했어요. ("+String(e.message).slice(0,60)+")"));
        return;
      }
      gTok=g.token;
    }
    return;
  }
  if(gaSeen&&!dirty){ // 다른 앱에서 로그아웃함
    gaSeen=false;gTok=null;db=null;fileId=null;folderId=null;lastMod=null;me="";inbox=[];

}

    if(!f){if(!create)return null;f=await gfetch(DAPI+"/files?fields=id",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n,mimeType:"application/vnd.google-apps.folder",parents:[id]})})}
    id=f.id;
  }
  return folderId=id;
}
const cachedFid=()=>{try{return JSON.parse(lsGet(FID_KEY)||"null")}catch(e){return null}};
const cacheFid=()=>lsSet(FID_KEY,JSON.stringify({file:fileId,folder:folderId,acct:gAcct()}));
const parseDoc=t=>JSON.parse(t.replace(/^﻿/,""));
async function loadDrive(){ // 드라이브의 기록 파일 → 객체 (없으면 null)
  const c=cachedFid();
  if(c&&c.file&&c.acct===gAcct()){
    try{
      const [meta,txt]=await Promise.all([gfetch(DAPI+"/files/"+c.file+"?fields=modifiedTime,trashed"),gfetch(DAPI+"/files/"+c.file+"?alt=media",null,true)]);
      if(!meta.trashed){fileId=c.file;folderId=c.folder||null;lastMod=meta.modifiedTime;return parseDoc(txt)}
    }catch(e){if(e.message==="GOOGLE_AUTH")throw e}
  }
  const fo=await dFolder(false);if(!fo)return null;
  const f=await dFind(fo,DRIVE_FILE,false);if(!f)return null;
  fileId=f.id;lastMod=f.modifiedTime;cacheFid();
  return parseDoc(await gfetch(DAPI+"/files/"+f.id+"?alt=media",null,true));
}
function setSync(st){
  const el=$("#sync");if(!el)return;
  const t=new Date(),hm=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
  el.className=st==="fail"?"fail":"";
  el.textContent=st==="saving"?"저장 중…":st==="ok"?"저장됨 "+hm:st==="fail"?"저장 안 됨 (다시 시도 중)":"";
  if(view==="set"&&$("#syncRow"))$("#syncRow").textContent=el.textContent||"–";

function save(){ // 기록이 바뀔 때마다 부름 → 잠시 뒤 드라이브에 저장

async function driveSave(force){
  if(DEMO||!db||!dirty&&!force)return;
  if(saving){again=true;return}
  saving=true;clearTimeout(retryT);
  try{
    if(!fileId){const fo0=await dFolder(true),f=await dFind(fo0,DRIVE_FILE,false);if(f){fileId=f.id;lastMod=f.modifiedTime;cacheFid()}}
    const body=JSON.stringify(db);let meta;
    if(fileId){
      if(!force){
        const cur=await gfetch(DAPI+"/files/"+fileId+"?fields=modifiedTime");
        if(lastMod&&cur.modifiedTime!==lastMod&&!confirm("다른 기기에서 기록이 바뀌었어요.\n확인 = 지금 화면의 기록으로 덮어쓰기\n취소 = 드라이브에 있는 기록 불러오기")){
          const d=await loadDrive();if(d){db=norm(d);dirty=false;setSync("ok");applyTheme();render()}return;
        }
      }
      meta=await gfetch(DUP+"/files/"+fileId+"?uploadType=media&fields=id,modifiedTime",{method:"PATCH",headers:{"Content-Type":"application/json"},body});
    }else{
      const fo=await dFolder(true),bd="gd"+uid();
      const mp="--"+bd+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:DRIVE_FILE,parents:[fo],mimeType:"application/json"})+"\r\n--"+bd+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+bd+"--";
      meta=await gfetch(DUP+"/files?uploadType=multipart&fields=id,modifiedTime",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+bd},body:mp});
      fileId=meta.id;cacheFid();
    }
    lastMod=meta.modifiedTime;dirty=false;setSync("ok");
  }catch(e){
    setSync("fail");
    if(e.message==="GOOGLE_AUTH")showLogin("로그인이 만료되었습니다. 다시 로그인하면 저장되지 않은 기록이 자동으로 저장됩니다.");
    else retryT=setTimeout(()=>driveSave(),15000);
  }finally{saving=false;if(again){again=false;driveSave()}}
}

async function checkAccount(){
  const u=await gfetch("https://www.googleapis.com/oauth2/v3/userinfo");

  if(!em)throw new Error("구글 계정 이메일을 읽지 못했습니다.");
  return{em,ok:ALLOWED.map(x=>x.toLowerCase()).includes(em)&&u.email_verified!==false};

async function afterToken(){
  const a=await checkAccount();
  if(!a.ok){await denyAccount(a.em);return}
  const changed=gAcct()&&gAcct()!==a.em;
  lsSet(GAC,a.em);me=a.em;
  if(pend&&gTok)writeGa(gTok,pend.exp,pend.scopes,a.em);

function dlabel(d){

const safeUrl=u=>/^https?:\/\//i.test(String(u||"").trim())?String(u).trim():"";

   <button class="rowbtn" data-act="kinds"><span>종류 관리</span><span class="r">${visKinds().length}개 사용 중 ›</span></button>
   <label style="margin-top:8px">별점 방식</label>${seg("stars",s.stars,[["star","별 5개"],["num","10점"]])}
   <label>화면 모드</label>${seg("theme",s.theme,[["auto","자동"],["light","라이트"],["dark","다크"]])}</div>
  <div class="card"><h3>내 기록</h3>
   <button class="rowbtn" data-act="exp" data-f="json"><span>내보내기 (JSON)</span><span class="r">백업용 ›</span></button>
   <button class="rowbtn" data-act="exp" data-f="csv"><span>내보내기 (엑셀용 표)</span><span class="r">엑셀에서 열기 ›</span></button>
   <button class="rowbtn" data-act="inboxOpen"><span>말만해요 받은편지함</span><span class="r">${s.inboxFile?(inbox.length?inbox.length+"통 대기":"연결됨"):"연결 안 됨"} ›</span></button>
   <button class="rowbtn" data-act="trash"><span>휴지통</span><span class="r">${trash}개 ›</span></button></div>
  <div class="card"><h3>도움</h3>
   <button class="rowbtn" data-act="help"><span>사용 설명서</span><span class="r">›</span></button>
   ${EMBED?"":`<button class="rowbtn" data-act="logout"><span style="color:var(--bad)">로그아웃</span></button>`}</div>
  <div class="note" style="text-align:center">항상일상 · ${VER}</div>`;
}

/* ---------- 시트(아래에서 올라오는 창) ---------- */
function openSheet(html){$("#modal").innerHTML=`<div class="modal" data-act="bg"><div class="sheet">${html}</div></div>`;document.documentElement.classList.add("lock");schedLift();reportWhere()}
function closeSheet(){$("#modal").innerHTML="";document.documentElement.classList.remove("lock");F=null;curRec=null;fabLift();reportWhere()}
let toastT=null,toastUndo=null;
function toast(msg,undo){
  const el=$("#toast");toastUndo=undo||null;
  el.innerHTML=`<span>${esc(msg)}</span>${undo?`<button data-act="undo">되돌리기</button>`:""}`;el.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true;toastUndo=null},undo?6000:2200);
}

/* ---------- 기록 등록·수정 ---------- */
let F=null; // 입력 중인 기록
const parseTags=s=>[...new Set(String(s||"").split(/[,\s]+/).map(t=>t.replace(/^#+/,"").trim()).filter(Boolean))].slice(0,12);
function openForm(rec,kind){
  const vk=visKinds().map(k=>k.id);
  let k0=rec?rec.kind:(kind||(vk.includes(db.settings.lastKind)?db.settings.lastKind:vk[0])||"daily");
  F={id:rec?rec.id:null,kind:k0,v:rec?{title:rec.title,date:rec.date,note:rec.note,rating:rec.rating||0,tags:rec.tags.join(", "),x:{...rec.x}}:{title:"",date:today(),note:"",rating:0,tags:"",x:{}}};
  drawForm();
}
function readForm(){
  if(!F||!$("#f_title"))return;
  F.v.title=$("#f_title").value;F.v.date=$("#f_date").value;F.v.note=$("#f_note").value;F.v.tags=$("#f_tags").value;
  if($("#f_rate"))F.v.rating=+$("#f_rate").value||0;
  kindOf(F.kind).fields.forEach(f=>{const el=$("#fx_"+f.k);if(el)F.v.x[f.k]=el.value});
}
function drawForm(){
  const k=kindOf(F.kind),vs=visKinds();
  const kinds=vs.some(x=>x.id===F.kind)?vs:[...vs,k];
  const rate=db.settings.stars==="num"?
   `<select id="f_rate"><option value="0">안 매김</option>${Array.from({length:10},(_,i)=>`<option value="${i+1}"${F.v.rating===i+1?" selected":""}>${i+1}점</option>`).join("")}</select>`:
   `<div class="stars" id="f_stars">${[1,2,3,4,5].map(n=>`<button type="button" data-act="star" data-n="${n}" class="${F.v.rating>=n*2-1&&F.v.rating>0?"on":""}" aria-label="별 ${n}개">★</button>`).join("")}</div>`;
  const extra=k.fields.map(f=>{
    const v=F.v.x[f.k]??"",id="fx_"+f.k;
    if(f.t==="sel")return`<label for="${id}">${f.l}</label><select id="${id}"><option value="">선택 안 함</option>${f.o.map(o=>`<option${o===v?" selected":""}>${esc(o)}</option>`).join("")}</select>`;
    if(f.t==="area")return`<label for="${id}">${f.l}</label><textarea id="${id}" rows="3">${esc(v)}</textarea>`;
    return`<label for="${id}">${f.l}</label><input id="${id}" type="${f.t==="num"?"number":f.t==="date"?"date":f.t==="url"?"url":"text"}"${f.t==="num"?' inputmode="numeric" min="0"':""} value="${esc(v)}" placeholder="${esc(f.ph||"")}" autocomplete="off">`;
  }).join("");
  openSheet(`<h3>${F.id?"기록 고치기":"기록하기"}</h3>
   <label>종류</label><div class="chips">${kinds.map(x=>`<button type="button" data-act="fk" data-id="${x.id}" class="${x.id===F.kind?"on":""}">${esc(x.name)}</button>`).join("")}</div>
   <label for="f_title">제목 (꼭 필요한 칸)</label><input id="f_title" value="${esc(F.v.title)}" maxlength="120" autocomplete="off" placeholder="예: 성수 칼국수집, 오늘의 영화">
   <label for="f_note">${esc(k.noteLabel)}</label><input id="f_note" value="${esc(F.v.note)}" maxlength="300" autocomplete="off">
   <label>별점</label>${rate}
   <label for="f_date">날짜</label><input id="f_date" type="date" value="${esc(F.v.date)}">
   <label for="f_tags">태그 (쉼표나 띄어쓰기로 구분)</label><input id="f_tags" value="${esc(F.v.tags)}" autocomplete="off" placeholder="예: 가족, 점심">
   ${extra}
   <div class="acts stk"><button class="btn" data-act="close">취소</button><button class="btn pri" data-act="saveRec">저장</button></div>`);
  if(!F.id&&!F.v.title)setTimeout(()=>{const t=$("#f_title");if(t)t.focus()},50);
}
function saveRec(){
  readForm();
  const t=F.v.title.trim();
  if(!t){toast("제목을 적어 주세요");const el=$("#f_title");if(el)el.focus();return}
  const now=Date.now(),k=kindOf(F.kind);
  let r=F.id&&db.records.find(x=>x.id===F.id);
  if(!r){r={id:uid(),ts:now};db.records.push(r)}
  const x={};k.fields.forEach(f=>{const v=String(F.v.x[f.k]??"").trim();if(v)x[f.k]=v});
  Object.assign(r,{kind:F.kind,date:F.v.date||today(),title:t,note:F.v.note.trim(),rating:+F.v.rating||0,tags:parseTags(F.v.tags),x,upd:now});
  delete r.del;
  db.settings.lastKind=F.kind;
  save();closeSheet();render();toast("저장했어요");
}
function openDetail(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  const k=kindOf(r.kind);curRec=id;reportWhere();
  const kv=(a,b)=>b?`<div class="kv"><div class="a">${a}</div><div class="b">${b}</div></div>`:"";
  openSheet(`<div class="k" style="display:flex;align-items:center;gap:8px"><i class="kdot ${esc(r.kind)}"></i>${esc(k.name)}${r.del?" · 휴지통":""}</div><h3>${esc(r.title)}</h3>
   <div class="sub">${esc(dlabel(r.date).replace("오늘 · ",""))} <span class="st">${ratingTxt(r.rating)}</span></div>
   <div style="margin-top:12px">${kv(esc(k.noteLabel),esc(r.note))}${k.fields.map(f=>kv(f.l,fieldVal(f,r.x[f.k]))).join("")}${kv("태그",r.tags.map(t=>"#"+esc(t)).join(" "))}${kv("출처",esc(r.src||""))}</div>
   <div class="acts">${r.del?`<button class="btn" data-act="close">닫기</button><button class="btn pri" data-act="restore" data-id="${r.id}">되살리기</button>`:
   `<button class="btn dng" data-act="del" data-id="${r.id}">삭제</button><button class="btn" data-act="close">닫기</button><button class="btn pri" data-act="edit" data-id="${r.id}">고치기</button>`}</div>`);
}
function delRec(id){
  const r=db.records.find(x=>x.id===id);if(!r)return;
  r.del=Date.now();save();closeSheet();render();
  toast("휴지통으로 옮겼어요 (30일간 보관)",()=>{r.del=null;delete r.del;save();render()});
}

/* ---------- 설정 안의 창들 ---------- */
function openKinds(){
  const hid=db.settings.hidden;
  openSheet(`<h3>종류 관리</h3><div class="sub">안 쓰는 종류는 숨기고, 책·운동처럼 나만의 종류를 더할 수 있어요. 숨겨도 기존 기록은 그대로 보입니다.</div>
   <div style="margin-top:8px">${allKinds().map(k=>`<div class="row"><span class="t">${esc(k.name)}${k.custom?' <span class="k">(내가 추가)</span>':""}</span><span>
     <button class="btn sm" data-act="khide" data-id="${k.id}">${hid.includes(k.id)?"다시 보이기":"숨기기"}</button>${k.custom?` <button class="btn sm dng" data-act="kdel" data-id="${k.id}">삭제</button>`:""}</span></div>`).join("")}</div>
   <label for="knew">새 종류 이름</label><div class="inl"><input id="knew" maxlength="12" placeholder="예: 책, 운동" autocomplete="off"><button class="btn pri" style="flex:0 0 72px;height:42px" data-act="kadd">추가</button></div>
   <div class="acts"><button class="btn" data-act="close">닫기</button></div>`);
}
function openTrash(){
  const arr=db.records.filter(r=>r.del).sort((a,b)=>b.del-a.del);
  openSheet(`<h3>휴지통</h3><div class="sub">지운 기록은 30일 동안 여기 남고, 그 뒤 저절로 정리돼요.</div>
   <div style="margin-top:12px">${arr.length?arr.map(r=>`<div class="row"><span class="t" style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.title)}<br><span class="k">${esc(kindOf(r.kind).name)} · ${esc(r.date)}</span></span><span style="white-space:nowrap"><button class="btn sm" data-act="restore" data-id="${r.id}" data-keep="1">되살리기</button> <button class="btn sm dng" data-act="purge" data-id="${r.id}">완전 삭제</button></span></div>`).join(""):`<div class="empty">휴지통이 비어 있어요.</div>`}</div>
   <div class="acts"><button class="btn" data-act="close">닫기</button>${arr.length?`<button class="btn dng" data-act="purgeall">모두 비우기</button>`:""}</div>`);
}
function openHelp(){
  openSheet(`<h3>사용 설명서</h3><div class="sub" style="line-height:1.7">
   <b>기록하기</b><br>아래 가운데 ＋ 를 누르고 종류와 제목만 적으면 저장돼요. 한 줄 메모, 별점, 태그, 종류별 칸은 나중에 기록을 눌러 고치면서 채워도 됩니다.<br><br>
   <b>찾기</b><br>글자로 찾고, 종류·별점·기간·태그로 좁힐 수 있어요.<br><br>
   <b>여행</b><br>‘여행’ 종류로 이름과 시작일·끝난 날을 적어 두면, 그 기간에 쓴 기록이 날짜별로 모여 보여요.<br><br>
   <b>지우기</b><br>지운 기록은 설정의 휴지통에서 30일 동안 되살릴 수 있어요.<br><br>
   <b>내 기록은 어디에?</b><br>내 Google Drive의 goodday 폴더에 저장되며, 다른 사람은 볼 수 없어요. 이 앱은 앱이 만든 파일만 열 수 있는 권한만 씁니다.<br><br>
   <b>말만해요에서 바로 찾기</b><br>말만해요에서 "맛집 검색해줘"처럼 말하면 말만해요 화면 안에 항상일상의 찾기 결과가 끼워져 나와요. 말만해요 안에서는 그 화면만 보이고, 뒤로가기는 왼쪽 위 버튼으로 해요. 말만해요의 [앱으로 열기]를 누르면 보던 화면 그대로 항상일상이 열립니다.<br><br>
   <b>한 번 로그인하면 다른 앱도 함께</b><br>같은 브라우저에서 내 다른 앱(신한FC, 차차차 등)에 로그인했다면 항상일상도 로그인 화면 없이 바로 열려요. 로그아웃하면 모든 앱에서 함께 로그아웃됩니다. 로그인은 한 시간마다 다시 필요할 수 있어요. 아이폰 홈 화면 앱은 앱마다 따로라 서로 나눠 쓰지 못해요.<br><br>
   <b>함께 쓰려면</b><br>허용된 계정만 로그인할 수 있어요. 쓸 사람을 추가하려면 앱을 관리하는 사람에게 구글 계정(이메일)을 알려 주세요.<br><br>
   <b>말만해요 받은편지함</b><br>설정에서 받은편지함 파일을 한 번 고르면, 말만해요가 보낸 쪽지가 앱을 열 때 카드로 나타나요. 기록에 넣기를 누르면 기록이 되고 쪽지는 처리 완료로 표시됩니다.<br><br>
   <b>다음에 더해질 기능</b><br>사진 붙이기, 여행 묶음 편집, 지도 보기, 영화·장소 정보 자동 채우기.</div>
   <div class="acts"><button class="btn" data-act="close">닫기</button></div>`);
}

/* ---------- 내보내기 ---------- */
function dl(name,mime,text){
  const b=new Blob([text],{type:mime}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
function exportData(f){
  const stamp=today().replace(/-/g,"");
  if(f==="json"){dl("항상일상_"+stamp+".json","application/json",JSON.stringify(db,null,1));toast("JSON 파일을 내려받았어요");return}
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  const rows=[["날짜","종류","제목","한 줄","별점(10점 기준)","태그","자세한 내용"]];
  sortRecs(live().slice()).forEach(r=>{const k=kindOf(r.kind);rows.push([r.date,k.name,r.title,r.note,r.rating||"",r.tags.join(" "),k.fields.map(fl=>r.x[fl.k]?fl.l+": "+r.x[fl.k]:"").filter(Boolean).join(" / ")])});
  dl("항상일상_"+stamp+".csv","text/csv;charset=utf-8","﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n"));
  toast("엑셀용 표(CSV)를 내려받았어요");
}

/* ---------- 눌렀을 때 ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");if(!el||!db)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==="bg"){if(e.target===el)closeSheet();return}
  if(a==="tab"){view=el.dataset.v;tripOpen=null;render();scrollTo(0,0)}
  else if(a==="new"){openForm(null,el.dataset.kind)}
  else if(a==="open")openDetail(id);
  else if(a==="more"){limit+=30;render()}
  else if(a==="close")closeSheet();
  else if(a==="edit"){const r=db.records.find(x=>x.id===id);closeSheet();if(r)openForm(r)}
  else if(a==="del")delRec(id);
  else if(a==="restore"){const r=db.records.find(x=>x.id===id);if(r){delete r.del;save();toast("되살렸어요");if(el.dataset.keep)openTrash();else closeSheet();render()}}
  else if(a==="undo"){if(toastUndo)toastUndo();$("#toast").hidden=true;toastUndo=null}
  else if(a==="fk"){readForm();F.kind=id;drawForm()}
  else if(a==="star"){readForm();const n=+el.dataset.n;F.v.rating=F.v.rating===n*2?0:n*2;drawForm()}
  else if(a==="saveRec")saveRec();
  else if(a==="fkind"){S.kind=id;$("#fk").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.id===S.kind));updateResults()}
  else if(a==="ftag"){S.tag=S.tag===el.dataset.t?"":el.dataset.t;$("#ft").querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.tag));updateResults()}
  else if(a==="trip"){tripOpen=id;render();scrollTo(0,0)}
  else if(a==="tripBack"){tripOpen=null;render()}
  else if(a==="stars"){db.settings.stars=el.dataset.v;save();render()}
  else if(a==="theme"){db.settings.theme=el.dataset.v;applyTheme();save();render()}
  else if(a==="kinds")openKinds();
  else if(a==="khide"){
    const h=db.settings.hidden,i=h.indexOf(id);
    if(i>=0)h.splice(i,1);else if(visKinds().length<=1){toast("종류가 하나는 보여야 해요");return}else h.push(id);
    save();openKinds();render();
  }
  else if(a==="kadd"){
    const n=($("#knew").value||"").trim();if(!n){toast("이름을 적어 주세요");return}
    if(allKinds().some(k=>k.name===n)){toast("이미 있는 이름이에요");return}
    db.settings.custom.push({id:"c"+uid(),name:n});save();openKinds();
  }
  else if(a==="kdel"){
    const n=db.records.filter(r=>r.kind===id).length;
    if(n){toast("기록이 "+n+"개 있어요. 삭제 대신 숨기기를 써 주세요");return}
    if(confirm("이 종류를 삭제할까요?")){db.settings.custom=db.settings.custom.filter(c=>c.id!==id);db.settings.hidden=db.settings.hidden.filter(x=>x!==id);save();openKinds()}
  }
  else if(a==="exp")exportData(el.dataset.f);
  else if(a==="trash")openTrash();
  else if(a==="purge"){if(confirm("이 기록을 완전히 지울까요? 되돌릴 수 없어요.")){db.records=db.records.filter(r=>r.id!==id);save();openTrash();render()}}
  else if(a==="purgeall"){const n=db.records.filter(r=>r.del).length;if(confirm("휴지통의 기록 "+n+"개를 모두 완전히 지울까요? 되돌릴 수 없어요.")){db.records=db.records.filter(r=>!r.del);save();openTrash();render()}}
  else if(a==="inboxOpen")openInbox();
  else if(a==="inboxPick")pickInbox();
  else if(a==="inboxRecheck"){inboxHide=false;inboxCheck().then(()=>{render();openInbox()})}
  else if(a==="inboxOff"){if(confirm("받은편지함 연결을 끊을까요? 이미 넣은 기록은 그대로예요.")){db.settings.inboxFile=null;inbox=[];inboxMsg="";save();render();openInbox()}}
  else if(a==="inboxYes")inboxAccept();
  else if(a==="inboxLater"){inboxHide=true;render()}
  else if(a==="help")openHelp();
  else if(a==="logout")logout();
});
document.addEventListener("submit",e=>{
  if(e.target.dataset.form==="quick"){
    e.preventDefault();
    const t=$("#qt").value.trim();if(!t){toast("한 줄을 적어 주세요");return}
    const now=Date.now(),kid=allKinds().some(k=>k.id==="daily")?"daily":visKinds()[0].id;
    db.records.push({id:uid(),kind:kid,date:today(),title:t,note:"",rating:0,tags:[],x:{},ts:now,upd:now});
    save();render();toast("저장했어요");
  }
});
document.addEventListener("input",e=>{
  const id=e.target.id;
  if(id==="fq"){S.q=e.target.value;updateResults()}
  else if(id==="fmin"){S.min=+e.target.value;updateResults()}
  else if(id==="ffrom"){S.from=e.target.value;updateResults()}
  else if(id==="fto"){S.to=e.target.value;updateResults()}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&$("#modal").firstChild)closeSheet()});
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
boot();
</script>
</body>
</html>
